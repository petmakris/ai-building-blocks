<svg class="ov-svg" viewBox="0 0 1120 760" role="img" aria-label="Three kinds of caller reach Billpod's services. The screens call REST routes, which call the services directly. The in-app assistant and outside assistants over MCP both hand tool calls to one runner, which runs one of 50 tools, and each tool calls the same services. A rate limit kept on one REST route had to be copied into a tool by hand. A parity test checks that every route has a tool or a written reason.">
<defs>
<marker id="tl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="tl-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="tl-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
<marker id="tl-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker>
</defs>
<text class="ttl" x="24" y="38">Three kinds of caller, one set of rules: every path ends in the same services</text>

<text class="zl" x="24" y="94">WHO ASKS</text>
<text class="zl" x="300" y="94">ENTRY POINT · ITS OWN RULES</text>
<text class="zl" x="600" y="94">THE TOOL LAYER</text>
<text class="zl" x="890" y="94">THE SERVICES</text>

<!-- callers -->
<rect class="bx" x="24" y="129" width="230" height="86" rx="8"/>
<text class="nm" x="42" y="164">A person on the screens</text>
<text class="sb" x="42" y="188">taps Pay on a bill</text>

<rect class="bx blue" x="24" y="307" width="230" height="86" rx="8"/>
<text class="nm" x="42" y="342">A person in the app's chat</text>
<text class="sb" x="42" y="366">"I paid the electricity bill"</text>

<rect class="bx blue" x="24" y="487" width="230" height="86" rx="8"/>
<text class="nm" x="42" y="522">Claude or ChatGPT</text>
<text class="sb" x="42" y="546">an outside assistant, own model</text>

<!-- entry points -->
<rect class="bx" x="300" y="124" width="260" height="96" rx="8"/>
<text class="nm mono" x="318" y="156">REST /api/billpod</text>
<text class="sb" x="318" y="180">signed-in session</text>
<text class="sb amber" x="318" y="202">upload limit: 30 a minute</text>

<rect class="bx blue" x="300" y="296" width="260" height="108" rx="8"/>
<text class="nm" x="318" y="328">Ask Billpod</text>
<text class="sb" x="318" y="352">Gemini picks one of 46 tools</text>
<text class="sb blue" x="318" y="376">a card first for 31 tools</text>

<rect class="bx blue" x="300" y="476" width="260" height="108" rx="8"/>
<text class="nm mono" x="318" y="508">MCP /mcp</text>
<text class="sb" x="318" y="532">OAuth token, scopes per tool</text>
<text class="sb blue" x="318" y="556">tools/list shows all 50</text>

<!-- tool layer zone -->
<rect class="zone red" x="596" y="260" width="258" height="370" rx="10"/>
<text class="zn red" x="614" y="286">defined once,</text>
<text class="zn red" x="614" y="306">shared by both AI entry points</text>
<rect class="bx red" x="616" y="336" width="218" height="104" rx="8"/>
<text class="nm mono" x="634" y="368">runTool</text>
<text class="sb" x="634" y="392">checks scopes and input</text>
<text class="sb" x="634" y="414">a failure becomes a result</text>
<rect class="bx red" x="616" y="490" width="218" height="120" rx="8"/>
<text class="nm" x="634" y="522">50 tools</text>
<text class="sb" x="634" y="546"><tspan class="mono">mark_paid</tspan> and 49 more</text>
<text class="sb" x="634" y="568">typed input, one handler</text>
<text class="sb amber" x="634" y="594">upload limit copied in</text>

<!-- services -->
<rect class="bx green" x="890" y="296" width="206" height="290" rx="8"/>
<text class="nm" x="908" y="328">Billpod services</text>
<text class="sb" x="908" y="352">the rules live here</text>
<text class="sb mono" x="908" y="390">bills.pay</text>
<text class="sb green" x="908" y="412">refuses a 2nd payment</text>
<text class="sb green" x="908" y="434">checks the household</text>
<text class="sb" x="908" y="472">every caller obeys</text>
<text class="sb" x="908" y="494">the same checks</text>

<rect class="bx" x="890" y="670" width="206" height="66" rx="8"/>
<text class="nm" x="908" y="698">Database</text>
<text class="sb" x="908" y="720">households, bills, payments</text>

<!-- parity test -->
<rect class="bx green" x="300" y="670" width="554" height="66" rx="8"/>
<text class="nm" x="318" y="698">Parity test</text>
<text class="sb" x="318" y="720">all 79 REST routes: 47 have a tool, 32 a written reason why not</text>

<!-- legend -->
<line class="ar" x1="24" y1="652" x2="60" y2="652" marker-end="url(#tl-a)"/>
<text class="sb" x="70" y="656">calls</text>
<line class="ar blue" x1="24" y1="680" x2="60" y2="680" marker-end="url(#tl-b)"/>
<text class="sb" x="70" y="684">an AI call</text>
<line class="ar amber dash" x1="24" y1="708" x2="60" y2="708" marker-end="url(#tl-m)"/>
<text class="sb" x="70" y="712">a rule copied by hand</text>

<!-- arrows -->
<line class="ar" x1="254" y1="172" x2="296" y2="172" marker-end="url(#tl-a)"/>
<line class="ar blue" x1="254" y1="350" x2="296" y2="350" marker-end="url(#tl-b)"/>
<line class="ar blue" x1="254" y1="530" x2="296" y2="530" marker-end="url(#tl-b)"/>
<path class="ar" d="M560,150 H993 V292" marker-end="url(#tl-a)"/>
<text class="lb" x="776" y="140" text-anchor="middle">calls the services directly</text>
<path class="ar amber dash" d="M560,196 H845 V590 H838" marker-end="url(#tl-m)"/>
<text class="lb amber" x="702" y="188" text-anchor="middle">copied by hand into a tool</text>
<path class="ar blue" d="M560,350 C588,350 590,376 612,376" marker-end="url(#tl-b)"/>
<path class="ar blue" d="M560,530 C592,530 588,406 612,406" marker-end="url(#tl-b)"/>
<line class="ar red" x1="680" y1="440" x2="680" y2="486" marker-end="url(#tl-r)"/>
<text class="lb" x="690" y="468">runs one</text>
<line class="ar red" x1="834" y1="538" x2="886" y2="538" marker-end="url(#tl-r)"/>
<line class="ar" x1="993" y1="586" x2="993" y2="666" marker-end="url(#tl-a)"/>
</svg>
