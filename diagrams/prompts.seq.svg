r-end="url(#prompts-seq-a)"/><circle class="bd solid" cx="106" cy="1159" r="10"/><text class="n" x="106" y="1163.5">7</text></g><rect class="bx green" x="24" y="1239" width="897" height="68" rx="8" data-p="1" data-r="7"/><text class="nm green" x="42" y="1267" data-p="1" data-r="7">The model reads all 15 rules again</text><text class="sb" x="42" y="1291" data-p="1" data-r="7">The heal writes no archive row, so the next startup can heal again. Tutor replies still carry no prompt version; only lesson notes do.</text></svg>