<svg class="vz" viewBox="0 0 1123 1056" role="img" aria-label="Two features, the rater and the tutor, send every model call into one gateway. The gateway checks who pays, lists the models to try, calls one model with retries inside a time budget, and on failure falls back to the next model with a fresh budget. In the example the rater&#x27;s Flash Lite call fails with 503 and Flash answers, and the spend log shows the call cost about four times as much. When no model is left, the feature degrades." data-vz="map"><defs><marker id="gateway-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="gateway-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="gateway-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="gateway-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="gateway-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="gateway-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">One gateway checks who pays, retries, falls back and prices every model attempt</text><text class="zl" x="38" y="70">WHO CALLS</text><text class="zl" x="292" y="70">THE GATEWAY · EVERY CALL PASSES HERE</text><text class="zl" x="705" y="70">GEMINI · AN EXAMPLE RATER CALL</text><rect class="zone red" x="278" y="88" width="355" height="736" rx="10" data-p="1" data-b="2" data-r="1"/><rect class="bx" x="38" y="120" width="198" height="90" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="150" data-p="1" data-b="1" data-r="1">Rater</text><text class="sb mono" x="56" y="172" data-p="1" data-b="1" data-r="1">gemini-2.5-flash-lite</text><text class="sb" x="56" y="194" data-p="1" data-b="1" data-r="1">2 s budget · 500 tokens</text><rect class="bx" x="38" y="276" width="198" height="90" rx="8" data-p="1" data-b="1"/><text class="nm" x="56" y="306" data-p="1" data-b="1">Tutor</text><text class="sb mono" x="56" y="328" data-p="1" data-b="1">gemini-2.5-flash</text><text class="sb" x="56" y="350" data-p="1" data-b="1">4 s budget · 700 tokens</text><rect class="bx amber" x="38" y="700" width="198" height="112" rx="8" data-p="1" data-b="4"/><text class="nm" x="56" y="730" data-p="1" data-b="4">All models failed</text><text class="sb" x="56" y="752" data-p="1" data-b="4">the feature degrades:</text><text class="sb amber" x="56" y="774" data-p="1" data-b="4">a line written in advance,</text><text class="sb amber" x="56" y="796" data-p="1" data-b="4">or a turn with no score</text><rect class="bx green" x="292" y="120" width="327" height="112" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="310" y="150" data-p="1" data-b="2" data-r="1">1 · Who pays?</text><text class="sb" x="310" y="172" data-p="1" data-b="2" data-r="1">a user and a feature, or a reason</text><text class="sb green" x="310" y="194" data-p="1" data-b="2" data-r="1">none: refused, no request sent</text><text class="sb" x="310" y="216" data-p="1" data-b="2" data-r="1">example: userId 42 · <tspan class="mono">onboarding_level_chat</tspan></text><rect class="bx" x="292" y="276" width="327" height="112" rx="8" data-p="1" data-b="2" data-r="2"/><text class="nm" x="310" y="306" data-p="1" data-b="2" data-r="2">2 · List the models to try</text><text class="sb" x="310" y="328" data-p="1" data-b="2" data-r="2">the named model first, then every</text><text class="sb" x="310" y="350" data-p="1" data-b="2" data-r="2">other enabled model, by priority</text><text class="sb" x="310" y="372" data-p="1" data-b="2" data-r="2">rater: [Flash Lite, Flash]</text><rect class="bx red" x="292" y="432" width="327" height="224" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="310" y="462" data-p="1" data-b="3" data-r="3">3 · Call one model</text><text class="sb" x="310" y="484" data-p="1" data-b="3" data-r="3">holds the API key; no feature sees it</text><text class="sb" x="310" y="506" data-p="1" data-b="3" data-r="3">retries 429, 500, 502, 503, 504</text><text class="sb" x="310" y="528" data-p="1" data-b="3" data-r="3">waits 3 s, then 6 s; at most 3 tries</text><text class="sb amber" x="310" y="550" data-p="1" data-b="3" data-r="3">no wait past the budget: give up</text><text class="sb" x="310" y="582" data-p="1" data-b="3" data-r="4">records every attempt, failures too</text><rect class="bx red" x="292" y="700" width="327" height="112" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="310" y="730" data-p="1" data-b="4" data-r="5">4 · Failed? Next model</text><text class="sb" x="310" y="752" data-p="1" data-b="4" data-r="5">each model gets a fresh budget</text><text class="sb amber" x="310" y="774" data-p="1" data-b="4" data-r="5">other answers, other price</text><text class="sb" x="310" y="796" data-p="1" data-b="4" data-r="5">none left: the call fails</text><rect class="bx amber" x="705" y="120" width="380" height="90" rx="8" data-p="1" data-b="4"/><text class="nm" x="723" y="150" data-p="1" data-b="4">Worst-case wait</text><text class="sb" x="723" y="172" data-p="1" data-b="4">the budget × the number of models</text><text class="sb amber" x="723" y="194" data-p="1" data-b="4">tunatutor: 120 s × 2 models = 4 minutes</text><rect class="bx" x="705" y="276" width="380" height="90" rx="8" data-p="1" data-b="3"/><text class="nm" x="723" y="306" data-p="1" data-b="3">Never retried: 400, 401, 403</text><text class="sb" x="723" y="328" data-p="1" data-b="3">a bad request or a bad key fails</text><text class="sb" x="723" y="350" data-p="1" data-b="3">the same way again, and may cost money</text><rect class="bx blue" x="705" y="432" width="380" height="90" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm mono" x="723" y="462" data-p="1" data-b="3" data-r="3">gemini-2.5-flash-lite</text><text class="sb" x="723" y="484" data-p="1" data-b="3" data-r="3">$0.10 in · $0.40 out per 1M tokens</text><text class="sb red" x="723" y="506" data-p="1" data-b="3" data-r="3">503: a 3 s wait does not fit 2 s</text><rect class="bx blue" x="705" y="566" width="380" height="90" rx="8" data-p="1" data-b="3" data-r="5"/><text class="nm mono" x="723" y="596" data-p="1" data-b="3" data-r="5">gemini-2.5-flash</text><text class="sb" x="723" y="618" data-p="1" data-b="3" data-r="5">$0.30 in · $2.50 out per 1M tokens</text><text class="sb green" x="723" y="640" data-p="1" data-b="3" data-r="5">200 at 1.1 s: 1,200 in, 150 out</text><rect class="bx" x="705" y="700" width="380" height="242" rx="8" data-p="1" data-b="5" data-r="4"/><text class="nm" x="723" y="730" data-p="1" data-b="5" data-r="4">Spend log</text><text class="sb" x="723" y="752" data-p="1" data-b="5" data-r="4"><tspan class="mono">provider_usage_events</tspan></text><text class="sb" x="723" y="774" data-p="1" data-b="5" data-r="4">one row per token kind, priced when written</text><text class="sb red" x="723" y="806" data-p="1" data-b="5" data-r="4">Flash Lite · input · 0 tokens · error · $0</text><text class="sb" x="723" y="828" data-p="1" data-b="5" data-r="6">Flash · input · 1,200 tokens · $0.00036</text><text class="sb" x="723" y="850" data-p="1" data-b="5" data-r="6">Flash · output · 150 tokens · $0.000375</text><text class="sb amber" x="723" y="882" data-p="1" data-b="5" data-r="6">total $0.000735; on Flash Lite $0.00018</text><text class="sb amber" x="723" y="904" data-p="1" data-b="5" data-r="6">the fallback made the call about 4× dearer</text><text class="sb" x="723" y="926" data-p="1" data-b="5" data-r="6">a cost report: one <tspan class="mono">GROUP BY</tspan> over feature, user or model</text><path class="ar dash" d="M619,630 L662,630 L662,810 L701,810" marker-end="url(#gateway-map-a)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M236,165 L288,165" marker-end="url(#gateway-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M236,321 L264,321 L264,176 L288,176" marker-end="url(#gateway-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M455,232 L455,272" marker-end="url(#gateway-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M455,388 L455,428" marker-end="url(#gateway-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar blue" d="M619,463 L701,463" marker-end="url(#gateway-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar red dash" d="M705,491 L623,491" marker-end="url(#gateway-map-r)" data-p="1" data-b="3" data-base="1"/><path class="ar blue" d="M619,577 L701,577" marker-end="url(#gateway-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M705,597 L623,597" marker-end="url(#gateway-map-g)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M292,544 L153,544 L153,370" marker-end="url(#gateway-map-g)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M455,656 L455,696" marker-end="url(#gateway-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar red" d="M545,700 L545,660" marker-end="url(#gateway-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar amber" d="M292,756 L240,756" marker-end="url(#gateway-map-m)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M236,165 L288,165" marker-end="url(#gateway-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M455,232 L455,272" marker-end="url(#gateway-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M455,388 L455,428" marker-end="url(#gateway-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar blue" d="M619,463 L701,463" marker-end="url(#gateway-map-b)" data-p="1" data-r="3" data-route="1"/><path class="ar red dash" d="M705,491 L623,491" marker-end="url(#gateway-map-r)" data-p="1" data-r="3" data-route="1"/><path class="ar dash" d="M619,618 L674,618 L674,790 L701,790" marker-end="url(#gateway-map-a)" data-p="1" data-r="4" data-route="1"/><path class="ar red" d="M455,656 L455,696" marker-end="url(#gateway-map-r)" data-p="1" data-r="5" data-route="1"/><path class="ar blue" d="M619,577 L701,577" marker-end="url(#gateway-map-b)" data-p="1" data-r="5" data-route="1"/><path class="ar green" d="M705,597 L623,597" marker-end="url(#gateway-map-g)" data-p="1" data-r="5" data-route="1"/><path class="ar dash" d="M619,644 L652,644 L652,840 L701,840" marker-end="url(#gateway-map-a)" data-p="1" data-r="6" data-route="1"/><path class="ar green" d="M292,544 L278,544 L278,181 L240,181" marker-end="url(#gateway-map-g)" data-p="1" data-r="6" data-route="1"/><text class="lb" x="665" y="452" text-anchor="middle" data-p="1" data-b="3" data-base="1">attempt 1</text><text class="lb" x="666" y="566" text-anchor="middle" data-p="1" data-b="3" data-base="1">attempt 2</text><text class="lb" x="165" y="455" data-p="1" data-b="3" data-base="1">answer</text><text class="lb" x="557" y="685" data-p="1" data-b="4" data-base="1">fallback</text><circle class="bd solid" cx="257" cy="165" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="257" y="169.5" data-p="1" data-r="1" data-route="1">1</text><circle class="bd solid" cx="455" cy="252" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="455" y="256.5" data-p="1" data-r="2" data-route="1">2</text><circle class="bd solid" cx="640" cy="463" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="640" y="467.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="640" y1="463" x2="641" y2="422" data-p="1" data-r="3" data-route="1"/><text class="lb" x="688" y="417" text-anchor="middle" data-p="1" data-r="3" data-route="1">call, 2 s budget</text><circle class="bd dash" cx="640" cy="618" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="640" y="622.5" data-p="1" data-r="4" data-route="1">4</text><text class="lb" x="686" y="691" data-p="1" data-r="4" data-route="1">0 tokens · error</text><circle class="bd solid" cx="640" cy="577" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="640" y="581.5" data-p="1" data-r="5" data-route="1">5</text><line class="lk" x1="640" y1="577" x2="641" y2="556" data-p="1" data-r="5" data-route="1"/><text class="lb" x="720" y="551" text-anchor="middle" data-p="1" data-r="5" data-route="1">fallback, fresh 2 s budget</text><circle class="bd dash" cx="652" cy="665" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="652" y="669.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="652" y1="665" x2="612" y2="666" data-p="1" data-r="6" data-route="1"/><text class="lb" x="556" y="679" text-anchor="middle" data-p="1" data-r="6" data-route="1">Flash · $0.000735</text><circle class="bd solid" cx="278" cy="523" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="278" y="527.5" data-p="1" data-r="6" data-route="1">6</text><text class="lb" x="266" y="386" text-anchor="end" data-p="1" data-r="6" data-route="1">the answer</text><line class="ar" x1="24" y1="990.0" x2="58" y2="990.0" marker-end="url(#gateway-map-a)"/><text class="sb" x="68" y="994">a feature's call</text><line class="ar blue" x1="188.49560000000002" y1="990.0" x2="222.49560000000002" y2="990.0" marker-end="url(#gateway-map-b)"/><text class="sb" x="232" y="994">a request to Gemini</text><line class="ar red dash" x1="382.26590000000004" y1="990.0" x2="416.26590000000004" y2="990.0" marker-end="url(#gateway-map-r)"/><text class="sb" x="426" y="994">an error reply</text><line class="ar green" x1="539.5023000000001" y1="990.0" x2="573.5023000000001" y2="990.0" marker-end="url(#gateway-map-g)"/><text class="sb" x="584" y="994">a good reply</text><line class="ar red" x1="690.5234000000002" y1="990.0" x2="724.5234000000002" y2="990.0" marker-end="url(#gateway-map-r)"/><text class="sb" x="735" y="994">fallback</text><line class="ar dash" x1="812.7521000000002" y1="990.0" x2="846.7521000000002" y2="990.0" marker-end="url(#gateway-map-a)"/><text class="sb" x="857" y="994">a spend record</text><line class="ar amber" x1="24" y1="1020.0" x2="58" y2="1020.0" marker-end="url(#gateway-map-m)"/><text class="sb" x="68" y="1024">no model left</text></svg>