<svg class="vz" viewBox="0 0 1964 1138" role="img" aria-label="The request path across the blocks: R0 front door, R1 edge and controller, R2 admission and input guardrails, R3 cache check, R4 router, R5 context assembly, R6 gateway call, R7 settle and meter, R8 classify the reply, R9 agent or workflow loop, R10 per-call policy, R11 human in the loop, R12 output handling, R13 response and memory write-back. Cross-cutting: R14 tracing, R15 online evals, R16 drift detection, R17 feedback and triage. Between releases: R18 offline eval gate, R19 staged rollout, R20 governance." data-vz="map"><defs><marker id="home-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="home-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="home-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="home-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="home-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="home-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">One request passes through R0 to R13 in order; R14 to R20 run beside every request or between releases</text><text class="zl" x="38" y="70">FRONT DOOR, EDGE</text><text class="zl" x="441" y="70">ADMISSION, CACHE, ROUTER</text><text class="zl" x="832" y="70">CONTEXT, GATEWAY CALL, METER, CLASSIFY</text><text class="zl" x="1222" y="70">AGENT LOOP, TOOL POLICY, HUMAN</text><text class="zl" x="1596" y="70">OUTPUT, WRITE-BACK</text><rect class="zone amber" x="24" y="730" width="1530" height="144" rx="10" data-p="1"/><text class="zn amber" x="40" y="750" data-p="1">cross-cutting: they run beside every request</text><rect class="zone amber" x="24" y="922" width="1156" height="144" rx="10" data-p="1"/><text class="zn amber" x="40" y="942" data-p="1">between releases</text><rect class="bx" x="38" y="88" width="347" height="100" rx="8" data-p="1" data-r="1"/><text class="nm" x="56" y="118" data-p="1" data-r="1">R0 · Front door</text><text class="sb" x="56" y="140" data-p="1" data-r="1">each door authenticates and builds its own context</text><text class="sb" x="56" y="172" data-p="1" data-r="1"><tspan class="mono">toollayer</tspan> <tspan class="mono">tools</tspan></text><rect class="bx" x="38" y="254" width="347" height="122" rx="8" data-p="1" data-r="2"/><text class="nm" x="56" y="284" data-p="1" data-r="2">R1 · Edge and controller</text><text class="sb" x="56" y="306" data-p="1" data-r="2">resolve tenant and entitlements</text><text class="sb" x="56" y="338" data-p="1" data-r="2"><tspan class="mono">guardrails</tspan> <tspan class="mono">tools</tspan> <tspan class="mono">context</tspan></text><text class="sb" x="56" y="360" data-p="1" data-r="2"><tspan class="mono">agents</tspan></text><rect class="bx" x="441" y="88" width="335" height="100" rx="8" data-p="1" data-r="3"/><text class="nm" x="459" y="118" data-p="1" data-r="3">R2 · Admission and input guardrails</text><text class="sb" x="459" y="140" data-p="1" data-r="3">may short-circuit to a canned reply</text><text class="sb" x="459" y="172" data-p="1" data-r="3"><tspan class="mono">gateway</tspan> <tspan class="mono">guardrails</tspan></text><rect class="bx" x="441" y="254" width="335" height="100" rx="8" data-p="1" data-r="4"/><text class="nm" x="459" y="284" data-p="1" data-r="4">R3 · Cache check</text><text class="sb" x="459" y="306" data-p="1" data-r="4">a hit returns at once</text><text class="sb" x="459" y="338" data-p="1" data-r="4"><tspan class="mono">caching</tspan></text><rect class="bx" x="441" y="420" width="335" height="100" rx="8" data-p="1" data-r="5"/><text class="nm" x="459" y="450" data-p="1" data-r="5">R4 · Router</text><text class="sb" x="459" y="472" data-p="1" data-r="5">picks the workflow and the model tier</text><text class="sb" x="459" y="504" data-p="1" data-r="5"><tspan class="mono">gateway</tspan> <tspan class="mono">agents</tspan></text><rect class="bx" x="832" y="88" width="334" height="122" rx="8" data-p="1" data-r="6"/><text class="nm" x="850" y="118" data-p="1" data-r="6">R5 · Context assembly</text><text class="sb" x="850" y="140" data-p="1" data-r="6">inside the token budget</text><text class="sb" x="850" y="172" data-p="1" data-r="6"><tspan class="mono">prompts</tspan> <tspan class="mono">context</tspan> <tspan class="mono">memory</tspan></text><text class="sb" x="850" y="194" data-p="1" data-r="6"><tspan class="mono">rag</tspan> <tspan class="mono">tools</tspan> <tspan class="mono">caching</tspan></text><rect class="bx blue" x="832" y="254" width="334" height="100" rx="8" data-p="1" data-r="7"/><text class="nm" x="850" y="284" data-p="1" data-r="7">R6 · Gateway call</text><text class="sb" x="850" y="306" data-p="1" data-r="7">retries inside the time budget, fallback</text><text class="sb" x="850" y="338" data-p="1" data-r="7"><tspan class="mono">gateway</tspan> <tspan class="mono">structured</tspan> <tspan class="mono">context</tspan></text><rect class="bx" x="832" y="420" width="334" height="100" rx="8" data-p="1" data-r="8"/><text class="nm" x="850" y="450" data-p="1" data-r="8">R7 · Settle and meter every attempt</text><text class="sb" x="850" y="472" data-p="1" data-r="8">ledger rows priced at write time</text><text class="sb" x="850" y="504" data-p="1" data-r="8"><tspan class="mono">gateway</tspan> <tspan class="mono">observability</tspan> <tspan class="mono">caching</tspan></text><rect class="bx" x="832" y="586" width="334" height="100" rx="8" data-p="1" data-r="9"/><text class="nm" x="850" y="616" data-p="1" data-r="9">R8 · Classify the reply</text><text class="sb" x="850" y="638" data-p="1" data-r="9">text, tool calls, refused or malformed</text><text class="sb" x="850" y="670" data-p="1" data-r="9"><tspan class="mono">gateway</tspan> <tspan class="mono">structured</tspan> <tspan class="mono">tools</tspan></text><rect class="bx" x="1222" y="88" width="318" height="100" rx="8" data-p="1" data-r="10"/><text class="nm" x="1240" y="118" data-p="1" data-r="10">R9 · Agent or workflow loop</text><text class="sb" x="1240" y="140" data-p="1" data-r="10">stop at a step, cost or time budget</text><text class="sb" x="1240" y="172" data-p="1" data-r="10"><tspan class="mono">agents</tspan> <tspan class="mono">tools</tspan> <tspan class="mono">context</tspan></text><rect class="bx" x="1222" y="254" width="318" height="100" rx="8" data-p="1" data-r="11"/><text class="nm" x="1240" y="284" data-p="1" data-r="11">R10 · Per-call policy before a tool runs</text><text class="sb" x="1240" y="306" data-p="1" data-r="11">scope to the caller's tenant</text><text class="sb" x="1240" y="338" data-p="1" data-r="11"><tspan class="mono">guardrails</tspan> <tspan class="mono">tools</tspan> <tspan class="mono">sandbox</tspan></text><rect class="bx" x="1222" y="420" width="318" height="122" rx="8" data-p="1" data-r="12"/><text class="nm" x="1240" y="450" data-p="1" data-r="12">R11 · Human in the loop</text><text class="sb" x="1240" y="472" data-p="1" data-r="12">the turn pauses, the person approves</text><text class="sb" x="1240" y="504" data-p="1" data-r="12"><tspan class="mono">hitl</tspan> <tspan class="mono">agents</tspan> <tspan class="mono">context</tspan></text><text class="sb" x="1240" y="526" data-p="1" data-r="12"><tspan class="mono">tools</tspan> <tspan class="mono">guardrails</tspan></text><rect class="bx" x="1596" y="88" width="330" height="100" rx="8" data-p="1" data-r="13"/><text class="nm" x="1614" y="118" data-p="1" data-r="13">R12 · Output handling</text><text class="sb" x="1614" y="140" data-p="1" data-r="13">escape before rendering</text><text class="sb" x="1614" y="172" data-p="1" data-r="13"><tspan class="mono">structured</tspan> <tspan class="mono">guardrails</tspan></text><rect class="bx" x="1596" y="254" width="330" height="100" rx="8" data-p="1" data-r="14"/><text class="nm" x="1614" y="284" data-p="1" data-r="14">R13 · Response and memory write-back</text><text class="sb" x="1614" y="306" data-p="1" data-r="14">stored by a worker</text><text class="sb" x="1614" y="338" data-p="1" data-r="14"><tspan class="mono">memory</tspan></text><rect class="bx" x="38" y="762" width="347" height="100" rx="8" data-p="1"/><text class="nm" x="56" y="792" data-p="1">R14 · Tracing and the call record</text><text class="sb" x="56" y="814" data-p="1">one record per model call</text><text class="sb" x="56" y="846" data-p="1"><tspan class="mono">observability</tspan> <tspan class="mono">governance</tspan> <tspan class="mono">gateway</tspan></text><rect class="bx" x="441" y="762" width="335" height="100" rx="8" data-p="1"/><text class="nm" x="459" y="792" data-p="1">R15 · Online evals</text><text class="sb" x="459" y="814" data-p="1">off the request path</text><text class="sb" x="459" y="846" data-p="1"><tspan class="mono">observability</tspan> <tspan class="mono">evals</tspan></text><rect class="bx" x="832" y="762" width="334" height="100" rx="8" data-p="1"/><text class="nm" x="850" y="792" data-p="1">R16 · Drift detection</text><text class="sb" x="850" y="814" data-p="1">daily scores against a band</text><text class="sb" x="850" y="846" data-p="1"><tspan class="mono">observability</tspan> <tspan class="mono">rollout</tspan></text><rect class="bx" x="1222" y="762" width="318" height="100" rx="8" data-p="1"/><text class="nm" x="1240" y="792" data-p="1">R17 · Feedback and triage</text><text class="sb" x="1240" y="814" data-p="1">triaged into new eval cases</text><text class="sb" x="1240" y="846" data-p="1"><tspan class="mono">rollout</tspan> <tspan class="mono">evals</tspan></text><rect class="bx" x="38" y="954" width="347" height="100" rx="8" data-p="1"/><text class="nm" x="56" y="984" data-p="1">R18 · Offline eval gate</text><text class="sb" x="56" y="1006" data-p="1">bars fixed in advance</text><text class="sb" x="56" y="1038" data-p="1"><tspan class="mono">evals</tspan> <tspan class="mono">prompts</tspan> <tspan class="mono">rollout</tspan></text><rect class="bx" x="441" y="954" width="335" height="100" rx="8" data-p="1"/><text class="nm" x="459" y="984" data-p="1">R19 · Staged rollout</text><text class="sb" x="459" y="1006" data-p="1">shadow mode, log mode, eval-gated flag, canary</text><text class="sb" x="459" y="1038" data-p="1"><tspan class="mono">rollout</tspan></text><rect class="bx" x="832" y="954" width="334" height="100" rx="8" data-p="1"/><text class="nm" x="850" y="984" data-p="1">R20 · Governance</text><text class="sb" x="850" y="1006" data-p="1">named approver for high-risk output</text><text class="sb" x="850" y="1038" data-p="1"><tspan class="mono">governance</tspan></text><path class="ar" d="M212,188 L212,250" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M212,188 L212,250" marker-end="url(#home-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M385,315 L413,315 L413,138 L437,138" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M385,315 L427,315 L427,138 L437,138" marker-end="url(#home-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M609,188 L609,250" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M609,188 L609,250" marker-end="url(#home-map-a)" data-p="1" data-r="4" data-route="1"/><path class="ar" d="M609,354 L609,416" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M609,354 L609,416" marker-end="url(#home-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar" d="M776,470 L804,470 L804,149 L828,149" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M776,470 L818,470 L818,149 L828,149" marker-end="url(#home-map-a)" data-p="1" data-r="6" data-route="1"/><path class="ar" d="M999,210 L999,250" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M999,210 L999,250" marker-end="url(#home-map-a)" data-p="1" data-r="7" data-route="1"/><path class="ar" d="M999,354 L999,416" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M999,354 L999,416" marker-end="url(#home-map-a)" data-p="1" data-r="8" data-route="1"/><path class="ar" d="M999,520 L999,582" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M999,520 L999,582" marker-end="url(#home-map-a)" data-p="1" data-r="9" data-route="1"/><path class="ar" d="M1166,636 L1194,636 L1194,138 L1218,138" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M1166,636 L1208,636 L1208,138 L1218,138" marker-end="url(#home-map-a)" data-p="1" data-r="10" data-route="1"/><path class="ar" d="M1381,188 L1381,250" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M1381,188 L1381,250" marker-end="url(#home-map-a)" data-p="1" data-r="11" data-route="1"/><path class="ar" d="M1381,354 L1381,416" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M1381,354 L1381,416" marker-end="url(#home-map-a)" data-p="1" data-r="12" data-route="1"/><path class="ar" d="M1540,481 L1568,481 L1568,138 L1592,138" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M1540,481 L1582,481 L1582,138 L1592,138" marker-end="url(#home-map-a)" data-p="1" data-r="13" data-route="1"/><path class="ar" d="M1761,188 L1761,250" marker-end="url(#home-map-a)" data-p="1" data-base="1"/><path class="ar" d="M1761,188 L1761,250" marker-end="url(#home-map-a)" data-p="1" data-r="14" data-route="1"/><path class="ar blue" d="M1222,118 L1180,118 L1180,284 L1170,284" marker-end="url(#home-map-b)" data-p="1" data-r="10" data-route="1"/><circle class="bd solid" cx="212" cy="209" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="212" y="213.5" data-p="1" data-r="2" data-route="1">1</text><circle class="bd solid" cx="427" cy="294" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="427" y="298.5" data-p="1" data-r="3" data-route="1">2</text><circle class="bd solid" cx="609" cy="209" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="609" y="213.5" data-p="1" data-r="4" data-route="1">3</text><circle class="bd solid" cx="609" cy="375" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="609" y="379.5" data-p="1" data-r="5" data-route="1">4</text><circle class="bd solid" cx="818" cy="449" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="818" y="453.5" data-p="1" data-r="6" data-route="1">5</text><circle class="bd solid" cx="999" cy="230" r="11" data-p="1" data-r="7" data-route="1"/><text class="n" x="999" y="234.5" data-p="1" data-r="7" data-route="1">6</text><circle class="bd solid" cx="999" cy="375" r="11" data-p="1" data-r="8" data-route="1"/><text class="n" x="999" y="379.5" data-p="1" data-r="8" data-route="1">7</text><circle class="bd solid" cx="999" cy="541" r="11" data-p="1" data-r="9" data-route="1"/><text class="n" x="999" y="545.5" data-p="1" data-r="9" data-route="1">8</text><circle class="bd solid" cx="1208" cy="615" r="11" data-p="1" data-r="10" data-route="1"/><text class="n" x="1208" y="619.5" data-p="1" data-r="10" data-route="1">9</text><circle class="bd solid" cx="1381" cy="209" r="11" data-p="1" data-r="11" data-route="1"/><text class="n" x="1381" y="213.5" data-p="1" data-r="11" data-route="1">10</text><circle class="bd solid" cx="1381" cy="375" r="11" data-p="1" data-r="12" data-route="1"/><text class="n" x="1381" y="379.5" data-p="1" data-r="12" data-route="1">11</text><circle class="bd solid" cx="1582" cy="460" r="11" data-p="1" data-r="13" data-route="1"/><text class="n" x="1582" y="464.5" data-p="1" data-r="13" data-route="1">12</text><circle class="bd solid" cx="1761" cy="209" r="11" data-p="1" data-r="14" data-route="1"/><text class="n" x="1761" y="213.5" data-p="1" data-r="14" data-route="1">13</text><text class="lb" x="1168" y="227" text-anchor="end" data-p="1" data-r="10" data-route="1">call the model again</text><line class="ar" x1="24" y1="1102.0" x2="58" y2="1102.0" marker-end="url(#home-map-a)"/><text class="sb" x="68" y="1106">the request's next step</text><line class="ar blue" x1="239.31779999999998" y1="1102.0" x2="273.3178" y2="1102.0" marker-end="url(#home-map-b)"/><text class="sb" x="283" y="1106">the model call, and R9 calling the model again</text></svg>