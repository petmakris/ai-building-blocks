<svg class="vz" viewBox="0 0 764 1295" role="img" aria-label="One sentence takes three model calls, and the write waits at a card" data-vz="sequence"><defs><marker id="tools-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="tools-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="tools-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="tools-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="tools-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="tools-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">One sentence takes three model calls, and the write waits at a card</text><text class="sub" x="24" y="62">Billpod's real rules. The ids and values are an example.</text><rect class="band" x="12" y="144" width="740" height="640" rx="10" data-p="1" data-r="1"/><text class="zl" x="24" y="166" data-p="1" data-r="1">REQUEST 1 · THE SENTENCE</text><rect class="band" x="12" y="790" width="740" height="403" rx="10" data-p="1" data-r="6"/><text class="zl" x="24" y="812" data-p="1" data-r="6">REQUEST 2 · APPROVE</text><line class="life" x1="83" y1="132" x2="83" y2="1197"/><line class="life" x1="223" y1="132" x2="223" y2="1197"/><line class="life" x1="363" y1="132" x2="363" y2="1197"/><line class="life" x1="503" y1="132" x2="503" y2=