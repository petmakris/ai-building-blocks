<svg class="vz" viewBox="0 0 1347 1122" role="img" aria-label="On every model call Billpod&#x27;s server builds the request again from five layers: the system prompt with today&#x27;s date, timezone and currency, 46 tool definitions, the newest chat history that fits 24,000 characters, the new message, and this answer&#x27;s tool calls and results. The model reads only that request; the tool loop runs a tool, appends its result and calls the model again, at most 6 times, and a write that needs a yes seals layer 5 into a ticket the browser carries. Older messages, earlier tool results and the household&#x27;s other bills are left out on purpose, because a 2025 test found 18 of 18 models answered better from about 300 relevant tokens than from about 113,000." data-vz="map"><defs><marker id="context-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="context-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="context-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="context-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="context-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="context-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The server builds every model call from scratch and sends only what the job needs</text><text class="zl" x="38" y="70">WHERE EACH PART COMES FROM</text><text class="zl" x="406" y="70">ONE MODEL REQUEST</text><text class="zl" x="1037" y="70">THE MODEL AND THE LOOP</text><rect class="zone red" x="392" y="88" width="554" height="736" rx="10" data-p="1" data-b="2" data-r="1"/><text class="zn red" x="408" y="108" data-p="1" data-b="2" data-r="1"><tspan class="mono">runTurn</tspan> builds all five layers again for every call</text><rect class="zone" x="24" y="894" width="922" height="156" rx="10" data-p="1" data-b="5" data-r="2"/><text class="zn" x="40" y="914" data-p="1" data-b="5" data-r="2">Left out on purpose</text><rect class="zone" x="1023" y="894" width="300" height="156" rx="10" data-p="1" data-b="5"/><text class="zn" x="1039" y="914" data-p="1" data-b="5">Why less</text><rect class="bx" x="38" y="120" width="296" height="90" rx="8" data-p="1" data-b="1" data-r="3"/><text class="nm" x="56" y="150" data-p="1" data-b="1" data-r="3">Household record</text><text class="sb" x="56" y="172" data-p="1" data-b="1" data-r="3">today, in its own timezone</text><text class="sb" x="56" y="194" data-p="1" data-b="1" data-r="3">currency, household name</text><rect class="bx" x="38" y="276" width="296" height="90" rx="8" data-p="1" data-b="1"/><text class="nm" x="56" y="306" data-p="1" data-b="1">Billpod's code</text><text class="sb" x="56" y="328" data-p="1" data-b="1">the prompt's fixed rules</text><text class="sb" x="56" y="350" data-p="1" data-b="1">46 tool definitions</text><rect class="bx" x="38" y="410" width="296" height="246" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="440" data-p="1" data-b="1" data-r="1">The browser</text><text class="sb" x="56" y="462" data-p="1" data-b="1" data-r="1">holds the chat</text><text class="sb" x="56" y="484" data-p="1" data-b="1" data-r="1">resends it every message</text><text class="sb" x="56" y="506" data-p="1" data-b="1" data-r="1">the newest 40, at most</text><text class="sb" x="56" y="528" data-p="1" data-b="1" data-r="1">the server stores none</text><rect class="bx amber" x="38" y="700" width="296" height="134" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="56" y="730" data-p="1" data-b="4" data-r="6">Approval ticket</text><text class="sb" x="56" y="752" data-p="1" data-b="4" data-r="6">made at a confirmation card</text><text class="sb amber" x="56" y="774" data-p="1" data-b="4" data-r="6">layer 5, sealed, 10 minutes</text><text class="sb" x="56" y="796" data-p="1" data-b="4" data-r="7">comes back with the yes</text><text class="sb" x="56" y="818" data-p="1" data-b="4" data-r="6">the browser can neither read nor change it</text><rect class="bx" x="406" y="120" width="526" height="112" rx="8" data-p="1" data-b="2" data-r="3"/><text class="nm" x="424" y="150" data-p="1" data-b="2" data-r="3">1 · System prompt</text><text class="sb" x="424" y="172" data-p="1" data-b="2" data-r="3">in the <tspan class="mono">systemPrompt</tspan> field</text><text class="sb" x="424" y="194" data-p="1" data-b="2" data-r="3">fixed rules + today's date, timezone, currency</text><text class="sb" x="424" y="216" data-p="1" data-b="2" data-r="3">changes once a day</text><rect class="bx" x="406" y="276" width="526" height="90" rx="8" data-p="1" data-b="2" data-r="4"/><text class="nm" x="424" y="306" data-p="1" data-b="2" data-r="4">2 · 46 tool definitions</text><text class="sb" x="424" y="328" data-p="1" data-b="2" data-r="4">in the <tspan class="mono">tools</tspan> field</text><text class="sb" x="424" y="350" data-p="1" data-b="2" data-r="4">all sent on every call · change per release</text><rect class="bx" x="406" y="410" width="526" height="112" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="424" y="440" data-p="1" data-b="2" data-r="1">3 · History</text><text class="sb" x="424" y="462" data-p="1" data-b="2" data-r="1">in the <tspan class="mono">messages</tspan> field</text><text class="sb" x="424" y="484" data-p="1" data-b="2" data-r="2">the newest whole messages within 24,000 chars</text><text class="sb" x="424" y="506" data-p="1" data-b="2" data-r="2">starts on a person's message</text><rect class="bx" x="406" y="566" width="526" height="90" rx="8" data-p="1" data-b="2" data-r="4"/><text class="nm" x="424" y="596" data-p="1" data-b="2" data-r="4">4 · The new message</text><text class="sb" x="424" y="618" data-p="1" data-b="2" data-r="4">in the <tspan class="mono">messages</tspan> field</text><text class="sb" x="424" y="640" data-p="1" data-b="2" data-r="4">the person's question, always kept</text><rect class="bx" x="406" y="700" width="526" height="112" rx="8" data-p="1" data-b="2" data-r="5"/><text class="nm" x="424" y="730" data-p="1" data-b="2" data-r="5">5 · Tool calls and results so far</text><text class="sb" x="424" y="752" data-p="1" data-b="2" data-r="5">in the <tspan class="mono">messages</tspan> field</text><text class="sb" x="424" y="774" data-p="1" data-b="2" data-r="5">this answer only: one more per model step</text><text class="sb" x="424" y="796" data-p="1" data-b="4" data-r="7">restored from the ticket after a yes</text><rect class="bx blue" x="1037" y="120" width="272" height="90" rx="8" data-p="1" data-b="3" data-r="4"/><text class="nm" x="1055" y="150" data-p="1" data-b="3" data-r="4">Gemini Flash</text><text class="sb blue" x="1055" y="172" data-p="1" data-b="3" data-r="4">reads only this request</text><text class="sb" x="1055" y="194" data-p="1" data-b="3" data-r="4">keeps nothing between calls</text><rect class="bx red" x="1037" y="276" width="272" height="246" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="1055" y="306" data-p="1" data-b="4" data-r="4">The tool loop</text><text class="sb green" x="1055" y="328" data-p="1" data-b="4" data-r="7">no tool calls in the reply: done</text><text class="sb" x="1055" y="350" data-p="1" data-b="4" data-r="4">a read: run it, then call again</text><text class="sb amber" x="1055" y="372" data-p="1" data-b="4" data-r="6">a write: a card for the person's yes</text><text class="sb" x="1055" y="394" data-p="1" data-b="4" data-r="7">at most 6 model calls per answer</text><text class="sb" x="1055" y="416" data-p="1" data-b="4" data-r="7">example: 3 model calls, 2 requests</text><rect class="bx" x="1037" y="700" width="272" height="90" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="1055" y="730" data-p="1" data-b="4" data-r="5">Bill tools</text><text class="sb" x="1055" y="752" data-p="1" data-b="4" data-r="5"><tspan class="mono">find_bills</tspan>, <tspan class="mono">mark_paid</tspan> and 44 more</text><text class="sb" x="1055" y="774" data-p="1" data-b="4" data-r="5">bills change, so always read fresh</text><rect class="bx" x="38" y="926" width="296" height="112" rx="8" data-p="1" data-b="5" data-r="2"/><text class="nm" x="56" y="956" data-p="1" data-b="5" data-r="2">Older messages</text><text class="sb" x="56" y="978" data-p="1" data-b="5" data-r="2">past 24,000 chars: dropped</text><text class="sb" x="56" y="1000" data-p="1" data-b="5" data-r="2">whole, never cut in half</text><text class="sb amber" x="56" y="1022" data-p="1" data-b="5" data-r="2">no error says what is gone</text><rect class="bx" x="406" y="926" width="260" height="112" rx="8" data-p="1" data-b="5" data-r="4"/><text class="nm" x="424" y="956" data-p="1" data-b="5" data-r="4">Old tool results</text><text class="sb" x="424" y="978" data-p="1" data-b="5" data-r="4">kept only as a note, example:</text><text class="sb mono" x="424" y="1000" data-p="1" data-b="5" data-r="4">mark_paid (electricity): done</text><text class="sb" x="424" y="1022" data-p="1" data-b="5" data-r="4">the model reads the data again</text><rect class="bx" x="722" y="926" width="210" height="112" rx="8" data-p="1" data-b="5" data-r="5"/><text class="nm" x="740" y="956" data-p="1" data-b="5" data-r="5">The household's bills</text><text class="sb" x="740" y="978" data-p="1" data-b="5" data-r="5">none sent up front</text><text class="sb" x="740" y="1000" data-p="1" data-b="5" data-r="5">fetched only when asked for</text><text class="sb amber" x="740" y="1022" data-p="1" data-b="5" data-r="5">an old look-alike misleads</text><rect class="bx" x="1037" y="926" width="272" height="112" rx="8" data-p="1" data-b="5"/><text class="nm" x="1055" y="956" data-p="1" data-b="5">Chroma test, July 2025</text><text class="sb" x="1055" y="978" data-p="1" data-b="5">18 of 18 models, same questions</text><text class="sb green" x="1055" y="1000" data-p="1" data-b="5">~300 relevant tokens: more correct</text><text class="sb red" x="1055" y="1022" data-p="1" data-b="5">all ~113,000 tokens: fewer correct</text><path class="ar" d="M334,165 L402,165" marker-end="url(#context-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M334,321 L370,321 L370,176 L402,176" marker-end="url(#context-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M334,321 L402,321" marker-end="url(#context-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M334,466 L402,466" marker-end="url(#context-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M334,611 L402,611" marker-end="url(#context-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M932,165 L1033,165" marker-end="url(#context-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar blue" d="M1173,210 L1173,272" marker-end="url(#context-map-b)" data-p="1" data-b="4" data-base="1"/><path class="ar red" d="M1173,522 L1173,696" marker-end="url(#context-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M1037,745 L936,745" marker-end="url(#context-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar amber dash" d="M406,756 L338,756" marker-end="url(#context-map-m)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M334,466 L402,466" marker-end="url(#context-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M334,165 L402,165" marker-end="url(#context-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar blue" d="M932,165 L1033,165" marker-end="url(#context-map-b)" data-p="1" data-r="4" data-route="1"/><path class="ar blue" d="M1073,210 L1073,272" marker-end="url(#context-map-b)" data-p="1" data-r="4" data-route="1"/><path class="ar red" d="M1073,522 L1073,696" marker-end="url(#context-map-r)" data-p="1" data-r="5" data-route="1"/><path class="ar" d="M1037,745 L936,745" marker-end="url(#context-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar blue" d="M1173,210 L1173,272" marker-end="url(#context-map-b)" data-p="1" data-r="6" data-route="1"/><path class="ar amber dash" d="M406,756 L338,756" marker-end="url(#context-map-m)" data-p="1" data-r="6" data-route="1"/><path class="ar amber dash" d="M334,770 L402,770" marker-end="url(#context-map-m)" data-p="1" data-r="7" data-route="1"/><text class="lb" x="986" y="154" text-anchor="middle" data-p="1" data-b="3" data-base="1">one call</text><text class="lb" x="1185" y="235" data-p="1" data-b="4" data-base="1">its reply</text><text class="lb" x="1185" y="607" data-p="1" data-b="4" data-base="1">runs the tool</text><text class="lb" x="992" y="734" text-anchor="middle" data-p="1" data-b="4" data-base="1">result added</text><text class="lb" x="364" y="745" text-anchor="middle" data-p="1" data-b="4" data-base="1">sealed</text><circle class="bd solid" cx="355" cy="466" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="355" y="470.5" data-p="1" data-r="1" data-route="1">1</text><line class="lk" x1="355" y1="466" x2="355" y2="395" data-p="1" data-r="1" data-route="1"/><text class="lb" x="307" y="390" text-anchor="middle" data-p="1" data-r="1" data-route="1">3 messages, at most 40</text><circle class="bd solid" cx="355" cy="165" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="355" y="169.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="355" y1="165" x2="355" y2="114" data-p="1" data-r="3" data-route="1"/><text class="lb" x="307" y="109" text-anchor="middle" data-p="1" data-r="3" data-route="1">Tue 2026-10-13 · CHF</text><circle class="bd solid" cx="953" cy="165" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="953" y="169.5" data-p="1" data-r="4" data-route="1">4</text><line class="lk" x1="953" y1="165" x2="953" y2="114" data-p="1" data-r="4" data-route="1"/><text class="lb" x="1065" y="109" text-anchor="middle" data-p="1" data-r="4" data-route="1">prompt · 46 tools · history · message</text><circle class="bd solid" cx="1073" cy="231" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="1073" y="235.5" data-p="1" data-r="4" data-route="1">4</text><text class="lb" x="1061" y="259" text-anchor="end" data-p="1" data-r="4" data-route="1">call <tspan class="mono">find_bills</tspan></text><circle class="bd solid" cx="1073" cy="543" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="1073" y="547.5" data-p="1" data-r="5" data-route="1">5</text><text class="lb mono" x="1085" y="607" data-p="1" data-r="5" data-route="1">find_bills("electricity")</text><circle class="bd solid" cx="1016" cy="745" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="1016" y="749.5" data-p="1" data-r="5" data-route="1">5</text><line class="lk" x1="1016" y1="745" x2="1016" y2="796" data-p="1" data-r="5" data-route="1"/><text class="lb" x="1048" y="809" text-anchor="middle" data-p="1" data-r="5" data-route="1">b_19 · version 3 · 84.20 CHF</text><circle class="bd solid" cx="1173" cy="231" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="1173" y="235.5" data-p="1" data-r="6" data-route="1">6</text><text class="lb" x="1185" y="259" data-p="1" data-r="6" data-route="1">call <tspan class="mono">mark_paid</tspan> b_19</text><circle class="bd dash" cx="385" cy="756" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="385" y="760.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="385" y1="756" x2="382" y2="685" data-p="1" data-r="6" data-route="1"/><text class="lb" x="321" y="680" text-anchor="middle" data-p="1" data-r="6" data-route="1">card + sealed ticket</text><circle class="bd dash" cx="355" cy="770" r="11" data-p="1" data-r="7" data-route="1"/><text class="n" x="355" y="774.5" data-p="1" data-r="7" data-route="1">7</text><line class="lk" x1="355" y1="770" x2="355" y2="831" data-p="1" data-r="7" data-route="1"/><text class="lb" x="419" y="844" text-anchor="middle" data-p="1" data-r="7" data-route="1">yes + same chat + ticket</text><line class="ar" x1="24" y1="1086.0" x2="58" y2="1086.0" marker-end="url(#context-map-a)"/><text class="sb" x="68" y="1090">feeds a layer</text><line class="ar blue" x1="177.6289" y1="1086.0" x2="211.6289" y2="1086.0" marker-end="url(#context-map-b)"/><text class="sb" x="222" y="1090">a model call and its reply</text><line class="ar red" x1="404.19039999999995" y1="1086.0" x2="438.19039999999995" y2="1086.0" marker-end="url(#context-map-r)"/><text class="sb" x="448" y="1090">the loop runs a tool</text><line class="ar amber dash" x1="596.4422999999999" y1="1086.0" x2="630.4422999999999" y2="1086.0" marker-end="url(#context-map-m)"/><text class="sb" x="640" y="1090">sealed, carried by the browser</text></svg>