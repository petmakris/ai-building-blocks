<svg class="vz" viewBox="0 0 863 1371" role="img" aria-label="The judge&#x27;s level is checked and stored, but the learner sees the rules&#x27; level" data-vz="sequence"><defs><marker id="rollout-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="rollout-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="rollout-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="rollout-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="rollout-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="rollout-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The judge's level is checked and stored, but the learner sees the rules' level</text><text class="sub" x="24" y="62">The chat is real test data from Lomem's code. The readout numbers in step 6 are made up (example).</text><rect class="band" x="12" y="144" width="839" height="785" rx="10" data-p="1" data-r="1"/><text class="zl" x="24" y="166" data-p="1" data-r="1">ONE CHAT · SHADOW MODE</text><rect class="band" x="12" y="935" width="839" height="334" rx="10" data-p="1" data-r="6"/><text class="zl" x="24" y="957" data-p="1" data-r="6">LATER · THE READOUT</text><line class="life" x1="103" y1="132" x2="103" y2="1009"/><line class="life" x1="262" y1="132" x2="262" y2="1273"/><line class="life" x1="419" y1="132" x2="419" y2="669"/><line class="life" x1="419" y1="731" x2="419" y2="1273"/><line class="life" x1="103" y1="1071" x2="103" y2="1273"/><rect class="bx" x="44" y="78" width="118" height="54" rx="8"/><text class="nm" x="103" y="101" text-anchor="middle">Learner</text><text class="sb" x="103" y="120" text-anchor="middle">sees one level</text><rect class="bx red" x="203" y="78" width="118" height="54" rx="8"/><text class="nm" x="262" y="101" text-anchor="middle">Server</text><text class="sb red" x="262" y="120" text-anchor="middle">rules in code</text><rect class="bx blue" x="346" y="78" width="147" height="54" rx="8"/><text class="nm" x="419" y="101" text-anchor="middle">Judge</text><text class="sb blue" x="419" y="120" text-anchor="middle">a model, in shadow</text><rect class="bx green" x="343" y="677" width="152" height="54" rx="8"/><text class="nm" x="419" y="700" text-anchor="middle">DB</text><text class="sb green" x="419" y="719" text-anchor="middle">the judge's columns</text><rect class="bx" x="24" y="1017" width="157" height="54" rx="8"/><text class="nm" x="103" y="1040" text-anchor="middle">Team</text><text class="sb" x="103" y="1059" text-anchor="middle">reads disagreements</text><rect class="bx green" x="397" y="975" width="45" height="28" rx="6"/><text class="nm" x="419" y="995" text-anchor="middle">DB</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip" x="55" y="184" width="265" height="35" rx="6"/><text class="lb" x="187" y="206" text-anchor="middle">the answer that reaches the wind-down</text><line class="ar" x1="117" y1="225" x2="258" y2="225" marker-end="url(#rollout-seq-a)"/><circle class="bd solid" cx="103" cy="225" r="10"/><text class="n" x="103" y="229.5">1</text></g><g data-step="s2" data-p="1" data-r="1"><path class="ar" d="M262,253 H274 V291 H266" marker-end="url(#rollout-seq-a)"/><rect class="chip" x="278" y="245" width="215" height="54" rx="6"/><text class="sb" x="288" y="267">claim the judge for this chat</text><text class="sb mono" x="288" y="286">writes a start time, once</text><rect class="chip green" x="278" y="307" width="85" height="24" rx="12"/><text class="sb green" x="321" y="324" text-anchor="middle">✓ claimed</text></g><g data-step="s3" data-p="1" data-r="1"><rect class="chip" x="75" y="347" width="218" height="35" rx="6"/><text class="lb" x="183" y="369" text-anchor="middle">tutor reply, no wait for the judge</text><line class="ar" x1="260" y1="388" x2="107" y2="388" marker-end="url(#rollout-seq-a)"/></g><g data-step="s4" data-p="1" data-r="2"><rect class="chip blue" x="249" y="408" width="193" height="35" rx="6"/><text class="lb" x="346" y="430" text-anchor="middle">answered turns + their facts</text><line class="ar blue" x1="276" y1="449" x2="415" y2="449" marker-end="url(#rollout-seq-b)"/><circle class="bd solid" cx="262" cy="449" r="10"/><text class="n" x="262" y="453.5">2</text></g><g data-step="s5" data-p="1" data-r="2"><text class="lb blue" x="342" y="497" text-anchor="middle">B2 · cited turns 5 and 7</text><line class="ar blue dash" x1="417" y1="477" x2="266" y2="477" marker-end="url(#rollout-seq-b)"/></g><g data-step="s6" data-p="1" data-r="3"><path class="ar" d="M262,532 H274 V570 H266" marker-end="url(#rollout-seq-a)"/><rect class="chip" x="294" y="524" width="194" height="54" rx="6"/><text class="sb" x="304" y="546">rules say B1 · judge says B2,</text><text class="sb" x="304" y="565">one level up</text><circle class="bd solid" cx="262" cy="551" r="10"/><text class="n" x="262" y="555.5">3</text></g><g data-step="s7" data-p="1" data-r="3"><path class="ar green" d="M262,602 H274 V621 H266" marker-end="url(#rollout-seq-g)"/><rect class="chip green" x="278" y="594" width="231" height="35" rx="6"/><text class="sb" x="288" y="616">accepted · would change the level</text><rect class="chip green" x="278" y="637" width="167" height="24" rx="12"/><text class="sb green" x="362" y="654" text-anchor="middle">✓ 2 cited turns pass B2</text><rect class="chip green" x="453" y="637" width="167" height="24" rx="12"/><text class="sb green" x="537" y="654" text-anchor="middle">✓ no B2 question failed</text></g><g data-step="s8" data-p="1" data-r="4"><text class="lb mono green" x="339" y="783" text-anchor="middle">judge_level B2 · judge_would_change true</text><line class="ar green dash" x1="276" y1="755" x2="415" y2="755" marker-end="url(#rollout-seq-g)"/><circle class="bd solid" cx="262" cy="755" r="10"/><text class="n" x="262" y="759.5">4</text></g><g data-step="s9" data-p="1" data-r="5"><rect class="chip green" x="127" y="810" width="101" height="35" rx="6"/><text class="lb" x="177" y="832" text-anchor="middle">your level: B1</text><line class="ar green" x1="248" y1="851" x2="107" y2="851" marker-end="url(#rollout-seq-g)"/><circle class="bd solid" cx="262" cy="851" r="10"/><text class="n" x="262" y="855.5">5</text></g><g data-step="s10" data-p="1" data-r="5"><path class="ar amber" d="M262,879 H274 V917 H266" marker-end="url(#rollout-seq-m)"/><rect class="chip amber" x="278" y="871" width="144" height="54" rx="6"/><text class="sb" x="288" y="893">judge error → log it,</text><text class="sb" x="288" y="912">keep the rules' level</text></g><g data-step="s12" data-p="1" data-r="6"><path class="ar amber" d="M103,1095 H115 V1133 H107" marker-end="url(#rollout-seq-m)"/><rect class="chip amber" x="135" y="1087" width="129" height="54" rx="6"/><text class="sb" x="145" y="1109">bar written first:</text><text class="sb" x="145" y="1128">right in ≥ 30 of 38</text><circle class="bd solid" cx="103" cy="1114" r="10"/><text class="n" x="103" y="1118.5">6</text></g><g data-step="s13" data-p="1" data-r="6"><rect class="chip" x="156" y="1157" width="207" height="35" rx="6"/><text class="lb mono" x="260" y="1179" text-anchor="middle">count judge_would_change</text><line class="ar" x1="105" y1="1198" x2="415" y2="1198" marker-end="url(#rollout-seq-a)"/></g><g data-step="s14" data-p="1" data-r="6"><text class="lb" x="262" y="1246" text-anchor="middle">38 of 412 chats (example)</text><line class="ar dash" x1="417" y1="1226" x2="107" y2="1226" marker-end="url(#rollout-seq-a)"/></g><rect class="bx green" x="24" y="1279" width="815" height="68" rx="8" data-p="1" data-r="6"/><text class="nm green" x="42" y="1307" data-p="1" data-r="6">No learner saw a change: Lomem dropped its real judge the same day</text><text class="sb" x="42" y="1331" data-p="1" data-r="6">The judge only ran in shadow. Had it cleared the bar, a flag would show learners its accepted level.</text></svg>