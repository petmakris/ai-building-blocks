<svg class="ov-svg" viewBox="0 0 1120 784" role="img" aria-label="The model asks for mark_paid. Code checks a constant confirm list: reads and four adds run at once, while 31 tools are checked against the stored bill, saved as a proposal that expires in 10 minutes, and shown to the person as a card built from stored data. The click is a new request that sends only a reference; the server checks owner, expiry and single use, runs exactly the stored call with the version checked again, and gives the model the result under its own call id.">
<defs>
<marker id="hitl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="hitl-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="hitl-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
<marker id="hitl-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker>
</defs>
<text class="ttl" x="24" y="38">A risky write waits for a person's click, and only the stored call runs, once</text>

<text class="zl" x="24" y="100">THE MODEL</text>
<text class="zl" x="284" y="100">REQUEST 1 · THE PERSON'S MESSAGE</text>
<text class="zl" x="884" y="100">THE PERSON</text>
<text class="zl" x="284" y="538">REQUEST 2 · THE CLICK</text>

<!-- model -->
<rect class="bx blue" x="24" y="128" width="200" height="590" rx="8"/>
<text class="nm" x="42" y="160">The model</text>
<text class="sb" x="42" y="184">Gemini Flash in Billpod</text>
<text class="sb" x="42" y="206">runs no code, only asks</text>
<text class="sb" x="42" y="240">example call:</text>
<text class="sb mono blue" x="42" y="262">mark_paid b17 v3</text>
<text class="sb mono blue" x="42" y="284">card · id c2</text>
<text class="sb" x="42" y="420">reads and adds: results</text>
<text class="sb" x="42" y="442">in the same request</text>
<text class="sb" x="42" y="600">the click's request loads</text>
<text class="sb" x="42" y="622">the chat, adds the result</text>
<text class="sb" x="42" y="644">under c2, asks again</text>
<text class="sb blue" x="42" y="676">"Done: marked paid."</text>
<text class="sb" x="42" y="698">Cancel: a declined result</text>

<!-- request 1 -->
<rect class="bx red" x="284" y="128" width="240" height="140" rx="8"/>
<text class="nm" x="302" y="160">Confirm list in code</text>
<text class="sb mono" x="302" y="184">CONFIRM_TOOLS</text>
<text class="sb" x="302" y="206">31 of the 46 tools need a yes</text>
<text class="sb" x="302" y="228">a constant: no text the model</text>
<text class="sb" x="302" y="250">reads can change it</text>

<rect class="bx" x="584" y="128" width="240" height="140" rx="8"/>
<text class="nm" x="602" y="160">Pre-check, then a card</text>
<text class="sb" x="602" y="184">bill exists? version 3? unpaid?</text>
<text class="sb amber" x="602" y="206">fails: error to model, no card</text>
<text class="sb" x="602" y="228">card: stored row + checked args</text>
<text class="sb" x="602" y="250">never the model's own words</text>

<rect class="bx green" x="284" y="330" width="240" height="162" rx="8"/>
<text class="nm" x="302" y="362">Runs at once</text>
<text class="sb" x="302" y="386">11 reads, such as find_bills</text>
<text class="sb" x="302" y="408">4 adds, such as add_bill</text>
<text class="sb green" x="302" y="430">add_bill gets an Undo button</text>
<text class="sb amber" x="302" y="452">an injected add runs too:</text>
<text class="sb amber" x="302" y="474">Undo is its only defence</text>

<rect class="bx red" x="584" y="330" width="240" height="162" rx="8"/>
<text class="nm" x="602" y="362">Proposal stored</text>
<text class="sb" x="602" y="386">row: call, args, version 3</text>
<text class="sb" x="602" y="408">expires in 10 minutes</text>
<text class="sb" x="602" y="430">Billpod: a sealed AES-256-GCM</text>
<text class="sb" x="602" y="452">token the browser carries</text>
<text class="sb red" x="602" y="474">the turn ends, nothing waits</text>

<!-- request 2 -->
<rect class="bx green" x="284" y="556" width="240" height="162" rx="8"/>
<text class="nm" x="302" y="588">Runs the stored call</text>
<text class="sb" x="302" y="612">exact args, under id c2</text>
<text class="sb mono" x="302" y="634">WHERE version = 3</text>
<text class="sb amber" x="302" y="656">0 rows: refusal to the model</text>
<text class="sb" x="302" y="678">later writes of that step:</text>
<text class="sb mono" x="302" y="700">NOT_RUN</text>

<rect class="bx green" x="584" y="556" width="240" height="162" rx="8"/>
<text class="nm" x="602" y="588">Server checks the click</text>
<text class="sb" x="602" y="612">same user, same chat? else 400</text>
<text class="sb" x="602" y="634">under 10 minutes old? else 410</text>
<text class="sb" x="602" y="656">never answered? else 409</text>
<text class="sb" x="602" y="678">Cancel runs nothing and tells</text>
<text class="sb" x="602" y="700">the model it was declined</text>

<!-- person -->
<rect class="bx" x="884" y="128" width="212" height="590" rx="8"/>
<text class="nm" x="902" y="160">The person</text>
<text class="sb" x="902" y="184">reads the card, decides</text>
<rect class="bx red" x="898" y="202" width="184" height="156" rx="8"/>
<text class="sb" x="914" y="226">example card</text>
<text class="sb" x="914" y="250">Mark this bill as paid?</text>
<text class="sb" x="914" y="274">City Power AG</text>
<text class="sb" x="914" y="296">CHF 84.20, by card</text>
<text class="sb" x="914" y="318">15 Oct 2026</text>
<text class="sb" x="914" y="342">Approve, Change, Cancel</text>
<text class="sb amber" x="902" y="400">93%: Claude Code users</text>
<text class="sb amber" x="902" y="422">approve almost every prompt</text>
<text class="sb" x="902" y="444">ask only where it matters</text>
<text class="sb" x="902" y="588">the click sends only</text>
<text class="sb mono" x="902" y="612">row id + approve</text>
<text class="sb" x="902" y="636">no arguments, so it cannot</text>
<text class="sb" x="902" y="658">swap in another call</text>

<!-- arrows: request 1 -->
<line class="ar blue" x1="224" y1="198" x2="280" y2="198" marker-end="url(#hitl-b)"/>
<line class="ar red" x1="524" y1="198" x2="580" y2="198" marker-end="url(#hitl-r)"/>
<text class="lb" x="552" y="190" text-anchor="middle">on list</text>
<line class="ar red" x1="824" y1="198" x2="880" y2="198" marker-end="url(#hitl-r)"/>
<text class="lb" x="854" y="190" text-anchor="middle">card</text>
<line class="ar green" x1="404" y1="268" x2="404" y2="326" marker-end="url(#hitl-g)"/>
<text class="lb" x="414" y="302">not on list</text>
<line class="ar red" x1="704" y1="268" x2="704" y2="326" marker-end="url(#hitl-r)"/>
<text class="lb" x="714" y="302">saves</text>
<line class="ar blue" x1="284" y1="410" x2="228" y2="410" marker-end="url(#hitl-b)"/>
<text class="lb" x="254" y="402" text-anchor="middle">result</text>

<!-- arrows: request 2 -->
<line class="ar red" x1="704" y1="492" x2="704" y2="552" marker-end="url(#hitl-r)"/>
<text class="lb" x="714" y="527">loads</text>
<line class="ar" x1="884" y1="640" x2="828" y2="640" marker-end="url(#hitl-a)"/>
<text class="lb" x="854" y="632" text-anchor="middle">click</text>
<line class="ar green" x1="584" y1="640" x2="528" y2="640" marker-end="url(#hitl-g)"/>
<text class="lb" x="554" y="632" text-anchor="middle">passes</text>
<line class="ar blue" x1="284" y1="640" x2="228" y2="640" marker-end="url(#hitl-b)"/>
<text class="lb" x="254" y="632" text-anchor="middle">c2</text>

<!-- legend -->
<line class="ar blue" x1="24" y1="756" x2="60" y2="756" marker-end="url(#hitl-b)"/>
<text class="sb" x="70" y="760">the model's call and its result</text>
<line class="ar red" x1="300" y1="756" x2="336" y2="756" marker-end="url(#hitl-r)"/>
<text class="sb" x="346" y="760">a held call on its way to a person</text>
<line class="ar green" x1="600" y1="756" x2="636" y2="756" marker-end="url(#hitl-g)"/>
<text class="sb" x="646" y="760">code runs it now</text>
<line class="ar" x1="830" y1="756" x2="866" y2="756" marker-end="url(#hitl-a)"/>
<text class="sb" x="876" y="760">the person's click</text>
</svg>
