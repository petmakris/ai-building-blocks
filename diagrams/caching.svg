<svg class="ov-svg" viewBox="0 0 1120 884" role="img" aria-label="Two caches skip repeated model work. Above, Tunatutor's answer cache: a normalised key with no user id finds a row in panel_content_cache; a hit makes no model call, a miss calls the model, validates the answer and stores it at version 6, and two wrong-language reports delete a row. Below, the provider's prompt cache: a request with its fixed text first reuses the stored prefix at 0.1 times the input price, while a timestamp on top makes every call a miss that pays 1.25 times to write.">
<defs>
<marker id="caching-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="caching-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="caching-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker>
<marker id="caching-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker>
<marker id="caching-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
</defs>
<text class="ttl" x="24" y="38">A stored answer skips the model; a reused prompt opening is billed at 0.1×</text>

<!-- ZONE A: answer cache -->
<rect class="zone" x="24" y="60" width="1072" height="352" rx="10"/>
<text class="zl" x="44" y="86">YOUR SERVICE · ANSWER CACHE · TUNATUTOR</text>

<!-- legend -->
<line class="ar blue" x1="470" y1="82" x2="500" y2="82" marker-end="url(#caching-b)"/>
<text class="sb" x="508" y="86">model call</text>
<line class="ar green" x1="590" y1="82" x2="620" y2="82" marker-end="url(#caching-g)"/>
<text class="sb" x="628" y="86">hit or check passed</text>
<line class="ar amber dash" x1="766" y1="82" x2="796" y2="82" marker-end="url(#caching-m)"/>
<text class="sb" x="804" y="86">extra cost or removal</text>
<line class="ar red dash" x1="958" y1="82" x2="988" y2="82" marker-end="url(#caching-r)"/>
<text class="sb" x="996" y="86">risky</text>

<!-- top row -->
<rect class="bx" x="44" y="102" width="180" height="128" rx="8"/>
<text class="nm" x="62" y="134">A learner asks</text>
<text class="sb" x="62" y="158">« un tire-bouchon »</text>
<text class="sb" x="62" y="180">a word or a sentence</text>

<rect class="bx" x="260" y="102" width="240" height="128" rx="8"/>
<text class="nm" x="278" y="134">Cache key</text>
<text class="sb" x="278" y="158">text trimmed, lower-cased</text>
<text class="sb" x="278" y="180">SHA-256 for a sentence</text>
<text class="sb green" x="278" y="202">no user id in the key</text>

<rect class="bx" x="540" y="102" width="250" height="128" rx="8"/>
<text class="nm mono" x="558" y="134">panel_content_cache</text>
<text class="sb" x="558" y="158">Postgres, rows never expire</text>
<text class="sb" x="558" y="180">hit only if version ≥ 6</text>
<text class="sb amber" x="558" y="202">a version bump: old rows miss</text>

<rect class="bx green" x="830" y="102" width="246" height="128" rx="8"/>
<text class="nm" x="848" y="134">Hit: 0 model calls</text>
<text class="sb" x="848" y="158">learner's own words added</text>
<text class="sb" x="848" y="180">after the lookup, never stored</text>

<!-- bottom row -->
<rect class="bx red" x="44" y="282" width="180" height="108" rx="8"/>
<text class="nm" x="62" y="314">Semantic cache</text>
<text class="sb" x="62" y="338">matches by meaning</text>
<text class="sb red" x="62" y="362">can be wrong, no error</text>

<rect class="bx green" x="260" y="282" width="240" height="108" rx="8"/>
<text class="nm" x="278" y="314">Validate, then store</text>
<text class="sb" x="278" y="338">missing field: nothing stored</text>
<text class="sb" x="278" y="362">upsert stamps version 6</text>

<rect class="bx blue" x="540" y="282" width="250" height="108" rx="8"/>
<text class="nm" x="558" y="314">Model call</text>
<text class="sb" x="558" y="338">fixed system prompt first</text>
<text class="sb" x="558" y="362">learner's text last</text>

<rect class="bx amber" x="830" y="282" width="246" height="108" rx="8"/>
<text class="nm" x="848" y="314">Wrong-language report</text>
<text class="sb" x="848" y="338">2 saved learners: row deleted</text>
<text class="sb" x="848" y="362">next read writes it again</text>

<!-- zone A arrows -->
<line class="ar" x1="224" y1="166" x2="256" y2="166" marker-end="url(#caching-a)"/>
<line class="ar" x1="500" y1="166" x2="536" y2="166" marker-end="url(#caching-a)"/>
<line class="ar green" x1="790" y1="166" x2="826" y2="166" marker-end="url(#caching-g)"/>
<text class="lb" x="810" y="155" text-anchor="middle">hit</text>
<line class="ar red dash" x1="134" y1="230" x2="134" y2="278" marker-end="url(#caching-r)"/>
<text class="lb" x="142" y="262">not used in Lomem</text>
<line class="ar blue" x1="610" y1="230" x2="610" y2="278" marker-end="url(#caching-b)"/>
<text class="lb" x="618" y="262">miss or old version</text>
<line class="ar blue" x1="540" y1="336" x2="504" y2="336" marker-end="url(#caching-b)"/>
<path class="ar green" d="M470,282 V256 H580 V234" marker-end="url(#caching-g)"/>
<line class="ar" x1="953" y1="230" x2="953" y2="278" marker-end="url(#caching-a)"/>
<text class="lb" x="961" y="262">Something wrong?</text>
<path class="ar amber dash" d="M830,336 H812 V200 H794" marker-end="url(#caching-m)"/>

<!-- zoom into the model call -->
<line class="ar blue" x1="690" y1="390" x2="690" y2="512" marker-end="url(#caching-b)"/>
<text class="lb" x="698" y="436">every call resends the whole prompt</text>

<!-- ZONE B: prompt cache -->
<rect class="zone blue" x="24" y="452" width="1072" height="416" rx="10"/>
<text class="zl" x="44" y="478">THE PROVIDER'S PROMPT CACHE · ANTHROPIC PRICES, EXAMPLE SIZES</text>

<text class="zn green" x="44" y="506">Fixed text first: the prefix is reused</text>
<rect class="bx green" x="44" y="516" width="76" height="56" rx="8"/>
<text class="nm" x="62" y="549">tools</text>
<rect class="bx green" x="120" y="516" width="236" height="56" rx="8"/>
<text class="nm" x="138" y="540">system prompt</text>
<text class="sb" x="138" y="561">6,000 tokens, marker at end</text>
<rect class="bx" x="356" y="516" width="184" height="56" rx="8"/>
<text class="nm" x="374" y="540">goal + videos</text>
<text class="sb" x="374" y="561">900 tokens, changes</text>

<text class="zn red" x="44" y="600">A timestamp on top: no call ever matches</text>
<rect class="bx red" x="44" y="610" width="112" height="56" rx="8"/>
<text class="nm" x="62" y="643">Now 14:02</text>
<rect class="bx" x="156" y="610" width="76" height="56" rx="8"/>
<text class="nm" x="174" y="643">tools</text>
<rect class="bx" x="232" y="610" width="168" height="56" rx="8"/>
<text class="nm" x="250" y="634">system prompt</text>
<text class="sb" x="250" y="655">same 6,000 tokens</text>
<rect class="bx" x="400" y="610" width="140" height="56" rx="8"/>
<text class="nm" x="418" y="634">goal + videos</text>
<text class="sb" x="418" y="655">900 tokens</text>

<rect class="bx red" x="580" y="516" width="220" height="242" rx="8"/>
<text class="nm" x="598" y="548">Provider prefix cache</text>
<text class="sb" x="598" y="572">keeps the model's work</text>
<text class="sb" x="598" y="594">over the marked prefix</text>
<text class="sb" x="598" y="626">match from the first token</text>
<text class="sb" x="598" y="648">kept per organization</text>
<text class="sb" x="598" y="680">lives 5 min after last hit</text>
<text class="sb" x="598" y="702">or 1 hour on request</text>
<text class="sb blue" x="598" y="734">output still paid in full</text>

<rect class="bx green" x="850" y="516" width="226" height="62" rx="8"/>
<text class="nm" x="868" y="542">Hit: read at 0.1×</text>
<text class="sb" x="868" y="564">on most models, reply sooner</text>

<rect class="bx amber" x="850" y="594" width="226" height="62" rx="8"/>
<text class="nm" x="868" y="620">Miss: write at 1.25×</text>
<text class="sb" x="868" y="642">1-hour lifetime: write at 2×</text>

<rect class="bx amber" x="850" y="672" width="226" height="86" rx="8"/>
<text class="nm" x="868" y="700">Prefix too short</text>
<text class="sb" x="868" y="724">under 512 to 4,096 tokens</text>
<text class="sb amber" x="868" y="746">nothing cached, no error</text>

<rect class="bx" x="44" y="692" width="496" height="160" rx="8"/>
<text class="nm" x="62" y="722">Usage counts, user B</text>
<text class="sb mono green" x="62" y="746">cache_read_input_tokens: 6000</text>
<text class="sb mono" x="62" y="768">cache_creation_input_tokens: 0</text>
<text class="sb mono" x="62" y="790">input_tokens: 900</text>
<text class="sb" x="62" y="814">read share 6,000 / 6,900 ≈ 87%: the ceiling, healthy</text>
<text class="sb amber" x="62" y="836">both cache counts 0: nothing was cached</text>

<rect class="bx" x="580" y="780" width="496" height="72" rx="8"/>
<text class="nm" x="598" y="808">Example day: 10,000 calls, $3 per 1M input</text>
<text class="sb" x="598" y="834">no cache $180</text>
<text class="sb green" x="716" y="834">cached about $18</text>
<text class="sb red" x="856" y="834">timestamp on top about $225</text>

<!-- zone B arrows -->
<line class="ar green" x1="540" y1="544" x2="576" y2="544" marker-end="url(#caching-g)"/>
<line class="ar red dash" x1="540" y1="638" x2="576" y2="638" marker-end="url(#caching-r)"/>
<line class="ar green" x1="800" y1="547" x2="846" y2="547" marker-end="url(#caching-g)"/>
<line class="ar amber" x1="800" y1="625" x2="846" y2="625" marker-end="url(#caching-m)"/>
<line class="ar amber dash" x1="800" y1="715" x2="846" y2="715" marker-end="url(#caching-m)"/>
<line class="ar" x1="580" y1="730" x2="544" y2="730" marker-end="url(#caching-a)"/>
</svg>
