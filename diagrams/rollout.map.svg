<svg class="vz" viewBox="0 0 1174 966" role="img" aria-label="New AI behaviour first runs in shadow mode on real chats while the user still sees the old result, then a person reads the disagreements against a bar written first, then a flag flips only when an eval clears four fixed bars, then a canary widens from 5 to 100 percent while quality is no worse. After release, feedback tied to the exact turn is triaged by a person and every confirmed failure becomes an eval case that every later gate run checks. New checks start in log mode and enforce only under a 15 percent refusal rate." data-vz="map"><defs><marker id="rollout-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="rollout-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="rollout-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="rollout-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="rollout-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="rollout-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">AI changes reach users in stages, and each confirmed failure becomes an eval case</text><text class="sub" x="24" y="62">Real code from Lomem's language app. Boxes marked example use made-up numbers.</text><rect class="zone" x="24" y="112" width="1126" height="374" rx="10" data-p="1" data-b="2" data-r="1"/><text class="zn" x="40" y="132" data-p="1" data-b="2" data-r="1">before any user depends on it</text><rect class="zone" x="24" y="534" width="552" height="156" rx="10" data-p="1" data-b="1"/><text class="zn" x="40" y="554" data-p="1" data-b="1">why tests are not enough</text><rect class="zone" x="604" y="534" width="546" height="360" rx="10" data-p="1" data-b="4"/><text class="zn" x="620" y="554" data-p="1" data-b="4">after release</text><rect class="zone" x="24" y="738" width="552" height="156" rx="10" data-p="1" data-b="5"/><text class="zn" x="40" y="758" data-p="1" data-b="5">new checks · log mode first</text><rect class="bx red" x="38" y="144" width="239" height="330" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="56" y="174" data-p="1" data-b="2" data-r="1">Shadow mode</text><text class="sb" x="56" y="196" data-p="1" data-b="2" data-r="2">a judge model grades each chat</text><text class="sb" x="56" y="218" data-p="1" data-b="2" data-r="1">learner waits 0 s, judge 15 s</text><text class="sb" x="56" y="240" data-p="1" data-b="2" data-r="1">started once per chat</text><text class="sb" x="56" y="262" data-p="1" data-b="2" data-r="2">never sees the rules' level</text><text class="sb blue" x="56" y="284" data-p="1" data-b="2" data-r="2">real test: B2, cites turns 5 and 7</text><text class="sb red" x="56" y="316" data-p="1" data-b="2" data-r="3">code checks its evidence:</text><text class="sb" x="56" y="338" data-p="1" data-b="2" data-r="3">2+ levels off: rejected</text><text class="sb" x="56" y="360" data-p="1" data-b="2" data-r="3">1 up: 2 cited turns must pass</text><text class="sb green" x="56" y="382" data-p="1" data-b="2" data-r="3">rules B1, judge B2: accepted</text><text class="sb green" x="56" y="414" data-p="1" data-b="2" data-r="4">stores <tspan class="mono">judge_would_change</tspan></text><text class="sb green" x="56" y="436" data-p="1" data-b="2" data-r="5">learner sees the rules' level</text><text class="sb" x="56" y="458" data-p="1" data-b="2" data-r="5">judge error: logged, level kept</text><rect class="bx" x="333" y="144" width="229" height="242" rx="8" data-p="1" data-b="2" data-r="6"/><text class="nm" x="351" y="174" data-p="1" data-b="2" data-r="6">Readout · example</text><text class="sb amber" x="351" y="196" data-p="1" data-b="2" data-r="6">bar written first:</text><text class="sb" x="351" y="218" data-p="1" data-b="2" data-r="6">judge right in ≥ 30 of 38</text><text class="sb" x="351" y="240" data-p="1" data-b="2" data-r="6">38 of 412 chats disagree</text><text class="sb" x="351" y="262" data-p="1" data-b="2" data-r="6">a person reads all 38</text><text class="sb green" x="351" y="294" data-p="1" data-b="2" data-r="6">clears: a flag shows the judge</text><text class="sb red" x="351" y="316" data-p="1" data-b="2" data-r="6">misses: the judge is dropped</text><text class="sb" x="351" y="348" data-p="1" data-b="2" data-r="6">real Lomem: dropped same day</text><text class="sb green" x="351" y="370" data-p="1" data-b="2" data-r="6">no learner saw a change</text><rect class="bx green" x="618" y="144" width="212" height="242" rx="8" data-p="1" data-b="3"/><text class="nm" x="636" y="174" data-p="1" data-b="3">Flag + eval gate</text><text class="sb mono" x="636" y="196" data-p="1" data-b="3">TD_JUDGE_MARKS = false</text><text class="sb" x="636" y="228" data-p="1" data-b="3">flips only if 4 bars pass:</text><text class="sb" x="636" y="250" data-p="1" data-b="3">≥ 95% agree with old prompt</text><text class="sb" x="636" y="272" data-p="1" data-b="3">≥ 95% marks placeable</text><text class="sb" x="636" y="294" data-p="1" data-b="3">≥ 90% marks really wrong</text><text class="sb" x="636" y="316" data-p="1" data-b="3">≥ 95% replies within 2.5 s</text><text class="sb" x="636" y="348" data-p="1" data-b="3">≤ 200 real rows + 36 cases</text><text class="sb amber" x="636" y="370" data-p="1" data-b="3">accidental flip fails a test</text><rect class="bx" x="886" y="144" width="250" height="242" rx="8" data-p="1" data-b="3"/><text class="nm" x="904" y="174" data-p="1" data-b="3">Canary · example</text><text class="sb" x="904" y="196" data-p="1" data-b="3">prompt v7 → v8</text><text class="sb" x="904" y="218" data-p="1" data-b="3">5% → 25% → 100% of customers</text><text class="sb" x="904" y="240" data-p="1" data-b="3">group = hash of customer id</text><text class="sb" x="904" y="262" data-p="1" data-b="3">wait for 1,500 v8 drafts</text><text class="sb amber" x="904" y="294" data-p="1" data-b="3">judged on quality signals:</text><text class="sb" x="904" y="316" data-p="1" data-b="3">discard rate, not errors</text><text class="sb green" x="904" y="348" data-p="1" data-b="3">widen if ≤ 23% (v7: 20%)</text><text class="sb red" x="904" y="370" data-p="1" data-b="3">worse: back to 0%</text><rect class="bx amber" x="38" y="566" width="239" height="112" rx="8" data-p="1" data-b="1"/><text class="nm" x="56" y="596" data-p="1" data-b="1">A wrong answer looks right</text><text class="sb" x="56" y="618" data-p="1" data-b="1">HTTP 200, valid JSON, fast</text><text class="sb" x="56" y="640" data-p="1" data-b="1">error rate, latency stay flat</text><text class="sb" x="56" y="662" data-p="1" data-b="1">users send what tests missed</text><rect class="bx" x="333" y="566" width="229" height="112" rx="8" data-p="1" data-b="4"/><text class="nm" x="351" y="596" data-p="1" data-b="4">Weekly rerun · proposed</text><text class="sb" x="351" y="618" data-p="1" data-b="4">provider can change the model</text><text class="sb" x="351" y="640" data-p="1" data-b="4">Lomem: gate run by hand</text><text class="sb amber" x="351" y="662" data-p="1" data-b="4">missed bar: flag back off</text><rect class="bx green" x="618" y="566" width="212" height="112" rx="8" data-p="1" data-b="4"/><text class="nm" x="636" y="596" data-p="1" data-b="4">Eval cases</text><text class="sb" x="636" y="618" data-p="1" data-b="4">fixture file, 36 rows</text><text class="sb mono" x="636" y="640" data-p="1" data-b="4">"J'ai vraiment faim."</text><text class="sb green" x="636" y="662" data-p="1" data-b="4">every gate run checks it</text><rect class="bx" x="886" y="566" width="250" height="112" rx="8" data-p="1" data-b="4"/><text class="nm" x="904" y="596" data-p="1" data-b="4">Real users</text><text class="sb" x="904" y="618" data-p="1" data-b="4">thumbs-down: rare</text><text class="sb" x="904" y="640" data-p="1" data-b="4">edits, retries: nearly all</text><text class="sb" x="904" y="662" data-p="1" data-b="4">the first to see a failure</text><rect class="bx" x="38" y="770" width="239" height="112" rx="8" data-p="1" data-b="5"/><text class="nm" x="56" y="800" data-p="1" data-b="5">Guard in log mode</text><text class="sb" x="56" y="822" data-p="1" data-b="5">logs the refusal it would make</text><text class="sb" x="56" y="844" data-p="1" data-b="5">lets the exercise through</text><text class="sb" x="56" y="866" data-p="1" data-b="5">6 Overheard guards today</text><rect class="bx green" x="333" y="770" width="229" height="112" rx="8" data-p="1" data-b="5"/><text class="nm" x="351" y="800" data-p="1" data-b="5">Enforced guard</text><text class="sb" x="351" y="822" data-p="1" data-b="5">refusal rate &lt; 15% in every</text><text class="sb" x="351" y="844" data-p="1" data-b="5">language and level, 12 today</text><text class="sb amber" x="351" y="866" data-p="1" data-b="5">each refusal: a paid retry</text><rect class="bx" x="618" y="770" width="212" height="112" rx="8" data-p="1" data-b="4"/><text class="nm" x="636" y="800" data-p="1" data-b="4">Triage by a person</text><text class="sb" x="636" y="822" data-p="1" data-b="4">was the model really wrong?</text><text class="sb" x="636" y="844" data-p="1" data-b="4">no: <tspan class="mono">wont_fix</tspan></text><text class="sb green" x="636" y="866" data-p="1" data-b="4">yes: resolved, add a case</text><rect class="bx" x="886" y="770" width="250" height="112" rx="8" data-p="1" data-b="4"/><text class="nm" x="904" y="800" data-p="1" data-b="4">Feedback row</text><text class="sb mono" x="904" y="822" data-p="1" data-b="4">session_id + turn_index</text><text class="sb" x="904" y="844" data-p="1" data-b="4"><tspan class="mono">server_context</tspan> snapshot</text><text class="sb" x="904" y="866" data-p="1" data-b="4">status: open</text><path class="ar" d="M277,265 L329,265" marker-end="url(#rollout-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M562,265 L614,265" marker-end="url(#rollout-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M830,265 L882,265" marker-end="url(#rollout-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M1011,386 L1011,562" marker-end="url(#rollout-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M1011,678 L1011,766" marker-end="url(#rollout-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M886,826 L834,826" marker-end="url(#rollout-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M724,770 L724,682" marker-end="url(#rollout-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M724,566 L724,390" marker-end="url(#rollout-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M562,636 L614,636" marker-end="url(#rollout-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar amber dash" d="M562,590 L590,590 L590,350 L614,350" marker-end="url(#rollout-map-m)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M277,826 L329,826" marker-end="url(#rollout-map-a)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M277,265 L329,265" marker-end="url(#rollout-map-a)" data-p="1" data-r="6" data-route="1"/><circle class="bd solid" cx="298" cy="265" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="298" y="269.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="298" y1="265" x2="298" y2="134" data-p="1" data-r="6" data-route="1"/><text class="lb mono" x="314" y="129" text-anchor="middle" data-p="1" data-r="6" data-route="1">judge_would_change</text><line class="ar" x1="24" y1="930" x2="58" y2="930" marker-end="url(#rollout-map-a)"/><text class="sb" x="68" y="934">next stage</text><line class="ar green" x1="162.22910000000002" y1="930" x2="196.22910000000002" y2="930" marker-end="url(#rollout-map-g)"/><text class="sb" x="206" y="934">a failure comes back as a test</text><line class="ar amber dash" x1="419.30680000000007" y1="930" x2="453.30680000000007" y2="930" marker-end="url(#rollout-map-m)"/><text class="sb" x="463" y="934">missed bar: back to the old behaviour</text></svg>