<svg class="vz" viewBox="0 0 1220 1014" role="img" aria-label="An eval gate for a new grading prompt. Up to 200 real learner answers and 36 golden rows that a person labelled run through the old and the new prompt. Real rows are scored against the old verdict, which shows only change. Golden rows are scored against the person&#x27;s verdict, which shows correctness. Each of four checks has its own bar set before the run. A person reads the results, keeps the feature flag off on a miss, fixes the prompt and never the bar, and moves real-row fixes into the golden rows. A 2-point gap between prompts on 200 rows is within noise." data-vz="map"><defs><marker id="evals-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="evals-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="evals-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="evals-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="evals-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="evals-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Real rows show change, golden rows show correctness, each check has its own bar</text><text class="zl" x="38" y="70">THE ROWS</text><text class="zl" x="335" y="70">THE MODEL</text><text class="zl" x="606" y="70">THE CHECKS · BARS SET BEFORE THE RUN</text><text class="zl" x="967" y="70">THE DECISION</text><rect class="bx" x="38" y="88" width="241" height="134" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="118" data-p="1" data-b="1" data-r="1">Real rows</text><text class="sb" x="56" y="140" data-p="1" data-b="1" data-r="1">up to 200 learner answers</text><text class="sb" x="56" y="162" data-p="1" data-b="1" data-r="1">no person's label</text><text class="sb" x="56" y="184" data-p="1" data-b="1" data-r="3">old verdict is the reference</text><text class="sb" x="56" y="206" data-p="1" data-b="1" data-r="1">exact matches to the key skipped</text><rect class="bx green" x="38" y="266" width="241" height="144" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="296" data-p="1" data-b="1" data-r="1">Golden rows</text><text class="sb" x="56" y="318" data-p="1" data-b="1" data-r="1">36 rows a person labelled</text><text class="sb green" x="56" y="340" data-p="1" data-b="1" data-r="1">15 paraphrases must be right</text><text class="sb" x="56" y="362" data-p="1" data-b="1" data-r="1">21 errors must be wrong</text><text class="sb" x="56" y="394" data-p="1" data-b="1" data-r="4">note: <tspan class="mono">negation lost</tspan></text><rect class="bx blue" x="335" y="88" width="215" height="322" rx="8" data-p="1" data-b="2" data-r="2"/><text class="nm" x="353" y="118" data-p="1" data-b="2" data-r="2">Model, two prompts</text><text class="sb" x="353" y="140" data-p="1" data-b="2" data-r="2">old: frozen card prompt</text><text class="sb blue" x="353" y="162" data-p="1" data-b="2" data-r="2">new: arc prompt + underlines</text><text class="sb" x="353" y="184" data-p="1" data-b="2" data-r="2">same rows for both</text><text class="sb amber" x="353" y="216" data-p="1" data-b="2" data-r="2">≈470 paid calls a run</text><text class="sb amber" x="353" y="238" data-p="1" data-b="2" data-r="2">temperature 0.3: replies vary</text><rect class="bx red" x="606" y="88" width="305" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="624" y="118" data-p="1" data-b="3" data-r="3">1a · Real rows: old vs new</text><text class="sb" x="624" y="140" data-p="1" data-b="3" data-r="3">bar 95% agree</text><text class="sb red" x="624" y="162" data-p="1" data-b="3" data-r="3">shows change only</text><text class="sb" x="624" y="184" data-p="1" data-b="3" data-r="3">each disagreement: break or fix?</text><rect class="bx green" x="606" y="266" width="305" height="112" rx="8" data-p="1" data-b="3" data-r="4"/><text class="nm" x="624" y="296" data-p="1" data-b="3" data-r="4">1b · Golden rows: vs person</text><text class="sb" x="624" y="318" data-p="1" data-b="3" data-r="4">bar 95% right, 0 paraphrase misses</text><text class="sb green" x="624" y="340" data-p="1" data-b="3" data-r="4">shows correctness</text><text class="sb red" x="624" y="362" data-p="1" data-b="3" data-r="4">example: 34 of 36 right, FAIL</text><rect class="bx" x="606" y="454" width="305" height="90" rx="8" data-p="1" data-b="3" data-r="5"/><text class="nm" x="624" y="484" data-p="1" data-b="3" data-r="5">2 · Underlines land</text><text class="sb" x="624" y="506" data-p="1" data-b="3" data-r="5">95% land on the learner's words</text><text class="sb" x="624" y="528" data-p="1" data-b="3" data-r="5">no underlines counts as a pass</text><rect class="bx" x="606" y="588" width="305" height="68" rx="8" data-p="1" data-b="3"/><text class="nm" x="624" y="618" data-p="1" data-b="3">3 · Underline is an error</text><text class="sb" x="624" y="640" data-p="1" data-b="3">90% of words, a person reads</text><rect class="bx" x="606" y="700" width="305" height="68" rx="8" data-p="1" data-b="3" data-r="5"/><text class="nm" x="624" y="730" data-p="1" data-b="3" data-r="5">4 · Speed</text><text class="sb" x="624" y="752" data-p="1" data-b="3" data-r="5">95% of new replies within 2.5 s</text><rect class="bx green" x="967" y="88" width="215" height="90" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="985" y="118" data-p="1" data-b="4" data-r="6">Feature flag</text><text class="sb" x="985" y="140" data-p="1" data-b="4" data-r="6"><tspan class="mono">TD_JUDGE_MARKS</tspan></text><text class="sb green" x="985" y="162" data-p="1" data-b="4" data-r="6">false: underlines off</text><rect class="bx" x="967" y="266" width="215" height="278" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="985" y="296" data-p="1" data-b="4" data-r="6">A person</text><text class="sb" x="985" y="318" data-p="1" data-b="4" data-r="6">reads every check</text><text class="sb" x="985" y="340" data-p="1" data-b="4" data-r="6">and every miss</text><text class="sb" x="985" y="362" data-p="1" data-b="4" data-r="6">decides; no exit code</text><text class="sb" x="985" y="384" data-p="1" data-b="4" data-r="6">the script prints PASS or FAIL</text><rect class="bx amber" x="38" y="856" width="873" height="90" rx="8" data-p="1" data-b="5"/><text class="nm" x="56" y="886" data-p="1" data-b="5">Small gaps are noise</text><text class="sb" x="56" y="908" data-p="1" data-b="5">200 rows: the rate lands within ±3 points of the true rate 95% of the time. 40 rows: ±7 points.</text><text class="sb amber" x="56" y="930" data-p="1" data-b="5">Example: 96% vs 94% on 200 rows proves nothing. Run both prompts on the same rows, read each flipped row.</text><path class="ar blue" d="M279,155 L331,155" marker-end="url(#evals-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M279,338 L331,338" marker-end="url(#evals-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M550,144 L602,144" marker-end="url(#evals-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M550,322 L602,322" marker-end="url(#evals-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M550,400 L590,400 L590,499 L602,499" marker-end="url(#evals-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M550,385 L578,385 L578,622 L602,622" marker-end="url(#evals-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M550,370 L566,370 L566,734 L602,734" marker-end="url(#evals-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M911,144 L939,144 L939,296 L963,296" marker-end="url(#evals-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M911,322 L963,322" marker-end="url(#evals-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M911,499 L963,499" marker-end="url(#evals-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M911,622 L951,622 L951,516 L963,516" marker-end="url(#evals-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M911,734 L963,734 L963,530 L963,530" marker-end="url(#evals-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M1075,266 L1075,182" marker-end="url(#evals-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar amber dash" d="M1007,544 L1007,805 L442,805 L442,414" marker-end="url(#evals-map-m)" data-p="1" data-b="5" data-base="1"/><path class="ar green dash" d="M1142,544 L1142,843 L158,843 L158,414" marker-end="url(#evals-map-g)" data-p="1" data-b="5" data-base="1"/><path class="ar blue" d="M279,155 L331,155" marker-end="url(#evals-map-b)" data-p="1" data-r="1" data-route="1"/><path class="ar blue" d="M279,338 L331,338" marker-end="url(#evals-map-b)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M550,144 L602,144" marker-end="url(#evals-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar green" d="M550,322 L602,322" marker-end="url(#evals-map-g)" data-p="1" data-r="4" data-route="1"/><path class="ar" d="M550,400 L590,400 L590,499 L602,499" marker-end="url(#evals-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar" d="M550,370 L566,370 L566,734 L602,734" marker-end="url(#evals-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar" d="M911,322 L963,322" marker-end="url(#evals-map-a)" data-p="1" data-r="6" data-route="1"/><path class="ar amber dash" d="M1007,544 L1007,805 L442,8