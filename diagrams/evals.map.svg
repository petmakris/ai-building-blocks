er-end="url(#evals-map-b)"/><text class="sb" x="68" y="982">a model call</text><line class="ar" x1="171.5046" y1="978.0" x2="205.5046" y2="978.0" marker-end="url(#evals-map-a)"/><text class="sb" x="216" y="982">verdicts and results</text><line class="ar amber dash" x1="366.4683" y1="978.0" x2="400.4683" y2="978.0" marker-end="url(#evals-map-m)"/><text class="sb" x="410" y="982">fix and run again</text><line class="ar green dash" x1="543.0942" y1="978.0" x2="577.0942" y2="978.0" marker-end="url(#evals-map-g)"/><text class="sb" x="587" y="982">a row moves to golden</text></svg>