<svg class="vz" viewBox="0 0 932 1624" role="img" aria-label="Both requests run mark_paid through one runner, and bills.pay refuses the second" data-vz="sequence"><defs><marker id="toollayer-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="toollayer-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="toollayer-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="toollayer-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="toollayer-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="toollayer-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Both requests run mark_paid through one runner, and bills.pay refuses the second</text><text class="sub" x="24" y="62">Example: one electricity bill, paid from the app's chat, then again from Claude an hour later.</text><rect class="band" x="12" y="144" width="908" height="727" rx="10" data-p="1" data-r="1"/><text class="zl" x="24" y="166" data-p="1" data-r="1">REQUEST 1 · IN THE APP'S CHAT</text><rect class="band" x="12" y="877" width="908" height="645" rx="10" data-p="1" data-r="5"/><text class="zl" x="24" y="899" data-p="1" data-r="5">AN HOUR LATER · CLAUDE OVER MCP</text><line class="life" x1="106" y1="132" x2="106" y2="951"/><line class="life" x1="269" y1="132" x2="269" y2="951"/><line class="life" x1="415" y1="132" x2="415" y2="564"/><line class="life" x1="106" y1="1013" x2="106" y2="1526"/><line class="life" x1="269" y1="1013" x2="269" y2="1526"/><line class="life" x1="415" y1="626" x2="415" y2="1526"/><line class="life" x1="561" y1="132" x2="561" y2="1526"/><rect class="bx" x="47" y="78" width="118" height="54" rx="8"/><text class="nm" x="106" y="101" text-anchor="middle">Person</text><text class="sb" x="106" y="120" text-anchor="middle">pays the bills</text><rect class="bx blue" x="210" y="78" width="118" height="54" rx="8"/><text class="nm" x="269" y="101" text-anchor="middle">Ask Billpod</text><text class="sb blue" x="269" y="120" text-anchor="middle">the app's chat</text><rect class="bx blue" x="350" y="78" width="130" height="54" rx="8"/><text class="nm" x="415" y="101" text-anchor="middle">Gemini</text><text class="sb blue" x="415" y="120" text-anchor="middle">picks of 46 tools</text><rect class="bx blue" x="24" y="959" width="164" height="54" rx="8"/><text class="nm" x="106" y="982" text-anchor="middle">Claude</text><text class="sb blue" x="106" y="1001" text-anchor="middle">own model, over MCP</text><rect class="bx blue" x="210" y="959" width="118" height="54" rx="8"/><text class="nm mono" x="269" y="982" text-anchor="middle">/mcp</text><text class="sb blue" x="269" y="1001" text-anchor="middle">MCP endpoint</text><rect class="bx red" x="356" y="572" width="118" height="54" rx="8"/><text class="nm mono" x="415" y="595" text-anchor="middle">runTool</text><text class="sb red" x="415" y="614" text-anchor="middle">one runner</text><rect class="bx green" x="502" y="78" width="118" height="54" rx="8"/><text class="nm mono" x="561" y="101" text-anchor="middle">bills.pay</text><text class="sb green" x="561" y="120" text-anchor="middle">the service</text><rect class="bx red" x="373" y="917" width="85" height="28" rx="6"/><text class="nm mono" x="415" y="937" text-anchor="middle">runTool</text><rect class="bx green" x="510" y="917" width="102" height="28" rx="6"/><text class="nm mono" x="561" y="937" text-anchor="middle">bills.pay</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip" x="106" y="184" width="174" height="35" rx="6"/><text class="lb" x="192" y="206" text-anchor="middle">"I paid the electricity bill"</text><line class="ar" x1="120" y1="225" x2="265" y2="225" marker-end="url(#toollayer-seq-a)"/><circle class="bd solid" cx="106" cy="225" r="10"/><text class="n" x="106" y="229.5">1</text></g><g data-step="s2" data-p="1" data-r="1"><path class="ar blue" d="M269,253 H281 V291 H273" marker-end="url(#toollayer-seq-b)"/><rect class="chip blue" x="285" y="245" width="205" height="54" rx="6"/><text class="sb" x="295" y="267">ctx: person, household,</text><text class="sb" x="295" y="286">all 3 scopes, caller "assistant"</text></g><g data-step="s3" data-p="1" data-r="2"><rect class="chip blue" x="279" y="315" width="136" height="35" rx="6"/><text class="lb" x="347" y="337" text-anchor="middle">the chat + 46 tools</text><line class="ar blue" x1="283" y1="356" x2="411" y2="356" marker-end="url(#toollayer-seq-b)"/><circle class="bd solid" cx="269" cy="356" r="10"/><text class="n" x="269" y="360.5">2</text></g><g data-step="s4" data-p="1" data-r="2"><text class="lb mono blue" x="343" y="404" text-anchor="middle">mark_paid</text><line class="ar blue dash" x1="413" y1="384" x2="273" y2="384" marker-end="url(#toollayer-seq-b)"/></g><g data-step="s5" data-p="1" data-r="2"><rect class="chip blue" x="34" y="431" width="309" height="54" rx="6"/><text class="lb" x="188" y="453" text-anchor="middle">card · on the confirm list (31)</text><text class="lb mono" x="188" y="472" text-anchor="middle">Mark the electricity bill paid today?</text><line class="ar blue" x1="267" y1="491" x2="110" y2="491" marker-end="url(#toollayer-seq-b)"/></g><g data-step="s6" data-p="1" data-r="2"><rect class="chip green" x="150" y="511" width="72" height="35" rx="6"/><text class="lb" x="186" y="533" text-anchor="middle">Approve</text><line class="ar green" x1="108" y1="552" x2="265" y2="552" marker-end="url(#toollayer-seq-g)"/></g><g data-step="s7" data-p="1" data-r="3"><rect class="chip red" x="224" y="642" width="246" height="35" rx="6"/><text class="lb mono" x="347" y="664" text-anchor="middle">runTool(mark_paid, args, ctx)</text><line class="ar red" x1="283" y1="683" x2="411" y2="683" marker-end="url(#toollayer-seq-r)"/><circle class="bd solid" cx="269" cy="683" r="10"/><text class="n" x="269" y="687.5">3</text><rect class="chip green" x="336" y="693" width="82" height="24" rx="12"/><text class="sb green" x="377" y="710" text-anchor="middle">✓ scopes</text><rect class="chip green" x="426" y="693" width="68" height="24" rx="12"/><text class="sb green" x="460" y="710" text-anchor="middle">✓ input</text></g><g data-step="s8" data-p="1" data-r="4"><rect class="chip red" x="351" y="735" width="270" height="35" rx="6"/><text class="lb mono" x="485" y="757" text-anchor="middle">bills.pay(household, bill, body)</text><line class="ar red" x1="429" y1="776" x2="557" y2="776" marker-end="url(#toollayer-seq-r)"/><circle class="bd solid" cx="415" cy="776" r="10"/><text class="n" x="415" y="780.5">4</text><rect class="chip green" x="401" y="786" width="102" height="24" rx="12"/><text class="sb green" x="451" y="802" text-anchor="middle">✓ household</text><rect class="chip green" x="510" y="786" width="110" height="24" rx="12"/><text class="sb green" x="565" y="802" text-anchor="middle">✓ not paid yet</text></g><g data-step="s8b" data-p="1" data-r="4"><text class="lb green" x="489" y="856" text-anchor="middle">paid</text><line class="ar green dash" x1="559" y1="836" x2="419" y2="836" marker-end="url(#toollayer-seq-g)"/></g><g data-step="s9" data-p="1" data-r="5"><rect class="chip blue" x="73" y="1029" width="238" height="35" rx="6"/><text class="lb mono" x="192" y="1051" text-anchor="middle">tools/call mark_paid + token</text><line class="ar blue" x1="120" y1="1070" x2="265" y2="1070" marker-end="url(#toollayer-seq-b)"/><circle class="bd solid" cx="106" cy="1070" r="10"/><text class="n" x="106" y="1074.5">5</text></g><g data-step="s10" data-p="1" data-r="5"><path class="ar blue" d="M269,1098 H281 V1136 H273" marker-end="url(#toollayer-seq-b)"/><rect class="chip blue" x="285" y="1090" width="274" height="54" rx="6"/><text class="sb" x="295" y="1112">ctx: the token's person,</text><text class="sb" x="295" y="1131">same household, its scopes, caller "mcp"</text></g><g data-step="s11" data-p="1" data-r="6"><path class="ar amber" d="M106,1168 H118 V1206 H110" marker-end="url(#toollayer-seq-m)"/><rect class="chip amber" x="138" y="1160" width="231" height="54" rx="6"/><text class="sb" x="148" y="1182">destructiveHint: true</text><text class="sb mono" x="148" y="1201">Claude decides, not Billpod</text><circle class="bd solid" cx="106" cy="1187" r="10"/><text class="n" x="106" y="1191.5">6</text></g><g data-step="s12" data-p="1" data-r="7"><rect class="chip red" x="224" y="1230" width="246" height="35" rx="6"/><text class="lb mono" x="347" y="1252" text-anchor="middle">runTool(mark_paid, args, ctx)</text><line class="ar red" x1="283" y1="1271" x2="411" y2="1271" marker-end="url(#toollayer-seq-r)"/><circle class="bd solid" cx="269" cy="1271" r="10"/><text class="n" x="269" y="1275.5">7</text><rect class="chip green" x="336" y="1281" width="82" height="24" rx="12"/><text class="sb green" x="377" y="1298" text-anchor="middle">✓ scopes</text><rect class="chip green" x="426" y="1281" width="68" height="24" rx="12"/><text class="sb green" x="460" y="1298" text-anchor="middle">✓ input</text></g><g data-step="s13" data-p="1" data-r="7"><rect class="chip red" x="351" y="1323" width="270" height="35" rx="6"/><text class="lb mono" x="485" y="1345" text-anchor="middle">bills.pay(household, bill, body)</text><line class="ar red" x1="417" y1="1364" x2="557" y2="1364" marker-end="url(#toollayer-seq-r)"/><rect class="chip red" x="505" y="1374" width="113" height="24" rx="12"/><text 