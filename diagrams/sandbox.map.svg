<svg class="vz" viewBox="0 0 1179 1068" role="img" aria-label="A planted CSV cell makes the model write a command that uploads the cloud credentials. The agent service holds the secrets and never runs the code; a runner service starts a throwaway container with read-only mounts, no network, no root and hard limits, so the command finds nothing to read and nowhere to send it, and a short exit reason goes back to the model. Below, each lock alone leaks data while both together stop it, and a microVM replaces the container when strangers or many customers share hosts." data-vz="map"><defs><marker id="sandbox-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="sandbox-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="sandbox-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="sandbox-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="sandbox-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="sandbox-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Model-written code runs in a box with no secrets, no network and hard limits</text><rect class="zone" x="24" y="88" width="1131" height="544" rx="10" data-p="1" data-b="1" data-r="1"/><text class="zn" x="40" y="108" data-p="1" data-b="1" data-r="1">One tool call · made-up bank assistant, real Docker flags</text><rect class="zone green" x="579" y="298" width="576" height="312" rx="10" data-p="1" data-b="3" data-r="3"/><text class="zn green" x="595" y="318" data-p="1" data-b="3" data-r="3">Sandbox: a throwaway container per run</text><rect class="zone red" x="24" y="680" width="1131" height="134" rx="10" data-p="1" data-b="5" data-r="4"/><text class="zn red" x="40" y="700" data-p="1" data-b="5" data-r="4">What the injected command gets</text><rect class="zone" x="24" y="862" width="1131" height="134" rx="10" data-p="1" data-b="6"/><text class="zn" x="40" y="882" data-p="1" data-b="6">Which box · by what an escape would reach</text><rect class="bx red" x="38" y="120" width="212" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="150" data-p="1" data-b="1" data-r="1">Injected CSV cell</text><text class="sb" x="56" y="172" data-p="1" data-b="1" data-r="1">from a client's sheet</text><text class="sb" x="56" y="194" data-p="1" data-b="1" data-r="1">says: send this file out</text><text class="sb mono red" x="56" y="216" data-p="1" data-b="1" data-r="1">~/.aws/credentials</text><rect class="bx blue" x="306" y="120" width="209" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="324" y="150" data-p="1" data-b="1" data-r="1">Model</text><text class="sb" x="324" y="172" data-p="1" data-b="1" data-r="1">obeys the planted text</text><text class="sb" x="324" y="194" data-p="1" data-b="1" data-r="1">writes the command in</text><text class="sb mono" x="324" y="216" data-p="1" data-b="1" data-r="1">tool_use run_python</text><rect class="bx" x="593" y="120" width="225" height="112" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="611" y="150" data-p="1" data-b="2" data-r="1">Agent service</text><text class="sb amber" x="611" y="172" data-p="1" data-b="2" data-r="2">holds API key, DB password</text><text class="sb green" x="611" y="194" data-p="1" data-b="2" data-r="2">never runs model code</text><text class="sb" x="611" y="216" data-p="1" data-b="2" data-r="6">sends the result back</text><rect class="bx" x="874" y="120" width="267" height="134" rx="8" data-p="1" data-b="2" data-r="2"/><text class="nm" x="892" y="150" data-p="1" data-b="2" data-r="2">Runner service</text><text class="sb" x="892" y="172" data-p="1" data-b="2" data-r="2">only one allowed to start boxes</text><text class="sb amber" x="892" y="194" data-p="1" data-b="2" data-r="2">Docker socket = root on host</text><text class="sb" x="892" y="216" data-p="1" data-b="2" data-r="3">run folder <tspan class="mono">/runs/8f3a/</tspan>: in, code, out</text><text class="sb" x="892" y="238" data-p="1" data-b="2" data-r="6">cuts output to a few KB</text><rect class="bx" x="38" y="330" width="476" height="112" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="56" y="360" data-p="1" data-b="4" data-r="6">A short reason back</text><text class="sb mono" x="56" y="382" data-p="1" data-b="4" data-r="6">exit 124: timed out after 60 s</text><text class="sb mono" x="56" y="404" data-p="1" data-b="4" data-r="6">exit 137: killed, memory 1 GB</text><text class="sb" x="56" y="426" data-p="1" data-b="4" data-r="6">the model fixes its code, retries</text><rect class="bx" x="38" y="486" width="476" height="134" rx="8" data-p="1" data-b="4"/><text class="nm" x="56" y="516" data-p="1" data-b="4">Mature: egress proxy</text><text class="sb" x="56" y="538" data-p="1" data-b="4">the only way out, allowlist</text><text class="sb" x="56" y="560" data-p="1" data-b="4">token in the box: a placeholder</text><text class="sb" x="56" y="582" data-p="1" data-b="4">real token only on <tspan class="mono">api.github.com</tspan></text><text class="sb" x="56" y="604" data-p="1" data-b="4">blocked hosts are logged</text><rect class="bx" x="593" y="330" width="225" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="611" y="360" data-p="1" data-b="3" data-r="3">Files: only what it needs</text><text class="sb mono" x="611" y="382" data-p="1" data-b="3" data-r="3">/data /code read-only</text><text class="sb" x="611" y="404" data-p="1" data-b="3" data-r="3">writes only /out and /tmp</text><text class="sb green" x="611" y="426" data-p="1" data-b="3" data-r="4">no <tspan class="mono">~/.aws/credentials</tspan> here</text><rect class="bx amber" x="874" y="330" width="267" height="112" rx="8" data-p="1" data-b="3" data-r="5"/><text class="nm" x="892" y="360" data-p="1" data-b="3" data-r="5">Limits stop buggy code</text><text class="sb mono" x="892" y="382" data-p="1" data-b="3" data-r="5">timeout 60, --memory 1g</text><text class="sb mono" x="892" y="404" data-p="1" data-b="3" data-r="5">--cpus 1, --pids-limit 128</text><text class="sb" x="892" y="426" data-p="1" data-b="3" data-r="5">runner kills it at 75 s</text><rect class="bx" x="593" y="486" width="225" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="611" y="516" data-p="1" data-b="3" data-r="3">Network: none</text><text class="sb mono" x="611" y="538" data-p="1" data-b="3" data-r="3">--network none</text><text class="sb green" x="611" y="560" data-p="1" data-b="3" data-r="4">curl: could not resolve host</text><text class="sb" x="611" y="582" data-p="1" data-b="3" data-r="3">or only allowlisted hosts</text><rect class="bx" x="874" y="486" width="267" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="892" y="516" data-p="1" data-b="3" data-r="3">Not root</text><text class="sb mono" x="892" y="538" data-p="1" data-b="3" data-r="3">--user 65534:65534</text><text class="sb mono" x="892" y="560" data-p="1" data-b="3" data-r="3">--cap-drop ALL</text><text class="sb mono" x="892" y="582" data-p="1" data-b="3" data-r="3">no-new-privileges</text><rect class="bx red" x="38" y="712" width="212" height="90" rx="8" data-p="1" data-b="5"/><text class="nm" x="56" y="742" data-p="1" data-b="5">No sandbox</text><text class="sb" x="56" y="764" data-p="1" data-b="5">runs inside the agent service</text><text class="sb red" x="56" y="786" data-p="1" data-b="5">keys and DB password leave</text><rect class="bx amber" x="306" y="712" width="209" height="90" rx="8" data-p="1" data-b="5" data-r="4"/><text class="nm" x="324" y="742" data-p="1" data-b="5" data-r="4">Files locked only</text><text class="sb" x="324" y="764" data-p="1" data-b="5" data-r="4">curl sends the CSV out:</text><text class="sb amber" x="324" y="786" data-p="1" data-b="5" data-r="4">every client's holdings leave</text><rect class="bx amber" x="593" y="712" width="225" height="90" rx="8" data-p="1" data-b="5"/><text class="nm" x="611" y="742" data-p="1" data-b="5">Network locked only</text><text class="sb" x="611" y="764" data-p="1" data-b="5">key hidden in an exported file</text><text class="sb amber" x="611" y="786" data-p="1" data-b="5">or in a line in <tspan class="mono">~/.bashrc</tspan></text><rect class="bx green" x="874" y="712" width="267" height="90" rx="8" data-p="1" data-b="5" data-r="4"/><text class="nm" x="892" y="742" data-p="1" data-b="5" data-r="4">Both locked</text><text class="sb" x="892" y="764" data-p="1" data-b="5" data-r="4">no file to read, no way out</text><text class="sb green" x="892" y="786" data-p="1" data-b="5" data-r="4">the injected command fails</text><rect class="bx amber" x="38" y="894" width="476" height="90" rx="8" data-p="1" data-b="6"/><text class="nm" x="56" y="924" data-p="1" data-b="6">Container or OS sandbox</text><text class="sb" x="56" y="946" data-p="1" data-b="6">shares the host kernel: one bug lets code out</text><text class="sb" x="56" y="968" data-p="1" data-b="6">a fine start on a host for one team's staff</text><rect class="bx green" x="593" y="894" width="548" height="90" rx="8" data-p="1" data-b="6"/><text class="nm" x="611" y="924" data-p="1" data-b="6">Firecracker microVM per session</text><text class="sb" x="611" y="946" data-p="1" data-b="6">own kernel, boots under 125 ms, under 5 MiB</text><text class="sb green" x="611" y="968" data-p="1" data-b="6">for strangers, or many customers on a host</text><path class="ar red" d="M250,176 L302,176" marker-end="url(#sandbox-map-r)" data-p="1" data-b="1" data-base="1"/><path class="ar blue" d="M514,176 L589,176" marker-end="url(#sandbox-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M818,176 L870,176" marker-end="url(#sandbox-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M1008,254 L1008,326" marker-end="url(#sandbox-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M593,386 L518,386" marker-end="url(#sandbox-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M410,330 L410,236" marker-end="url(#sandbox-map-b)" data-p="1" data-b="4" data-base="1"/><path class="ar dash" d="M593,542 L518,542" marker-end="url(#sandbox-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar red" d="M250,176 L302,176" marker-end="url(#sandbox-map-r)" data-p="1" data-r="1" data-route="1"/><path class="ar blue" d="M593,140 L518,140" marker-end="url(#sandbox-map-b)" data-p="1" data-r="1" data-route="1"/><path class="ar red" d="M514,180 L589,180" marker-end="url(#sandbox-map-r)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M818,146 L870,146" marker-end="url(#sandbox-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M968,254 L968,326" marker-end="url(#sandbox-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar red" d="M1048,330 L1048,258" marker-end="url(#sandbox-map-r)" data-p="1" data-r="5" data-route="1"/><path class="ar" d="M874,206 L822,206" marker-end="url(#sandbox-map-a)" data-p="1" data-r="6" data-route="1"/><path class="ar blue" d="M593,216 L518,216" marker-end="url(#sandbox-map-b)" data-p="1" data-r="6" data-route="1"/><text class="lb" x="996" y="291" text-anchor="end" data-p="1" data-b="3" data-base="1">docker run, fresh run folder</text><text class="lb mono" x="422" y="285" data-p="1" data-b="4" data-base="1">tool_result</text><circle class="bd solid" cx="572" cy="140" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="572" y="144.5" data-p="1" data-r="1" data-route="1">1</text><line class="lk" x1="572" y1="140" x2="572" y2="79" data-p="1" data-r="1" data-route="1"/><text class="lb" x="572" y="74" text-anchor="middle" data-p="1" data-r="1" data-route="1">question + CSV + tool</text><text class="lb" x="546" y="169" text-anchor="middle" data-p="1" data-r="1" data-route="1">tool_use</text><circle class="bd solid" cx="839" cy="146" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="839" y="150.5" data-p="1" data-r="2" data-route="1">2</text><line class="lk" x1="839" y1="146" x2="839" y2="75" data-p="1" data-r="2" data-route="1"/><text class="lb mono" x="839" y="70" text-anchor="middle" data-p="1" data-r="2" data-route="1">POST /runs</text><circle class="bd solid" cx="968" cy="275" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="968" y="279.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="968" y1="275" x2="943" y2="275" data-p="1" data-r="3" data-route="1"/><text class="lb mono" x="904" y="279" text-anchor="middle" data-p="1" data-r="3" data-route="1">docker run</text><circle class="bd solid" cx="1048" cy="309" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="1048" y="313.5" data-p="1" data-r="5" data-route="1">5</text><text class="lb" x="1060" y="283" data-p="1" data-r="5" data-route="1">exit 124</text><circle class="bd solid" cx="853" cy="206" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="853" y="210.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="853" y1="206" x2="847" y2="247" data-p="1" data-r="6" data-route="1"/><text class="lb mono" x="773" y="260" text-anchor="middle" data-p="1" data-r="6" data-route="1">exit 124: timed out</text><circle class="bd solid" cx="572" cy="216" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="572" y="220.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="572" y1="216" x2="572" y2="247" data-p="1" data-r="6" data-route="1"/><text class="lb mono" x="572" y="260" text-anchor="middle" data-p="1" data-r="6" data-route="1">tool_result</text><line class="ar" x1="24" y1="1032.0" x2="58" y2="1032.0" marker-end="url(#sandbox-map-a)"/><text class="sb" x="68" y="1036">calls</text><line class="ar blue" x1="125.885" y1="1032.0" x2="159.885" y2="1032.0" marker-end="url(#sandbox-map-b)"/><text class="sb" x="170" y="1036">model traffic</text><line class="ar red" x1="278.0553" y1="1032.0" x2="312.0553" y2="1032.0" marker-end="url(#sandbox-map-r)"/><text class="sb" x="322" y="1036">planted text</text><line class="ar dash" x1="424.7708" y1="1032.0" x2="458.7708" y2="1032.0" marker-end="url(#sandbox-map-a)"/><text class="sb" x="469" y="1036">mature only</text></svg>