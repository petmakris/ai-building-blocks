<svg class="vz" viewBox="0 0 1193 1203" role="img" aria-label="Gemini fixes only the shape, so three checks and the QR code clean the answer before a person confirms it" data-vz="sequence"><defs><marker id="structured-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="structured-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="structured-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="structured-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="structured-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="structured-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Gemini fixes only the shape, so three checks and the QR code clean the answer before a person confirms it</text><text class="sub" x="24" y="62">Example: a made-up Swisscom invoice for CHF 79.90, read under Billpod's real rules.</text><line class="life" x1="97" y1="132" x2="97" y2="1105"/><line class="life" x1="260" y1="132" x2="260" y2="892"/><line class="life" x1="410" y1="132" x2="410" y2="1105"/><line class="life" x1="260" y1="954" x2="260" y2="1105"/><rect class="bx" x="24" y="78" width="145" height="54" rx="8"/><text class="nm" x="97" y="101" text-anchor="middle">Reader</text><text class="sb" x="97" y="120" text-anchor="middle">Billpod's bill reader</text><rect class="bx red" x="196" y="78" width="129" height="54" rx="8"/><text class="nm" x="260" y="101" text-anchor="middle">Gateway</text><text class="sb red" x="260" y="120" text-anchor="middle">every model call</text><rect class="bx blue" x="351" y="78" width="118" height="54" rx="8"/><text class="nm" x="410" y="101" text-anchor="middle">Gemini</text><text class="sb blue" x="410" y="120" text-anchor="middle">the model</text><rect class="bx green" x="191" y="900" width="138" height="54" rx="8"/><text class="nm" x="260" y="923" text-anchor="middle">Person</text><text class="sb green" x="260" y="942" text-anchor="middle">confirms the draft</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip" x="53" y="150" width="262" height="35" rx="6"/><text class="lb mono" x="184" y="172" text-anchor="middle">callJson · schema · 4096 tokens</text><line class="ar" x1="111" y1="191" x2="256" y2="191" marker-end="url(#structured-seq-a)"/><circle class="bd solid" cx="97" cy="191" r="10"/><text class="n" x="97" y="195.5">1</text></g><g data-step="s2" data-p="1" data-r="1"><rect class="chip blue" x="235" y="211" width="199" height="54" rx="6"/><text class="lb" x="334" y="233" text-anchor="middle">PDF + responseSchema</text><text class="lb mono" x="334" y="252" text-anchor="middle">in the request settings</text><line class="ar blue" x1="262" y1="271" x2="406" y2="271" marker-end="url(#structured-seq-b)"/></g><g data-step="s3" data-p="1" data-r="2"><path class="ar blue" d="M410,299 H422 V337 H414" marker-end="url(#structured-seq-b)"/><rect class="chip blue" x="442" y="291" width="134" height="54" rx="6"/><text class="sb" x="452" y="313">keeps only tokens</text><text class="sb" x="452" y="332">that fit the schema</text><circle class="bd solid" cx="410" cy="318" r="10"/><text class="n" x="410" y="322.5">2</text></g><g data-step="s4" data-p="1" data-r="3"><text class="lb green" x="330" y="397" text-anchor="middle">200 · finishReason STOP</text><line class="ar green dash" x1="396" y1="369" x2="264" y2="369" marker-end="url(#structured-seq-g)"/><circle class="bd solid" cx="410" cy="369" r="10"/><text class="n" x="410" y="373.5">3</text><rect class="chip green" x="202" y="414" width="117" height="24" rx="12"/><text class="sb green" x="260" y="430" text-anchor="middle">✓ finish reason</text></g><g data-step="s5" data-p="1" data-r="3"><path class="ar amber" d="M260,464 H272 V483 H264" marker-end="url(#structured-seq-m)"/><rect class="chip amber" x="276" y="456" width="182" height="35" rx="6"/><text class="sb" x="286" y="478">SAFETY: blocked, no retry</text></g><g data-step="s6" data-p="1" data-r="4"><path class="ar red" d="M260,515 H272 V553 H264" marker-end="url(#structured-seq-r)"/><rect class="chip red" x="292" y="507" width="229" height="54" rx="6"/><text class="sb" x="302" y="529">parse, then the same Zod schema</text><text class="sb mono" x="302" y="548">"2026-02-30" still passes</text><circle class="bd solid" cx="260" cy="534" r="10"/><text class="n" x="260" y="538.5">4</text><rect class="chip green" x="292" y="569" width="123" height="24" rx="12"/><text class="sb green" x="354" y="586" text-anchor="middle">✓ whole answer</text></g><g data-step="s7" data-p="1" data-r="4"><text class="lb green" x="180" y="637" text-anchor="middle">{ data }, typed</text><line class="ar green dash" x1="258" y1="617" x2="101" y2="617" marker-end="url(#structured-seq-g)"/></g><g data-step="s8" data-p="1" data-r="5"><path class="ar red" d="M97,672 H109 V691 H101" marker-end="url(#structured-seq-r)"/><rect class="chip red" x="129" y="664" width="211" height="35" rx="6"/><text class="sb" x="139" y="686">dueDate 2026-02-30: dropped</text><circle class="bd solid" cx="97" cy="682" r="10"/><text class="n" x="97" y="686.0">5</text><rect class="chip red" x="129" y="707" width="104" height="24" rx="12"/><text class="sb red" x="181" y="724" text-anchor="middle">✗ date exists</text></g><g data-step="s9" data-p="1" data-r="5"><path class="ar green" d="M97,755 H109 V774 H101" marker-end="url(#structured-seq-g)"/><rect class="chip green" x="113" y="747" width="199" height="35" rx="6"/><text class="sb" x="123" y="769">IBAN checksum passes: kept</text><rect class="chip green" x="113" y="790" width="84" height="24" rx="12"/><text class="sb green" x="154" y="806" text-anchor="middle">✓ mod 97</text></g><g data-step="s10" data-p="1" data-r="6"><path class="ar green" d="M97,838 H109 V876 H101" marker-end="url(#structured-seq-g)"/><rect class="chip green" x="129" y="830" width="231" height="54" rx="6"/><text class="sb" x="139" y="852">the QR code wins</text><text class="sb mono" x="139" y="871">iban = qr?.iban ?? ai?.iban</text><circle class="bd solid" cx="97" cy="857" r="10"/><text class="n" x="97" y="861.5">6</text></g><g data-step="s11" data-p="1" data-r="7"><rect class="chip" x="72" y="970" width="223" height="54" rx="6"/><text class="lb" x="184" y="992" text-anchor="middle">draft · every field with its source</text><text class="lb mono" x="184" y="1011" text-anchor="middle">qr · ai · recurring · none</text><line class="ar" x1="111" y1="1030" x2="256" y2="1030" marker-end="url(#structured-seq-a)"/><circle class="bd solid" cx="97" cy="1030" r="10"/><text class="n" x="97" y="1034.5">7</text></g><g data-step="s12" data-p="1" data-r="7"><text class="lb green" x="180" y="1078" text-anchor="middle">confirm or correct</text><line class="ar green dash" x1="258" y1="1058" x2="101" y2="1058" marker-end="url(#structured-seq-g)"/></g><rect class="bx green" x="24" y="1111" width="1145" height="68" rx="8" data-p="1" data-r="7"/><text class="nm green" x="42" y="1139" data-p="1" data-r="7">A draft the person confirms, never a bill filed on its own</text><text class="sb" x="42" y="1163" data-p="1" data-r="7">Bad values were dropped, not guessed, and the QR code's IBAN beat the model's. On a bill without a QR code, only the person can catch a changed IBAN.</text></svg>