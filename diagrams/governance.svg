<svg class="ov-svg" viewBox="0 0 1120 890" role="img" aria-label="An adviser's notes service sends a prompt with three headers to an AI gateway, the only service with the OpenAI keys. The gateway refuses any call with no approved inventory row, calls the pinned snapshot in OpenAI's Europe region, stores the prompt and the draft in a content store and inserts a call row. The adviser's edit is inserted later as a separate event row. The row's risk class adds controls, and fourteen months later audit answers five questions from these records.">
<defs>
<marker id="governance-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="governance-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="governance-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker>
</defs>
<text class="ttl" x="24" y="38">One gateway checks the inventory, pins the model and keeps each draft for audit</text>
<text class="sb" x="24" y="64">Example: a made-up Swiss bank drafts a meeting note after a client call. The OpenAI names and terms are real.</text>

<text class="zl" x="24" y="100">WHO CALLS</text>
<text class="zl" x="300" y="100">THE GATEWAY</text>
<text class="zl" x="620" y="100">THE PROVIDER</text>
<text class="zl" x="886" y="100">INSERT-ONLY RECORDS</text>

<!-- callers -->
<rect class="bx" x="24" y="120" width="220" height="96" rx="8"/>
<text class="nm" x="42" y="150">Adviser</text>
<text class="sb mono" x="42" y="174">rm.jmuster</text>
<text class="sb" x="42" y="196">presses "draft note"</text>

<rect class="bx" x="24" y="262" width="220" height="156" rx="8"/>
<text class="nm mono" x="42" y="292">advisory-notes</text>
<text class="sb" x="42" y="316">stops an empty transcript</text>
<text class="sb" x="42" y="340">sends prompt + 3 headers:</text>
<text class="sb mono" x="42" y="362">meeting-note-draft</text>
<text class="sb mono" x="42" y="384">meeting-note/v7</text>
<text class="sb mono" x="42" y="406">rm.jmuster</text>

<!-- gateway -->
<rect class="bx red" x="300" y="120" width="250" height="224" rx="8"/>
<text class="nm" x="318" y="150">AI gateway</text>
<text class="sb" x="318" y="174">alone holds the OpenAI keys</text>
<text class="sb red" x="318" y="204">1  no row: refuse, send nothing</text>
<text class="sb" x="318" y="226">2  use the row's model, region</text>
<text class="sb" x="318" y="248">3  other model reported: alert</text>
<text class="sb green" x="318" y="270">4  store prompt and draft</text>
<text class="sb green" x="318" y="292">5  insert the call row</text>
<text class="sb" x="318" y="314">6  return draft + call_id c-81f2</text>

<rect class="bx" x="300" y="400" width="250" height="136" rx="8"/>
<text class="nm" x="318" y="430">Inventory row</text>
<text class="sb mono" x="318" y="454">meeting-note-draft</text>
<text class="sb" x="318" y="476">class Medium, approved by risk</text>
<text class="sb" x="318" y="498">pins the model and the region</text>
<text class="sb" x="318" y="520">caller allowed: advisory-notes</text>

<!-- provider -->
<rect class="bx blue" x="620" y="120" width="220" height="184" rx="8"/>
<text class="nm" x="638" y="150">OpenAI</text>
<text class="sb mono" x="638" y="174">gpt-4o-2024-08-06</text>
<text class="sb" x="638" y="196">a fixed, dated build</text>
<text class="sb mono" x="638" y="220">eu.api.openai.com</text>
<text class="sb" x="638" y="242">Europe (EEA + Switzerland)</text>
<text class="sb amber" x="638" y="266">default terms: 30-day copy</text>
<text class="sb green" x="638" y="288">this row: no copy kept</text>

<rect class="bx amber" x="620" y="380" width="220" height="114" rx="8"/>
<text class="nm" x="638" y="410">Alias <tspan class="mono">gpt-4o</tspan></text>
<text class="sb" x="638" y="434">moves to newer builds</text>
<text class="sb" x="638" y="456">an eval on it goes stale</text>
<text class="sb amber" x="638" y="478">the row never names one</text>

<!-- records -->
<rect class="bx green" x="886" y="120" width="210" height="116" rx="8"/>
<text class="nm" x="904" y="150">Content store</text>
<text class="sb" x="904" y="174">encrypted bucket</text>
<text class="sb" x="904" y="198"><tspan class="mono">in/c-81f2</tspan> prompt as sent</text>
<text class="sb" x="904" y="220"><tspan class="mono">out/c-81f2</tspan> the draft</text>

<rect class="bx green" x="886" y="262" width="210" height="136" rx="8"/>
<text class="nm" x="904" y="292">Call row</text>
<text class="sb mono" x="904" y="316">c-81f2 15:41:07</text>
<text class="sb" x="904" y="338">model asked and reported</text>
<text class="sb" x="904" y="360">prompt v7, region EU</text>
<text class="sb green" x="904" y="382">INSERT, never UPDATE</text>

<rect class="bx green" x="886" y="430" width="210" height="116" rx="8"/>
<text class="nm" x="904" y="460">Event row</text>
<text class="sb mono" x="904" y="484">c-81f2 edited</text>
<text class="sb" x="904" y="506">by rm.jmuster at 15:52</text>
<text class="sb green" x="904" y="528">the draft stays as written</text>

<!-- legend -->
<line class="ar" x1="24" y1="458" x2="60" y2="458" marker-end="url(#governance-a)"/>
<text class="sb" x="70" y="462">a call</text>
<line class="ar blue" x1="24" y1="484" x2="60" y2="484" marker-end="url(#governance-b)"/>
<text class="sb" x="70" y="488">model call</text>
<line class="ar green" x1="24" y1="510" x2="60" y2="510" marker-end="url(#governance-g)"/>
<text class="sb" x="70" y="514">insert-only write</text>

<!-- arrows -->
<line class="ar" x1="134" y1="216" x2="134" y2="258" marker-end="url(#governance-a)"/>
<line class="ar blue" x1="244" y1="290" x2="296" y2="290" marker-end="url(#governance-b)"/>
<line class="ar blue" x1="300" y1="324" x2="248" y2="324" marker-end="url(#governance-b)"/>
<line class="ar" x1="425" y1="344" x2="425" y2="396" marker-end="url(#governance-a)"/>
<text class="lb" x="435" y="376">row for use case + caller</text>
<line class="ar blue" x1="550" y1="170" x2="616" y2="170" marker-end="url(#governance-b)"/>
<line class="ar blue" x1="620" y1="236" x2="554" y2="236" marker-end="url(#governance-b)"/>
<path class="ar green" d="M550,318 H862 V178 H882" marker-end="url(#governance-g)"/>
<line class="ar green" x1="550" y1="336" x2="882" y2="336" marker-end="url(#governance-g)"/>
<path class="ar green" d="M222,418 V566 H991 V550" marker-end="url(#governance-g)"/>
<text class="lb" x="600" y="556">the edit, saved as a new row</text>

<!-- risk class -->
<text class="zl" x="24" y="604">THE ROW'S RISK CLASS ADDS CONTROLS · EXAMPLE RULE</text>
<rect class="bx" x="24" y="618" width="340" height="114" rx="8"/>
<text class="nm" x="42" y="648">Low</text>
<text class="sb" x="42" y="672">no client data, helps employees</text>
<text class="sb green" x="42" y="694">inventory row, call and event rows</text>
<text class="sb amber" x="42" y="716">default terms allowed: 30-day copy</text>

<rect class="bx blue" x="390" y="618" width="340" height="114" rx="8"/>
<text class="nm" x="408" y="648">Medium · the meeting note</text>
<text class="sb" x="408" y="672">client data, a person fixes each draft</text>
<text class="sb green" x="408" y="694">+ Europe region, no copy at OpenAI</text>
<text class="sb green" x="408" y="716">+ eval each release, weekly monitoring</text>

<rect class="bx" x="756" y="618" width="340" height="114" rx="8"/>
<text class="nm" x="774" y="648">High</text>
<text class="sb" x="774" y="672">reaches a client with no rewrite</text>
<text class="sb green" x="774" y="694">+ zero data retention at OpenAI</text>
<text class="sb green" x="774" y="716">+ named approver for each output</text>

<line class="ar" x1="364" y1="675" x2="386" y2="675" marker-end="url(#governance-a)"/>
<line class="ar" x1="730" y1="675" x2="752" y2="675" marker-end="url(#governance-a)"/>

<!-- audit -->
<text class="zl" x="24" y="770">14 MONTHS LATER, AUDIT ASKS FIVE QUESTIONS · EACH HAS A RECORD</text>
<rect class="bx" x="24" y="784" width="200" height="92" rx="8"/>
<text class="nm" x="40" y="812">Which model?</text>
<text class="sb mono" x="40" y="834">gpt-4o-2024-08-06</text>
<text class="sb green" x="40" y="858">call row</text>

<rect class="bx" x="242" y="784" width="200" height="92" rx="8"/>
<text class="nm" x="258" y="812">What did it write?</text>
<text class="sb" x="258" y="834"><tspan class="mono">out/c-81f2</tspan>, pre-edit</text>
<text class="sb green" x="258" y="858">content store</text>

<rect class="bx" x="460" y="784" width="200" height="92" rx="8"/>
<text class="nm" x="476" y="812">Where did data go?</text>
<text class="sb" x="476" y="834">EU region, no copy kept</text>
<text class="sb green" x="476" y="858">call row + inventory</text>

<rect class="bx" x="678" y="784" width="200" height="92" rx="8"/>
<text class="nm" x="694" y="812">Tested? Signed?</text>
<text class="sb" x="694" y="834">1 bad of 300, bar 1%</text>
<text class="sb green" x="694" y="858">eval report, reviewer</text>

<rect class="bx" x="896" y="784" width="200" height="92" rx="8"/>
<text class="nm" x="912" y="812">Still working?</text>
<text class="sb" x="912" y="834">200 calls scored a week</text>
<text class="sb green" x="912" y="858">monitoring records</text>
</svg>
