<svg class="vz" viewBox="0 0 1568 1072" role="img" aria-label="Two loops call Billpod&#x27;s tools. In the app, Billpod&#x27;s loop sends Gemini the rules, the chat and 46 tool definitions; Gemini only replies with a request to call a tool, and the loop runs reads at once, stops a listed write at a confirmation card, and ends at 6 model calls or a reply with no call. Over MCP, Claude or ChatGPT runs its own loop and sends tools/call with an OAuth token, where a missing scope is refused with 403. Every call from both loops goes through one runner, runTool, which checks scopes, input, the handler and the output, and calls the same services the REST routes use." data-vz="map"><defs><marker id="tools-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="tools-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="tools-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="tools-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="tools-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="tools-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The model only asks for a tool call; your code decides whether it runs</text><text class="zl" x="38" y="70">THE PERSON AND THE DOORS</text><text class="zl" x="582" y="70">THE LOOP AND THE RUNNER</text><text class="zl" x="1299" y="70">THE MODEL AND THE SERVICES</text><rect class="zone blue" x="24" y="88" width="1520" height="356" rx="10" data-p="1" data-b="1" data-r="1"/><text class="zn blue" x="40" y="108" data-p="1" data-b="1" data-r="1">In the app</text><rect class="zone blue" x="24" y="822" width="1520" height="178" rx="10" data-p="1" data-b="4"/><text class="zn blue" x="40" y="842" data-p="1" data-b="4">Over MCP</text><rect class="bx" x="38" y="120" width="218" height="90" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="150" data-p="1" data-b="1" data-r="1">The person</text><text class="sb" x="56" y="172" data-p="1" data-b="1" data-r="1">"I paid the electricity</text><text class="sb" x="56" y="194" data-p="1" data-b="1" data-r="1">bill by Twint today."</text><rect class="bx green" x="38" y="320" width="218" height="112" rx="8" data-p="1" data-b="3" data-r="5"/><text class="nm" x="56" y="350" data-p="1" data-b="3" data-r="5">Confirmation card</text><text class="sb" x="56" y="372" data-p="1" data-b="3" data-r="5">31 writes need one first</text><text class="sb" x="56" y="394" data-p="1" data-b="3" data-r="5">shows the stored record</text><text class="sb green" x="56" y="416" data-p="1" data-b="3" data-r="6">Approve runs it as shown</text><rect class="bx" x="582" y="120" width="356" height="312" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="600" y="150" data-p="1" data-b="1" data-r="1">Billpod's loop</text><text class="sb mono" x="600" y="172" data-p="1" data-b="1" data-r="1">createAssistant</text><text class="sb" x="600" y="204" data-p="1" data-b="1" data-r="1">each call resends rules,</text><text class="sb" x="600" y="226" data-p="1" data-b="1" data-r="1">chat and all calls so far</text><text class="sb" x="600" y="248" data-p="1" data-b="1" data-r="4">a result goes back under role <tspan class="mono">user</tspan></text><text class="sb amber" x="600" y="280" data-p="1" data-b="1" data-r="1">stops at 6 model calls</text><text class="sb green" x="600" y="302" data-p="1" data-b="1" data-r="7">ends on a reply with no call</text><text class="sb" x="600" y="334" data-p="1" data-b="3" data-r="1">behind a card, later writes</text><text class="sb" x="600" y="356" data-p="1" data-b="3" data-r="1">are answered "not run"</text><rect class="bx blue" x="1299" y="120" width="231" height="156" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="1317" y="150" data-p="1" data-b="1" data-r="1">Gemini Flash</text><text class="sb" x="1317" y="172" data-p="1" data-b="1" data-r="1">sees 46 of the 50 tools</text><text class="sb" x="1317" y="194" data-p="1" data-b="1" data-r="4">keeps nothing between calls</text><text class="sb blue" x="1317" y="216" data-p="1" data-b="1" data-r="2">replies text or a call</text><text class="sb amber" x="1317" y="238" data-p="1" data-b="1" data-r="1">can be steered by text</text><text class="sb amber" x="1317" y="260" data-p="1" data-b="1" data-r="1">inside a tool result</text><rect class="bx red" x="582" y="492" width="356" height="286" rx="8" data-p="1" data-b="2" data-r="3"/><text class="nm mono" x="600" y="522" data-p="1" data-b="2" data-r="3">runTool</text><text class="sb" x="600" y="544" data-p="1" data-b="2" data-r="3">one runner for every tool call</text><text class="sb" x="600" y="576" data-p="1" data-b="2" data-r="3">1 · caller holds the scopes</text><text class="sb amber" x="600" y="598" data-p="1" data-b="2" data-r="3">else "Tell the person; do not retry."</text><text class="sb" x="600" y="620" data-p="1" data-b="2" data-r="3">2 · zod validates the input</text><text class="sb amber" x="600" y="642" data-p="1" data-b="2" data-r="3">else one message per wrong field</text><text class="sb" x="600" y="664" data-p="1" data-b="2" data-r="3">3 · handler calls the service</text><text class="sb amber" x="600" y="686" data-p="1" data-b="2" data-r="3">a crash: one fixed message, logged</text><text class="sb" x="600" y="708" data-p="1" data-b="2" data-r="3">4 · output fits its schema</text><text class="sb amber" x="600" y="730" data-p="1" data-b="2" data-r="3">else INTERNAL_ERROR, logged</text><text class="sb green" x="600" y="762" data-p="1" data-b="2" data-r="3">always returns data or an error the model can act on</text><rect class="bx green" x="1299" y="492" width="231" height="112" rx="8" data-p="1" data-b="2" data-r="3"/><text class="nm" x="1317" y="522" data-p="1" data-b="2" data-r="3">Billpod services</text><text class="sb" x="1317" y="544" data-p="1" data-b="2" data-r="3">REST routes call them too</text><text class="sb green" x="1317" y="566" data-p="1" data-b="2" data-r="6">refuse a stale version</text><text class="sb green" x="1317" y="588" data-p="1" data-b="2" data-r="3">bind screens and AI alike</text><rect class="bx green" x="38" y="854" width="218" height="134" rx="8" data-p="1" data-b="4"/><text class="nm mono" x="56" y="884" data-p="1" data-b="4">POST /mcp</text><text class="sb" x="56" y="906" data-p="1" data-b="4">OAuth 2.1 Bearer token</text><text class="sb" x="56" y="928" data-p="1" data-b="4">scopes the person ticked</text><text class="sb green" x="56" y="950" data-p="1" data-b="4">a missing scope: 403</text><text class="sb green" x="56" y="972" data-p="1" data-b="4">the tool never runs</text><rect class="bx blue" x="582" y="854" width="356" height="134" rx="8" data-p="1" data-b="4"/><text class="nm" x="600" y="884" data-p="1" data-b="4">Claude or ChatGPT</text><text class="sb" x="600" y="906" data-p="1" data-b="4">keeps the chat, runs the loop</text><text class="sb" x="600" y="928" data-p="1" data-b="4">one tools/call per call</text><text class="sb amber" x="600" y="950" data-p="1" data-b="4">Billpod's cap and card</text><text class="sb amber" x="600" y="972" data-p="1" data-b="4">do not apply here</text><rect class="bx blue" x="1299" y="854" width="231" height="90" rx="8" data-p="1" data-b="4"/><text class="nm" x="1317" y="884" data-p="1" data-b="4">Their own model</text><text class="sb" x="1317" y="906" data-p="1" data-b="4">Anthropic's, inside Claude</text><text class="sb blue" x="1317" y="928" data-p="1" data-b="4">sees all 50 tools</text><path class="ar" d="M256,165 L578,165" marker-end="url(#tools-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M938,182 L1295,182" marker-end="url(#tools-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar blue" d="M1299,214 L942,214" marker-end="url(#tools-map-b)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M700,432 L700,488" marker-end="url(#tools-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M820,492 L820,436" marker-end="url(#tools-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar red" d="M938,548 L1295,548" marker-end="url(#tools-map-r)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M582,376 L260,376" marker-end="url(#tools-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M147,210 L147,316" marker-end="url(#tools-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M117,432 L117,575 L578,575" marker-end="url(#tools-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M938,883 L1295,883" marker-end="url(#tools-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M1299,915 L942,915" marker-end="url(#tools-map-b)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M582,921 L260,921" marker-end="url(#tools-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M197,854 L197,715 L578,715" marker-end="url(#tools-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M760,778 L760,850" marker-end="url(#tools-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M256,165 L578,165" marker-end="url(#tools-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M938,118 L1295,118" marker-end="url(#tools-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar blue" d="M1299,150 L942,150" marker-end="url(#tools-map-b)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M610,432 L610,488" marker-end="url(#tools-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar red" d="M938,548 L1295,548" marker-end="url(#tools-map-r)" data-p="1" data-r="3" data-route="1"/><path class="ar green" d="M700,492 L700,436" marker-end="url(#tools-map-g)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M938,182 L1295,182" marker-end="url(#tools-map-a)" data-p="1" data-r="4" data-route="1"/><path class="ar blue" d="M1299,214 L942,214" marker-end="url(#tools-map-b)" data-p="1" data-r="4" data-route="1"/><path class="ar" d="M582,376 L260,376" marker-end="url(#tools-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar green" d="M147,210 L147,316" marker-end="url(#tools-map-g)" data-p="1" data-r="6" data-route="1"/><path class="ar" d="M117,432 L117,575 L578,575" marker-end="url(#tools-map-a)" data-p="1" data-r="6" data-route="1"/><path class="ar green" d="M910,492 L910,436" marker-end="url(#tools-map-g)" data-p="1" data-r="6" data-route="1"/><path class="ar" d="M938,246 L1295,246" marker-end="url(#tools-map-a)" data-p="1" data-r="7" data-route="1"/><path class="ar green" d="M1299,278 L942,278" marker-end="url(#tools-map-g)" data-p="1" data-r="7" data-route="1"/><text class="lb" x="422" y="154" text-anchor="middle" data-p="1" data-b="1" data-base="1">message</text><text class="lb" x="1121" y="171" text-anchor="middle" data-p="1" data-b="1" data-base="1">rules + chat + 46 tools</text><text class="lb" x="1114" y="203" text-anchor="middle" data-p="1" data-b="1" data-base="1">functionCall: name + args · a request only; nothing ran</text><text class="lb" x="688" y="457" text-anchor="end" data-p="1" data-b="2" data-base="1">no card needed: runs now</text><text class="lb" x="832" y="461" data-p="1" data-b="2" data-base="1">result appended for the next call</text><text class="lb" x="418" y="365" text-anchor="middle" data-p="1" data-b="3" data-base="1">on confirm list</text><text class="lb" x="159" y="259" data-p="1" data-b="3" data-base="1">presses Approve</text><text class="lb" x="344" y="564" text-anchor="middle" data-p="1" data-b="3" data-base="1">the approved call</text><text class="lb" x="1118" y="872" text-anchor="middle" data-p="1" data-b="4" data-base="1">chat + all 50 tools</text><text class="lb" x="1121" y="904" text-anchor="middle" data-p="1" data-b="4" data-base="1">a tool call</text><text class="lb" x="425" y="910" text-anchor="middle" data-p="1" data-b="4" data-base="1"><tspan class="mono">tools/call</tspan></text><text class="lb" x="772" y="815" data-p="1" data-b="4" data-base="1">JSON result; isError on failure</text><circle class="bd solid" cx="277" cy="165" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="277" y="169.5" data-p="1" data-r="1" data-route="1">1</text><text class="lb" x="417" y="154" text-anchor="middle" data-p="1" data-r="1" data-route="1">"I paid the electricity bill…"</text><circle class="bd solid" cx="959" cy="118" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="959" y="122.5" data-p="1" data-r="1" data-route="1">1</text><text class="lb" x="1111" y="107" text-anchor="middle" data-p="1" data-r="1" data-route="1">rules + conversation + 46 tools</text><circle class="bd solid" cx="1278" cy="150" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="1278" y="154.5" data-p="1" data-r="2" data-route="1">2</text><text class="lb mono" x="1117" y="139" text-anchor="middle" data-p="1" data-r="2" data-route="1">find_bills("electricity")</text><circle class="bd solid" cx="610" cy="453" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="610" y="457.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="610" y1="453" x2="590" y2="454" data-p="1" data-r="3" data-route="1"/><text class="lb" x="514" y="467" text-anchor="middle" data-p="1" data-r="3" data-route="1">find_bills + who is asking</text><circle class="bd solid" cx="700" cy="471" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="700" y="475.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="700" y1="471" x2="726" y2="471" data-p="1" data-r="3" data-route="1"/><text class="lb" x="796" y="475" text-anchor="middle" data-p="1" data-r="3" data-route="1">ok · bill b_81, version 3</text><circle class="bd solid" cx="959" cy="182" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="959" y="186.5" data-p="1" data-r="4" data-route="1">4</text><text class="lb" x="1117" y="171" text-anchor="middle" data-p="1" data-r="4" data-route="1">same body + call + result</text><circle class="bd solid" cx="1278" cy="214" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="1278" y="218.5" data-p="1" data-r="4" data-route="1">4</text><text class="lb mono" x="1118" y="203" text-anchor="middle" data-p="1" data-r="4" data-route="1">mark_paid(b_81, v3)</text><circle class="bd solid" cx="561" cy="376" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="561" y="380.5" data-p="1" data-r="5" data-route="1">5</text><text class="lb" x="416" y="365" text-anchor="middle" data-p="1" data-r="5" data-route="1">example: EWZ, CHF 79.90, Twint, today?</text><circle class="bd solid" cx="147" cy="231" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="147" y="235.5" data-p="1" data-r="6" data-route="1">6</text><text class="lb" x="159" y="259" data-p="1" data-r="6" data-route="1">Approve</text><circle class="bd solid" cx="117" cy="453" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="117" y="457.5" data-p="1" data-r="6" data-route="1">6</text><text class="lb" x="351" y="564" text-anchor="middle" data-p="1" data-r="6" data-route="1">mark_paid, as the card showed</text><circle class="bd solid" cx="910" cy="471" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="910" y="475.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="910" y1="471" x2="938" y2="471" data-p="1" data-r="6" data-route="1"/><text class="lb" x="990" y="475" text-anchor="middle" data-p="1" data-r="6" data-route="1">ok · bill b_81 paid</text><circle class="bd solid" cx="959" cy="246" r="11" data-p="1" data-r="7" data-route="1"/><text class="n" x="959" y="250.5" data-p="1" data-r="7" data-route="1">7</text><text class="lb" x="1120" y="235" text-anchor="middle" data-p="1" data-r="7" data-route="1">same body + mark_paid result</text><circle class="bd solid" cx="1278" cy="278" r="11" data-p="1" data-r="7" data-route="1"/><text class="n" x="1278" y="282.5" data-p="1" data-r="7" data-route="1">7</text><text class="lb" x="1121" y="267" text-anchor="middle" data-p="1" data-r="7" data-route="1">text only, no function call</text><line class="ar" x1="24" y1="1036.0" x2="58" y2="1036.0" marker-end="url(#tools-map-a)"/><text class="sb" x="68" y="1040">sends a message, call or result</text><line class="ar blue" x1="287.9417" y1="1036.0" x2="321.9417" y2="1036.0" marker-end="url(#tools-map-b)"/><text class="sb" x="332" y="1040">a model asks for a tool call</text><line class="ar red" x1="526.0160000000001" y1="1036.0" x2="560.0160000000001" y2="1036.0" marker-end="url(#tools-map-r)"/><text class="sb" x="570" y="1040">the runner runs the tool</text></svg>