 x1="228" y1="132" x2="228" y2="1250"/><line class="life" x1="415" y1="132" x2="415" y2="1250"/><line class="life" x1="619" y1="132" x2="619" y2="1250"/><rect class="bx" x="24" y="78" width="118" height="54" rx="8"/><text class="nm" x="83" y="101" text-anchor="middle">Browser</text><text class="sb" x="83" y="120" text-anchor="middle">holds the chat</text><rect class="bx red" x="164" y="78" width="128" height="54" rx="8"/><text class="nm" x="228" y="101" text-anchor="middle">Assembler</text><text class="sb red" x="228" y="120" text-anchor="middle">builds every call</text><rect class="bx blue" x="314" y="78" width="203" height="54" rx="8"/><text class="nm" x="415" y="101" text-anchor="middle">Model</text><text class="sb blue" x="415" y="120" text-anchor="middle">keeps nothing between calls</text><rect class="bx" x="539" y="78" width="160" height="54" rx="8"/><text class="nm" x="619" y="101" text-anchor="middle">Bill tools</text><text class="sb" x="619" y="120" text-anchor="middle">read fresh every time</text><rect class="bx" x="40" y="938" width="87" height="28" rx="6"/><text class="nm" x="83" y="958" text-anchor="middle">Browser</text><rect class="bx red" x="176" y="938" width="104" height="28" rx="6"/><text class="nm" x="228" y="958" text-anchor="middle">Assembler</text><rect class="bx blue" x="380" y="938" width="71" height="28" rx="6"/><text class="nm" x="415" y="958" text-anchor="middle">Model</text><rect class="bx" x="575" y="938" width="87" height="28" rx="6"/><text class="nm" x="619" y="958" text-anchor="middle">Bill tools</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip" x="49" y="184" width="223" height="35" rx="6"/><text class="lb" x="160" y="206" text-anchor="middle">3 messages, never more than 40</text><line class="ar" x1="97" y1="225" x2="224" y2="225" marker-end="url(#context-seq-a)"/><circle class="bd solid" cx="83" cy="225" r="10"/><text class="n" x="83" y="229.5">1</text><rect class="chip green" x="176" y="235" width="103" height="24" 