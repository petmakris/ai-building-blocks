id(b_19)</text><line class="ar" x1="230" y1="1082" x2="615" y2="1082" marker-end="url(#context-seq-a)"/></g><g data-step="s12" data-p="1" data-r="7"><rect class="chip blue" x="288" y="1102" width="66" height="35" rx="6"/><text class="lb" x="321" y="1124" text-anchor="middle">3rd call</text><line class="ar blue" x1="230" y1="1143" x2="411" y2="1143" marker-end="url(#context-seq-b)"/></g><g data-step="s13" data-p="1" data-r="7"><text class="lb green" x="323" y="1191" text-anchor="middle">"Done" · no tool calls</text><line class="ar green dash" x1="413" y1="1171" x2="232" y2="1171" marker-end="url(#context-seq-g)"/><rect class="chip green" x="178" y="1208" width="99" height="24" rx="12"/><text class="sb green" x="228" y="1224" text-anchor="middle">✓ 6-call cap</text></g><rect class="bx green" x="24" y="1256" width="1068" height="68" rx="8" data-p="1" data-r="7"/><text class="nm green" x="42" y="1284" data-p="1" data-r="7">Done: 3 model calls across 2 requests</text><text class="sb" x="42" y="1308" data-p="1" data-r="7">Each call carried only what the step needed. The server kept nothing between the two requests; the ticket carried layer 5.</text></svg>