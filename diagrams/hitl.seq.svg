<svg class="vz" viewBox="0 0 814 1298" role="img" aria-label="The bill changes only after the click, and only the stored call runs" data-vz="sequence"><defs><marker id="hitl-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="hitl-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="hitl-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="hitl-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="hitl-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="hitl-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The bill changes only after the click, and only the stored call runs</text><text class="sub" x="24" y="62">Example: the person says "I paid the electricity bill by card". The values are made up; the design is the usual one.</text><rect class="band" x="12" y="144" width="790" height="554" rx="10" data-p="1" data-r="1"/><text class="zl" x="24" y="166" data-p="1" data-r="1">REQUEST 1 · THE PERSON'S MESSAGE</text><rect class="band" x="12" y="704" width="790" height="492" rx="10" data-p="1" data-r="5"/><text class="zl" x="24" y="726" data-p="1" data-r="5">REQUEST 2 · THE CLICK</text><line class="life" x1="110" y1="132" x2="110" y2="1200"/><line class="life" x1="304" y1="132" x2="304" y2="1200"/><line class="life" x1="498" y1="132" x2="498" y2="1200"/><line class="life" x1="698" y1="132" x2="698" y2="1200"/><rect class="bx" x="24" y="78" width="173" height="54" rx="8"/><text class="nm" x="110" y="101" text-anchor="middle">Person</text><text class="sb" x="110" y="120" text-anchor="middle">reads the card, decides</text><rect class="bx red" x="219" y="78" width="171" height="54" rx="8"/><text class="nm" x="304" y="101" text-anchor="middle">Backend</text><text class="sb red" x="304" y="120" text-anchor="middle">Billpod's code, decides</text><rect class="bx blue" x="412" y="78" width="172" height="54" rx="8"/><text class="nm" x="498" y="101" text-anchor="middle">Model</text><text class="sb blue" x="498" y="120" text-anchor="middle">Gemini Flash, only asks</text><rect class="bx green" x="606" y="78" width="184" height="54" rx="8"/><text class="nm" x="698" y="101" text-anchor="middle">Bills</text><text class="sb green" x="698" y="120" text-anchor="middle">stored bills, with versions</text><rect class="bx" x="72" y="744" width="77" height="28" rx="6"/><text class="nm" x="110" y="764" text-anchor="middle">Person</text><rect class="bx red" x="260" y="744" width="89" height="28" rx="6"/><text class="nm" x="304" y="764" text-anchor="middle">Backend</text><rect class="bx blue" x="462" y="744" width="71" height="28" rx="6"/><text class="nm" x="498" y="764" text-anchor="middle">Model</text><rect class="bx green" x="670" y="744" width="55" height="28" rx="6"/><text class="nm" x="698" y="764" text-anchor="middle">Bills</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip blue" x="347" y="184" width="98" height="35" rx="6"/><text class="lb mono" x="396" y="206" text-anchor="middle">find_bills</text><line class="ar blue" x1="484" y1="225" x2="308" y2="225" marker-end="url(#hitl-seq-b)"/><circle class="bd solid" cx="498" cy="225" r="10"/><text class="n" x="498" y="229.5">1</text></g><g data-step="s2" data-p="1" data-r="1"><text class="lb green" x="502" y="273" text-anchor="middle">b17 · CHF 84.20 · version 3</text><line class="ar green dash" x1="696" y1="253" x2="308" y2="253" marker-end="url(#hitl-seq-g)"/></g><g data-step="s3" data-p="1" data-r="2"><rect class="chip blue" x="257" y="300" width="277" height="35" rx="6"/><text class="lb mono" x="396" y="322" text-anchor="middle">mark_paid b17 · v3 · card · id c2</text><line class="ar blue" x1="484" y1="341" x2="308" y2="341" marker-end="url(#hitl-seq-b)"/><circle class="bd solid" cx="498" cy="341" r="10"/><text class="n" x="498" y="345.5">2</text></g><g data-step="s4" data-p="1" data-r="2"><path class="ar red" d="M304,369 H316 V407 H308" marker-end="url(#hitl-seq-r)"/><rect class="chip red" x="320" y="361" width="134" height="54" rx="6"/><text class="sb" x="330" y="383">on the confirm list:</text><text class="sb" x="330" y="402">do not run</text></g><g data-step="s5" data-p="1" data-r="3"><rect class="chip" x="415" y="431" width="182" height="35" rx="6"/><text class="lb" x="506" y="453" text-anchor="middle">exists? version 3? unpaid?</text><line class="ar" x1="318" y1="472" x2="694" y2="472" marker-end="url(#hitl-seq-a)"/><circle class="bd solid" cx="304" cy="472" r="10"/><text class="n" x="304" y="476.5">3</text><rect class="chip green" x="527" y="482" width="73" height="24" rx="12"/><text class="sb green" x="564" y="498" text-anchor="middle">✓ exists</text><rect class="chip green" x="608" y="482" width="94" height="24" rx="12"/><text class="sb green" x="656" y="498" text-anchor="middle">✓ version 3</text><rect class="chip green" x="711" y="482" width="79" height="24" rx="12"/><text class="sb green" x="750" y="498" text-anchor="middle">✓ unpaid</text></g><g data-step="s6" data-p="1" data-r="3"><text class="lb green" x="502" y="552" text-anchor="middle">yes · yes · yes</text><line class="ar green dash" x1="696" y1="532" x2="308" y2="532" marker-end="url(#hitl-seq-g)"/></g><g data-step="s7" data-p="1" data-r="4"><rect class="chip red" x="60" y="579" width="285" height="54" rx="6"/><text class="lb" x="202" y="601" t