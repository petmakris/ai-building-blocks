<svg class="ov-svg" viewBox="0 0 1120 900" role="img" aria-label="On every model call Billpod's server builds the request again from five layers: the system prompt with today's date, timezone and currency, 46 tool definitions, the newest chat history that fits 24,000 characters, the new message, and this answer's tool calls and results. The model reads only that request; the tool loop runs a tool, appends its result and calls the model again, at most 6 times, and a write that needs a yes seals layer 5 into a ticket the browser carries. Older messages, earlier tool results and the household's other bills are left out on purpose, because a 2025 test found 18 of 18 models answered better from about 300 relevant tokens than from about 113,000.">
<defs>
<marker id="context-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="context-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="context-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
<marker id="context-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker>
</defs>
<text class="ttl" x="24" y="38">The server builds every model call from scratch and sends only what the job needs</text>

<text class="zl" x="24" y="94">WHERE EACH PART COMES FROM</text>
<text class="zl" x="318" y="94">ONE MODEL REQUEST</text>
<text class="zl" x="816" y="94">THE MODEL AND THE LOOP</text>

<!-- sources -->
<rect class="bx" x="24" y="176" width="214" height="86" rx="8"/>
<text class="nm" x="42" y="204">Household record</text>
<text class="sb" x="42" y="226">today, in its own timezone</text>
<text class="sb" x="42" y="248">currency, household name</text>

<rect class="bx" x="24" y="284" width="214" height="92" rx="8"/>
<text class="nm" x="42" y="312">Billpod's code</text>
<text class="sb" x="42" y="334">the prompt's fixed rules</text>
<text class="sb" x="42" y="356">46 tool definitions</text>

<rect class="bx" x="24" y="398" width="214" height="140" rx="8"/>
<text class="nm" x="42" y="426">The browser</text>
<text class="sb" x="42" y="450">holds the chat</text>
<text class="sb" x="42" y="472">resends it every message</text>
<text class="sb" x="42" y="494">the newest 40, at most</text>
<text class="sb" x="42" y="516">the server stores none</text>

<rect class="bx amber" x="24" y="568" width="214" height="108" rx="8"/>
<text class="nm" x="42" y="596">Approval ticket</text>
<text class="sb" x="42" y="618">made at a confirmation card</text>
<text class="sb amber" x="42" y="640">layer 5, sealed, 10 minutes</text>
<text class="sb" x="42" y="662">comes back with the yes</text>

<!-- the request -->
<rect class="zone red" x="318" y="112" width="394" height="560" rx="10"/>
<text class="zn red" x="338" y="138"><tspan class="mono">runTurn</tspan> builds all five layers again for every call</text>

<text class="sb" x="338" y="166"><tspan class="mono">systemPrompt</tspan> field</text>
<rect class="bx" x="338" y="176" width="354" height="86" rx="8"/>
<text class="nm" x="356" y="204">1 · System prompt</text>
<text class="sb" x="356" y="226">fixed rules + today's date, timezone, currency</text>
<text class="sb" x="356" y="248">changes once a day</text>

<text class="sb" x="338" y="290"><tspan class="mono">tools</tspan> field</text>
<rect class="bx" x="338" y="298" width="354" height="64" rx="8"/>
<text class="nm" x="356" y="324">2 · 46 tool definitions</text>
<text class="sb" x="356" y="346">all sent on every call · change per release</text>

<text class="sb" x="338" y="390"><tspan class="mono">messages</tspan> field</text>
<rect class="bx" x="338" y="398" width="354" height="86" rx="8"/>
<text class="nm" x="356" y="426">3 · History</text>
<text class="sb" x="356" y="448">the newest whole messages within 24,000 chars</text>
<text class="sb" x="356" y="470">starts on a person's message</text>

<rect class="bx" x="338" y="494" width="354" height="64" rx="8"/>
<text class="nm" x="356" y="520">4 · The new message</text>
<text class="sb" x="356" y="542">the person's question, always kept</text>

<rect class="bx" x="338" y="568" width="354" height="86" rx="8"/>
<text class="nm" x="356" y="596">5 · Tool calls and results so far</text>
<text class="sb" x="356" y="618">this answer only: one more per model step</text>
<text class="sb" x="356" y="640">restored from the ticket after a yes</text>

<!-- the model and the loop -->
<rect class="bx blue" x="816" y="176" width="280" height="86" rx="8"/>
<text class="nm" x="834" y="204">Gemini Flash</text>
<text class="sb blue" x="834" y="226">reads only this request</text>
<text class="sb" x="834" y="248">keeps nothing between calls</text>

<rect class="bx red" x="816" y="298" width="280" height="130" rx="8"/>
<text class="nm" x="834" y="326">The tool loop</text>
<text class="sb green" x="834" y="348">no tool calls in the reply: done</text>
<text class="sb" x="834" y="370">a read: run it, then call again</text>
<text class="sb amber" x="834" y="392">a write: a card for the person's yes</text>
<text class="sb" x="834" y="414">at most 6 model calls per answer</text>

<rect class="bx" x="816" y="568" width="280" height="86" rx="8"/>
<text class="nm" x="834" y="596">Bill tools</text>
<text class="sb" x="834" y="618"><tspan class="mono">find_bills</tspan>, <tspan class="mono">mark_paid</tspan> and 44 more</text>
<text class="sb" x="834" y="640">bills change, so always read fresh</text>

<!-- left out on purpose -->
<text class="zl" x="24" y="712">LEFT OUT ON PURPOSE</text>
<text class="zl" x="800" y="712">WHY LESS</text>

<rect class="bx" x="24" y="726" width="220" height="114" rx="8"/>
<text class="nm" x="42" y="754">Older messages</text>
<text class="sb" x="42" y="776">past 24,000 chars: dropped</text>
<text class="sb" x="42" y="798">whole, never cut in half</text>
<text class="sb amber" x="42" y="820">no error says what is gone</text>

<rect class="bx" x="260" y="726" width="272" height="114" rx="8"/>
<text class="nm" x="278" y="754">Old tool results</text>
<text class="sb" x="278" y="776">kept only as a note, example:</text>
<text class="sb mono" x="278" y="798">mark_paid (electricity): done</text>
<text class="sb" x="278" y="820">the model reads the data again</text>

<rect class="bx" x="548" y="726" width="220" height="114" rx="8"/>
<text class="nm" x="566" y="754">The household's bills</text>
<text class="sb" x="566" y="776">none sent up front</text>
<text class="sb" x="566" y="798">fetched only when asked for</text>
<text class="sb amber" x="566" y="820">an old look-alike misleads</text>

<rect class="bx" x="800" y="726" width="296" height="114" rx="8"/>
<text class="nm" x="818" y="754">Chroma test, July 2025</text>
<text class="sb" x="818" y="776">18 of 18 models, same questions</text>
<text class="sb green" x="818" y="798">~300 relevant tokens: more correct</text>
<text class="sb red" x="818" y="820">all ~113,000 tokens: fewer correct</text>

<!-- legend -->
<line class="ar" x1="24" y1="874" x2="60" y2="874" marker-end="url(#context-a)"/>
<text class="sb" x="70" y="878">feeds a layer</text>
<line class="ar blue" x1="220" y1="874" x2="256" y2="874" marker-end="url(#context-b)"/>
<text class="sb" x="266" y="878">a model call and its reply</text>
<line class="ar red" x1="470" y1="874" x2="506" y2="874" marker-end="url(#context-r)"/>
<text class="sb" x="516" y="878">the loop runs a tool</text>
<line class="ar amber dash" x1="690" y1="874" x2="726" y2="874" marker-end="url(#context-m)"/>
<text class="sb" x="736" y="878">sealed, carried by the browser</text>

<!-- arrows: sources into layers -->
<line class="ar" x1="238" y1="219" x2="334" y2="219" marker-end="url(#context-a)"/>
<path class="ar" d="M238,300 H280 V244 H334" marker-end="url(#context-a)"/>
<line class="ar" x1="238" y1="330" x2="334" y2="330" marker-end="url(#context-a)"/>
<line class="ar" x1="238" y1="441" x2="334" y2="441" marker-end="url(#context-a)"/>
<line class="ar" x1="238" y1="520" x2="334" y2="520" marker-end="url(#context-a)"/>

<!-- arrows: the call and the loop -->
<line class="ar blue" x1="712" y1="219" x2="812" y2="219" marker-end="url(#context-b)"/>
<text class="lb blue" x="762" y="209" text-anchor="middle">one call</text>
<line class="ar blue" x1="956" y1="262" x2="956" y2="294" marker-end="url(#context-b)"/>
<text class="lb" x="966" y="283">its reply</text>
<line class="ar red" x1="956" y1="428" x2="956" y2="564" marker-end="url(#context-r)"/>
<text class="lb" x="966" y="500">runs the tool</text>
<line class="ar" x1="816" y1="611" x2="696" y2="611" marker-end="url(#context-a)"/>
<text class="lb" x="766" y="601" text-anchor="middle">result added</text>
<line class="ar amber dash" x1="338" y1="622" x2="242" y2="622" marker-end="url(#context-m)"/>
<text class="lb amber" x="290" y="612" text-anchor="middle">sealed</text>
</svg>
