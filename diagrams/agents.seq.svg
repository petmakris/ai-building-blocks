<svg class="vz" viewBox="0 0 879 1449" role="img" aria-label="The model picks every step, and the loop checks, pauses and stops it" data-vz="sequence"><defs><marker id="agents-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="agents-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="agents-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="agents-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="agents-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="agents-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The model picks every step, and the loop checks, pauses and stops it</text><text class="sub" x="24" y="62">Example: "Mark the electricity bill paid and tell me what is still due." The bill id, version and amount are made up; the rules are Billpod's.</text><rect class="band" x="12" y="144" width="855" height="775" rx="10" data-p="1" data-r="1"/><text class="zl" x="24" y="166" data-p="1" data-r="1">REQUEST 1</text><rect class="band" x="12" y="925" width="855" height="422" rx="10" data-p="1" data-r="5"/><text class="zl" x="24" y="947" data-p="1" data-r="5">REQUEST 2 · AFTER APPROVE</text><line class="life" x1="83" y1="132" x2="83" y2="1351"/><line class="life" x1="246" y1="132" x2="246" y2="1351"/><line class="life" x1="427" y1="132" x2="427" y2="1351"/><line class="life" x1="585" y1="132" x2="585" y2="1351"/><rect class="bx" x="24" y="78" width="118" height="54" rx="8"/><text class="nm" x="83" y="101" text-anchor="middle">Person</text><text class="sb" x="83" y="120" text-anchor="middle">pays the bills</text><rect class="bx green" x="164" y="78" width="163" height="54" rx="8"/><text class="nm" x="246" y="101" text-anchor="middle">Loop</text><text class="sb green" x="246" y="120" text-anchor="middle">your code, cap 6 calls</text><rect class="bx blue" x="349" y="78" width="155" height="54" rx="8"/><text class="nm" x="427" y="101" text-anchor="middle">Model</text><text class="sb blue" x="427" y="120" text-anchor="middle">Gemini, runs nothing</text><rect class="bx" x="526" y="78" width="118" height="54" rx="8"/><text class="nm" x="585" y="101" text-anchor="middle">Tools</text><text class="sb" x="585" y="120" text-anchor="middle">46 declared</text><rect class="bx" x="45" y="965" width="77" height="28" rx="6"/><text class="nm" x="83" y="985" text-anchor="middle">Person</text><rect class="bx green" x="215" y="965" width="61" height="28" rx="6"/><text class="nm" x="246" y="985" text-anchor="middle">Loop</text><rect class="bx blue" x="392" y="965" width="71" height="28" rx="6"/><text class="nm" x="427" y="985" text-anchor="middle">Model</text><rect class="bx" x="553" y="965" width="66" height="28" rx="6"/><text class="nm" x="585" y="985" text-anchor="middle">Tools</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip" x="63" y="184" width="213" height="35" rx="6"/><text class="lb" x="169" y="206" text-anchor="middle">"Mark the electricity bill paid…"</text><line class="ar" x1="97" y1="225" x2="242" y2="225" marker-end="url(#agents-seq-a)"/><circle class="bd solid" cx="83" cy="225" r="10"/><text class="n" x="83" y="229.5">1</text></g><g data-step="s2" data-p="1" data-r="1"><path class="ar green" d="M246,253 H258 V272 H250" marker-end="url(#agents-seq-g)"/><rect class="chip green" x="262" y="245" width="119" height="35" rx="6"/><text class="sb" x="272" y="267">model call 1 of 6</text></g><g data-step="s3" data-p="1" data-r="1"><rect class="chip blue" x="210" y="296" width="251" height="35" rx="6"/><text class="lb" x="335" y="318" text-anchor="middle">system prompt, conversation, tool list</text><line class="ar blue" x1="248" y1="337" x2="423" y2="337" marker-end="url(#agents-seq-b)"/></g><g data-step="s4" data-p="1" data-r="1"><text class="lb blue" x="337" y="385" text-anchor="middle">tool call</text><text class="lb mono blue" x="337" y="404" text-anchor="middle">find_bills "electricity"</text><line class="ar blue dash" x1="425" y1="365" x2="250" y2="365" marker-end="url(#agents-seq-b)"/></g><g data-step="s5" data-p="1" data-r="2"><rect class="chip" x="349" y="431" width="143" height="54" rx="6"/><text class="lb" x="421" y="453" text-anchor="middle">a read: runs at once</text><text class="lb mono" x="421" y="472" text-anchor="middle">find_bills</text><line class="ar" x1="260" y1="491" x2="581" y2="491" marker-end="url(#agents-seq-a)"/><circle class="bd solid" cx="246" cy="491" r="10"/><text class="n" x="246" y="495.5">2</text></g><g data-step="s6" data-p="1" data-r="2"><text class="lb green" x="417" y="539" text-anchor="middle">bill b42 · version 3</text><line class="ar green dash" x1="583" y1="519" x2="250" y2="519" marker-end="url(#agents-seq-g)"/></g><g data-step="s7" data-p="1" data-r="2"><rect class="chip blue" x="231" y="566" width="210" height="35" rx="6"/><text class="lb" x="335" y="588" text-anchor="middle">call 2: whole transcript + result</text><line class="ar blue" x1="248" y1="607" x2="423" y2="607" marker-end="url(#agents-seq-b)"/></g><g data-step="s8" data-p="1" data-r="3"><text class="lb blue" x="331" y="663" text-anchor="middle">tool call</text><text class="lb mono blue" x="331" y="682" text-anchor="middle">mark_paid b42 · version 3</text><line class="ar blue dash" x1="413" y1="635" x2="250" y2="635" marker-end="url(#agents-seq-b)"/><circle class="bd solid" cx="427" cy="635" r="10"/><text class="n" x="427" y="639.5">3</text></g><g data-step="s9" data-p="1" data-r="3"><path class="ar green" d="M246,717 H258 V755 H250" marker-end="url(#agents-seq-g)"/><rect class="chip green" x="262" y="709" width="220" height="54" rx="6"/><text class="sb" x="272" y="731">a proposal, checked first:</text><text class="sb" x="272" y="750">allow-listed, bill exists, version 3</text></g><g data-step="s10" data-p="1" data-r="4"><text class="lb red" x="159" y="815" text-anchor="middle">confirmation card</text><line class="ar red dash" x1="232" y1="787" x2="87" y2="787" marker-end="url(#agents-seq-r)"/><circle class="bd solid" cx="246" cy="787" r="10"/><text class="n" x="246" y="791.5">4</text></g><g data-step="s11" data-p="1" data-r="4"><path class="ar red" d="M246,850 H258 V907 H250" marker-end="url(#agents-seq-r)"/><rect class="chip red" x="262" y="842" width="149" height="73" rx="6"/><text class="sb" x="272" y="864">encrypt state into a</text><text class="sb" x="272" y="883">10-min resume token</text><text class="sb mono" x="272" y="902">AES-256-GCM</text></g><g data-step="s12" data-p="1" data-r="5"><rect class="chip green" x="56" y="1007" width="226" height="35" rx="6"/><text class="lb" x="169" y="1029" text-anchor="middle">Approve + token, second request</text><line class="ar green" x1="97" y1="1048" x2="242" y2="1048" marker-end="url(#agents-seq-g)"/><circle class="bd solid" cx="83" cy="1048" r="10"/><text class="n" x="83" y="1052.5">5</text><rect class="chip green" x="176" y="1058" width="140" height="24" rx="12"/><text class="sb green" x="246" y="1074" text-anchor="middle">✓ token used once</text></g><g data-step="s13" data-p="1" data-r="5"><rect class="chip red" x="335" y="1100" width="159" height="54" rx="6"/><text class="lb" x="415" y="1122" text-anchor="middle">sealed arguments only</text><text class="lb mono" x="415" y="1141" text-anchor="middle">mark_paid</text><line class="ar red" x1="248" y1="1160" x2="581" y2="1160" marker-end="url(#agents-seq-r)"/></g><g data-step="s14" data-p="1" data-r="6"><rect class="chip blue" x="271" y="1180" width="140" height="35" rx="6"/><text class="lb" x="341" y="1202" text-anchor="middle">model calls 3 and 4</text><line class="ar blue" x1="260" y1="1221" x2="423" y2="1221" marker-end="url(#agents-seq-b)"/><circle class="bd solid" cx="246" cy="1221" r="10"/><text class="n" x="246" y="1225.5">6</text></g><g data-step="s15" data-p="1" data-r="6"><text class="lb green" x="337" y="1269" text-anchor="middle">plain text, no tool call</text><line class="ar green dash" x1="425" y1="1249" x2="250" y2="1249" marker-end="url(#agents-seq-g)"/></g><g data-step="s16" data-p="1" data-r="6"><text class="lb green" x="165" y="1324" text-anchor="middle">"Done. Still due: water, 48.20"</text><line class="ar green dash" x1="244" y1="1304" x2="87" y2="1304" marker-end="url(#agents-seq-g)"/></g><rect class="bx green" x="24" y="1357" width="831" height="68" rx="8" data-p="1" data-r="6"/><text class="nm green" x="42" y="1385" data-p="1" data-r="6">Done in 4 of the 6 model calls, across two HTTP requests</text><text class="sb" x="42" y="1409" data-p="1" data-r="6">No code wrote "search, then mark paid, then list". Nothing changed until the person said yes.</text></svg>