<svg class="vz" viewBox="0 0 1165 736" role="img" aria-label="Tunatutor keeps its main prompt in two copies: a constant in code and a database row that a seed script and an admin screen can write. At every startup a heal compares the row with the code copy and resets it unless a person edited it, then each process caches the text, renders it on every turn and sends it to the model. Golden tests read only the code copy, so they stayed green in July 2026 while the model read an old row without rules 14 and 15." data-vz="map"><defs><marker id="prompts-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="prompts-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="prompts-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="prompts-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="prompts-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="prompts-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Two copies of one prompt: a startup heal decides which one the model reads</text><text class="zl" x="38" y="70">WHERE THE TEXT LIVES</text><text class="zl" x="307" y="70">THE DATABASE</text><text class="zl" x="585" y="70">AT EVERY STARTUP</text><text class="zl" x="908" y="70">ON EVERY TURN</text><rect class="bx" x="38" y="88" width="213" height="90" rx="8" data-p="1" data-b="1"/><text class="nm mono" x="56" y="118" data-p="1" data-b="1">04-app-settings.sql</text><text class="sb red" x="56" y="140" data-p="1" data-b="1">July: wrote an old copy</text><text class="sb green" x="56" y="162" data-p="1" data-b="1">now: a drift test forbids it</text><rect class="bx" x="38" y="244" width="213" height="90" rx="8" data-p="1" data-b="1"/><text class="nm" x="56" y="274" data-p="1" data-b="1">Admin screen</text><text class="sb" x="56" y="296" data-p="1" data-b="1">a linguist edits, no deploy</text><text class="sb" x="56" y="318" data-p="1" data-b="1">a save archives the old text</text><rect class="bx green" x="38" y="400" width="213" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="430" data-p="1" data-b="1" data-r="1">Code copy in git</text><text class="sb mono" x="56" y="452" data-p="1" data-b="1" data-r="1">DEFAULT_LAYER1_TEMPLATE</text><text class="sb" x="56" y="474" data-p="1" data-b="1" data-r="1">15 numbered rules</text><text class="sb" x="56" y="496" data-p="1" data-b="1" data-r="1">8 slots filled by code</text><rect class="bx red" x="307" y="88" width="221" height="112" rx="8" data-p="1" data-b="2" data-r="2"/><text class="nm mono" x="325" y="118" data-p="1" data-b="2" data-r="2">prompt_templates</text><text class="sb mono" x="325" y="140" data-p="1" data-b="2" data-r="2">ai-tutor-layer1</text><text class="sb red" x="325" y="162" data-p="1" data-b="2" data-r="2">July: rules 14 and 15 missing</text><text class="sb green" x="325" y="184" data-p="1" data-b="2" data-r="5">now: the code copy, healed</text><rect class="bx" x="307" y="244" width="221" height="112" rx="8" data-p="1" data-b="2" data-r="4"/><text class="nm" x="325" y="274" data-p="1" data-b="2" data-r="4">Archive</text><text class="sb mono" x="325" y="296" data-p="1" data-b="2" data-r="4">prompt_template_versions</text><text class="sb" x="325" y="318" data-p="1" data-b="2" data-r="4">0 rows: no person edited it</text><text class="sb green" x="325" y="340" data-p="1" data-b="2" data-r="4">Activate: an old text is back</text><rect class="bx red" x="585" y="88" width="267" height="268" rx="8" data-p="1" data-b="3" data-r="1"/><text class="nm" x="603" y="118" data-p="1" data-b="3" data-r="1">Startup heal</text><text class="sb" x="603" y="140" data-p="1" data-b="3" data-r="1">row = code copy: nothing to do</text><text class="sb" x="603" y="162" data-p="1" data-b="3" data-r="3">here: the cached row ≠ the code copy</text><text class="sb green" x="603" y="194" data-p="1" data-b="3" data-r="4">0 archive rows: code copy wins,</text><text class="sb green" x="603" y="216" data-p="1" data-b="3" data-r="4">reset the row and the cache</text><text class="sb amber" x="603" y="248" data-p="1" data-b="3" data-r="4">1+ archive rows: keep the edit,</text><text class="sb amber" x="603" y="270" data-p="1" data-b="3" data-r="4">which then misses code fixes</text><text class="sb" x="603" y="302" data-p="1" data-b="3" data-r="5">the reset writes no archive row,</text><text class="sb" x="603" y="324" data-p="1" data-b="3" data-r="5">or later heals would stop</text><rect class="bx" x="585" y="400" width="267" height="90" rx="8" data-p="1" data-b="4" data-r="2"/><text class="nm" x="603" y="430" data-p="1" data-b="4" data-r="2">Cache, per process</text><text class="sb" x="603" y="452" data-p="1" data-b="4" data-r="6">a session reads it once</text><text class="sb" x="603" y="474" data-p="1" data-b="4" data-r="2">the table is not read per turn</text><rect class="bx" x="908" y="88" width="220" height="112" rx="8" data-p="1" data-b="4" data-r="7"/><text class="nm" x="926" y="118" data-p="1" data-b="4" data-r="7">Stamp the result</text><text class="sb" x="926" y="140" data-p="1" data-b="4" data-r="7">lesson note: prompt "v1"</text><text class="sb" x="926" y="162" data-p="1" data-b="4" data-r="7">model id in its own column</text><text class="sb amber" x="926" y="184" data-p="1" data-b="4" data-r="7">tutor replies: no stamp yet</text><rect class="bx blue" x="908" y="244" width="220" height="112" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="926" y="274" data-p="1" data-b="4" data-r="6">Model</text><text class="sb mono" x="926" y="296" data-p="1" data-b="4" data-r="6">gemini-2.5-flash</text><text class="sb red" x="926" y="318" data-p="1" data-b="4" data-r="6">July: fluent, 2 rules missing</text><text class="sb green" x="926" y="340" data-p="1" data-b="4" data-r="6">now: all 15 rules, a fluent reply</text><rect class="bx" x="908" y="400" width="220" height="112" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="926" y="430" data-p="1" data-b="4" data-r="6">Render the prompt</text><text class="sb" x="926" y="452" data-p="1" data-b="4" data-r="6">code fills the 8 slots</text><text class="sb" x="926" y="474" data-p="1" data-b="4" data-r="6">then adds layers built in code</text><text class="sb" x="926" y="496" data-p="1" data-b="4" data-r="6">sent again on every call</text><rect class="bx" x="38" y="556" width="491" height="112" rx="8" data-p="1" data-b="5"/><text class="nm" x="56" y="586" data-p="1" data-b="5">Golden tests</text><text class="sb" x="56" y="608" data-p="1" data-b="5">render with the code copy, compare byte for byte with a saved file</text><text class="sb red" x="56" y="630" data-p="1" data-b="5">they never read the row, so they stayed green all July</text><text class="sb" x="56" y="652" data-p="1" data-b="5">they pin the text, not how good the replies are</text><rect class="bx" x="585" y="556" width="543" height="112" rx="8" data-p="1" data-b="5"/><text class="nm" x="603" y="586" data-p="1" data-b="5">Eval</text><text class="sb" x="603" y="608" data-p="1" data-b="5">fixed inputs, every reply scored, old version against new</text><text class="sb amber" x="603" y="630" data-p="1" data-b="5">LOM-86 changed only the code behind <tspan class="mono">{{registerRule}}</tspan></text><text class="sb amber" x="603" y="652" data-p="1" data-b="5">replies changed at every level; nobody scored them</text><path class="ar red dash" d="M251,133 L303,133" marker-end="url(#prompts-map-r)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M251,289 L279,289 L279,144 L303,144" marker-end="url(#prompts-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M251,289 L303,289" marker-end="url(#prompts-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M529,144 L581,144" marker-end="url(#prompts-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M529,300 L581,300" marker-end="url(#prompts-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M251,456 L293,456 L293,222 L581,222" marker-end="url(#prompts-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M718,356 L718,396" marker-end="url(#prompts-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M852,445 L904,445" marker-end="url(#prompts-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M1018,400 L1018,360" marker-end="url(#prompts-map-b)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M1018,244 L1018,204" marker-end="url(#prompts-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M145,512 L145,552" marker-end="url(#prompts-map-a)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M251,456 L265,456 L265,222 L581,222" marker-end="url(#prompts-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar red dash" d="M529,130 L581,130" marker-end="url(#prompts-map-r)" data-p="1" data-r="2" data-route="1"/><path class="ar red dash" d="M678,356 L678,396" marker-end="url(#prompts-map-r)" data-p="1" data-r="2" data-route="1"/><path class="ar green" d="M529,300 L581,300" marker-end="url(#prompts-map-g)" data-p="1" data-r="4" data-route="1"/><path class="ar green" d="M585,158 L533,158" marker-end="url(#prompts-map-g)" data-p="1" data-r="5" data-route="1"/><path class="ar green" d="M758,356 L758,396" marker-end="url(#prompts-map-g)" data-p="1" data-r="5" data-route="1"/><path class="ar green" d="M852,445 L904,445" marker-end="url(#prompts-map-g)" data-p="1" data-r="6" data-route="1"/><path class="ar blue" d="M1018,400 L1018,360" marker-end="url(#prompts-map-b)" data-p="1" data-r="6" data-route="1"/><path class="ar" d="M1018,244 L1018,204" marker-end="url(#prompts-map-a)" data-p="1" data-r="7" data-route="1"/><text class="lb" x="281" y="355" text-anchor="end" data-p="1" data-b="3" data-base="1">registered at startup</text><text class="lb" x="157" y="537" data-p="1" data-b="5" data-base="1">uses only this copy</text><circle class="bd solid" cx="265" cy="435" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="265" y="439.5" data-p="1" data-r="1" data-route="1">1</text><text class="lb" x="253" y="355" text-anchor="end" data-p="1" data-r="1" data-route="1">register · 8 slots</text><circle class="bd dash" cx="550" cy="130" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="550" y="134.5" data-p="1" data-r="2" data-route="1">2</text><text class="lb" x="666" y="381" text-anchor="end" data-p="1" data-r="2" data-route="1">keep the row's text</text><circle class="bd solid" cx="550" cy="300" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="550" y="304.5" data-p="1" data-r="4" data-route="1">4</text><circle class="bd solid" cx="564" cy="158" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="564" y="162.5" data-p="1" data-r="5" data-route="1">5</text><text class="lb" x="770" y="381" data-p="1" data-r="5" data-route="1">reload</text><circle class="bd solid" cx="873" cy="445" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="873" y="449.5" data-p="1" data-r="6" data-route="1">6</text><text class="lb" x="1030" y="385" data-p="1" data-r="6" data-route="1">all 15 rules</text><circle class="bd solid" cx="1018" cy="224" r="11" data-p="1" data-r="7" data-route="1"/><text class="n" x="1018" y="228.5" data-p="1" data-r="7" data-route="1">7</text><line class="ar" x1="24" y1="700.0" x2="58" y2="700.0" marker-end="url(#prompts-map-a)"/><text class="sb" x="68" y="704">the text moves</text><line class="ar red dash" x1="188.93890000000002" y1="700.0" x2="222.93890000000002" y2="700.0" marker-end="url(#prompts-map-r)"/><text class="sb" x="233" y="704">how the old copy got in (July)</text><line class="ar green" x1="445.79560000000004" y1="700.0" x2="479.79560000000004" y2="700.0" marker-end="url(#prompts-map-g)"/><text class="sb" x="490" y="704">the text the heal chose</text><line class="ar blue" x1="659.6977" y1="700.0" x2="693.6977" y2="700.0" marker-end="url(#prompts-map-b)"/><text class="sb" x="704" y="704">sent to the model</text></svg>