<svg class="vz" viewBox="0 0 1174 840" role="img" aria-label="The model asks for mark_paid. Code checks a constant confirm list: reads and four adds run at once, while 31 tools are checked against the stored bill, saved as a proposal that expires in 10 minutes, and shown to the person as a card built from stored data. The click is a new request that sends only a reference; the server checks owner, expiry and single use, runs exactly the stored call with the version checked again, and gives the model the result under its own call id." data-vz="map"><defs><marker id="hitl-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="hitl-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="hitl-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="hitl-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="hitl-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="hitl-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">A risky write waits for a person's click, and only the stored call runs, once</text><text class="zl" x="38" y="70">THE MODEL</text><text class="zl" x="296" y="70">CODE: HOLD OR RUN</text><text class="zl" x="611" y="70">CODE: CARD AND PROPOSAL</text><text class="zl" x="902" y="70">THE PERSON</text><rect class="zone" x="282" y="88" width="579" height="410" rx="10" data-p="1" data-b="1" data-r="1"/><text class="zn" x="298" y="108" data-p="1" data-b="1" data-r="1">Request 1 · the person's message</text><rect class="zone" x="282" y="546" width="868" height="222" rx="10" data-p="1" data-b="4" data-r="5"/><text class="zn" x="298" y="566" data-p="1" data-b="4" data-r="5">Request 2 · the click</text><rect class="bx blue" x="38" y="120" width="186" height="636" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="150" data-p="1" data-b="1" data-r="1">The model</text><text class="sb" x="56" y="172" data-p="1" data-b="1" data-r="1">Gemini Flash in Billpod</text><text class="sb" x="56" y="194" data-p="1" data-b="1" data-r="1">runs no code, only asks</text><text class="sb" x="56" y="226" data-p="1" data-b="1" data-r="2">example call:</text><text class="sb blue" x="56" y="248" data-p="1" data-b="1" data-r="2"><tspan class="mono">mark_paid b17 v3</tspan></text><text class="sb blue" x="56" y="270" data-p="1" data-b="1" data-r="2"><tspan class="mono">card · id c2</tspan></text><text class="sb" x="56" y="302" data-p="1" data-b="2" data-r="1">reads and adds: results</text><text class="sb" x="56" y="324" data-p="1" data-b="2" data-r="1">in the same request</text><text class="sb" x="56" y="356" data-p="1" data-b="4" data-r="7">the click's request loads</text><text class="sb" x="56" y="378" data-p="1" data-b="4" data-r="7">the chat, adds the result</text><text class="sb" x="56" y="400" data-p="1" data-b="4" data-r="7">under c2, asks again</text><text class="sb blue" x="56" y="422" data-p="1" data-b="4" data-r="7">"Done: marked paid."</text><text class="sb" x="56" y="444" data-p="1" data-b="4" data-r="1">Cancel: a declined result</text><rect class="bx red" x="296" y="120" width="260" height="134" rx="8" data-p="1" data-b="1" data-r="2"/><text class="nm" x="314" y="150" data-p="1" data-b="1" data-r="2">Confirm list in code</text><text class="sb" x="314" y="172" data-p="1" data-b="1" data-r="2"><tspan class="mono">CONFIRM_TOOLS</tspan></text><text class="sb" x="314" y="194" data-p="1" data-b="1" data-r="2">31 of the 46 tools need a yes</text><text class="sb" x="314" y="216" data-p="1" data-b="1" data-r="2">a constant: no text the model</text><text class="sb" x="314" y="238" data-p="1" data-b="1" data-r="2">reads can change it</text><rect class="bx" x="611" y="120" width="235" height="134" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="629" y="150" data-p="1" data-b="3" data-r="3">Pre-check, then a card</text><text class="sb" x="629" y="172" data-p="1" data-b="3" data-r="3">bill exists? version 3? unpaid?</text><text class="sb amber" x="629" y="194" data-p="1" data-b="3" data-r="3">fails: error to model, no card</text><text class="sb" x="629" y="216" data-p="1" data-b="3" data-r="4">card: stored row + checked args</text><text class="sb" x="629" y="238" data-p="1" data-b="3" data-r="4">never the model's own words</text><rect class="bx green" x="296" y="298" width="260" height="188" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="314" y="328" data-p="1" data-b="2" data-r="1">Runs at once</text><text class="sb" x="314" y="350" data-p="1" data-b="2" data-r="1">11 reads, such as <tspan class="mono">find_bills</tspan></text><text class="sb" x="314" y="372" data-p="1" data-b="2" data-r="1">4 adds, such as <tspan class="mono">add_bill</tspan></text><text class="sb green" x="314" y="394" data-p="1" data-b="2" data-r="1"><tspan class="mono">add_bill</tspan> gets an Undo button</text><text class="sb amber" x="314" y="416" data-p="1" data-b="5" data-r="1">an injected add runs too:</text><text class="sb amber" x="314" y="438" data-p="1" data-b="5" data-r="1">Undo is its only defence</text><text class="sb" x="314" y="470" data-p="1" data-b="2" data-r="1">example: b17 · CHF 84.20 · version 3</text><rect class="bx red" x="611" y="298" width="235" height="156" rx="8" data-p="1" data-b="3" data-r="4"/><text class="nm" x="629" y="328" data-p="1" data-b="3" data-r="4">Proposal stored</text><text class="sb" x="629" y="350" data-p="1" data-b="3" data-r="4">row: call, args, version 3</text><text class="sb" x="629" y="372" data-p="1" data-b="3" data-r="4">expires in 10 minutes</text><text class="sb" x="629" y="394" data-p="1" data-b="3" data-r="4">Billpod: a sealed AES-256-GCM</text><text class="sb" x="629" y="416" data-p="1" data-b="3" data-r="4">token the browser carries</text><text class="sb red" x="629" y="438" data-p="1" data-b="3" data-r="4">the turn ends, nothing waits</text><rect class="bx green" x="296" y="578" width="260" height="178" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="314" y="608" data-p="1" data-b="4" data-r="6">Runs the stored call</text><text class="sb" x="314" y="630" data-p="1" data-b="4" data-r="6">exact args, under id c2</text><text class="sb" x="314" y="652" data-p="1" data-b="4" data-r="6"><tspan class="mono">WHERE version = 3</tspan></text><text class="sb green" x="314" y="674" data-p="1" data-b="4" data-r="6">1 row updated: paid</text><text class="sb amber" x="314" y="696" data-p="1" data-b="4" data-r="6">0 rows: refusal to the model</text><text class="sb" x="314" y="718" data-p="1" data-b="4" data-r="6">later writes of that step:</text><text class="sb" x="314" y="740" data-p="1" data-b="4" data-r="6"><tspan class="mono">NOT_RUN</tspan></text><rect class="bx green" x="611" y="578" width="235" height="156" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="629" y="608" data-p="1" data-b="4" data-r="5">Server checks the click</text><text class="sb" x="629" y="630" data-p="1" data-b="4" data-r="5">same user, same chat? else 400</text><text class="sb" x="629" y="652" data-p="1" data-b="4" data-r="5">under 10 minutes old? else 410</text><text class="sb" x="629" y="674" data-p="1" data-b="4" data-r="5">never answered? else 409</text><text class="sb" x="629" y="696" data-p="1" data-b="4" data-r="5">Cancel runs nothing and tells</text><text class="sb" x="629" y="718" data-p="1" data-b="4" data-r="5">the model it was declined</text><rect class="bx" x="902" y="120" width="234" height="366" rx="8" data-p="1" data-b="3" data-r="4"/><text class="nm" x="920" y="150" data-p="1" data-b="3" data-r="4">The person</text><text class="sb" x="920" y="172" data-p="1" data-b="3" data-r="4">reads the card, decides</text><text class="sb amber" x="920" y="204" data-p="1" data-b="5" data-r="4">93%: Claude Code users</text><text class="sb amber" x="920" y="226" data-p="1" data-b="5" data-r="4">approve almost every prompt</text><text class="sb" x="920" y="248" data-p="1" data-b="5" data-r="4">ask only where it matters</text><rect class="bx red" x="918" y="266" width="204" height="156" rx="6" data-p="1" data-b="3" data-r="4"/><text class="nm" x="936" y="296" data-p="1" data-b="3" data-r="4">example card</text><text class="sb" x="936" y="318" data-p="1" data-b="3" data-r="4">Mark this bill as paid?</text><text class="sb" x="936" y="340" data-p="1" data-b="3" data-r="4">City Power AG</text><text class="sb" x="936" y="362" data-p="1" data-b="3" data-r="4">CHF 84.20, by card</text><text class="sb" x="936" y="384" data-p="1" data-b="3" data-r="4">15 Oct 2026</text><text class="sb" x="936" y="406" data-p="1" data-b="3" data-r="4">Approve, Change, Cancel</text><rect class="bx" x="902" y="578" width="234" height="134" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="920" y="608" data-p="1" data-b="4" data-r="5">The click</text><text class="sb" x="920" y="630" data-p="1" data-b="4" data-r="5">sends only</text><text class="sb" x="920" y="652" data-p="1" data-b="4" data-r="5"><tspan class="mono">row id + approve</tspan></text><text class="sb" x="920" y="674" data-p="1" data-b="4" data-r="5">no arguments, so it cannot</text><text class="sb" x="920" y="696" data-p="1" data-b="4" data-r="5">swap in another call</text><path class="ar blue" d="M224,187 L292,187" marker-end="url(#hitl-map-b)" data-p="1" data-b="1" data-base="1"/><path class="ar green" d="M426,254 L426,294" marker-end="url(#hitl-map-g)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M296,392 L228,392" marker-end="url(#hitl-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar red" d="M555,187 L607,187" marker-end="url(#hitl-map-r)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M846,187 L898,187" marker-end="url(#hitl-map-r)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M729,254 L729,294" marker-end="url(#hitl-map-r)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M729,454 L729,574" marker-end="url(#hitl-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M902,645 L850,645" marker-end="url(#hitl-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M611,656 L559,656" marker-end="url(#hitl-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M296,667 L228,667" marker-end="url(#hitl-map-b)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M224,392 L292,392" marker-end="url(#hitl-map-b)" data-p="1" data-r="1" data-route="1"/><path class="ar blue" d="M224,187 L292,187" marker-end="url(#hitl-map-b)" data-p="1" data-r="2" data-route="1"/><path class="ar red" d="M555,187 L607,187" marker-end="url(#hitl-map-r)" data-p="1" data-r="3" data-route="1"/><path class="ar red" d="M846,187 L898,187" marker-end="url(#hitl-map-r)" data-p="1" data-r="4" data-route="1"/><path class="ar red" d="M729,254 L729,294" marker-end="url(#hitl-map-r)" data-p="1" data-r="4" data-route="1"/><path class="ar" d="M902,645 L850,645" marker-end="url(#hitl-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar red" d="M729,454 L729,574" marker-end="url(#hitl-map-r)" data-p="1" data-r="5" data-route="1"/><path class="ar green" d="M611,656 L559,656" marker-end="url(#hitl-map-g)" data-p="1" data-r="6" data-route="1"/><path class="ar blue" d="M296,667 L228,667" marker-end="url(#hitl-map-b)" data-p="1" data-r="7" data-route="1"/><text class="lb" x="438" y="279" data-p="1" data-b="2" data-base="1">not on list</text><text class="lb" x="263" y="381" text-anchor="middle" data-p="1" data-b="2" data-base="1">result</text><text class="lb" x="580" y="176" text-anchor="middle" data-p="1" data-b="3" data-base="1">on list</text><text class="lb" x="878" y="176" text-anchor="middle" data-p="1" data-b="3" data-base="1">card</text><text class="lb" x="741" y="279" data-p="1" data-b="3" data-base="1">saves</text><text class="lb" x="741" y="515" data-p="1" data-b="4" data-base="1">loads</text><text class="lb" x="870" y="634" text-anchor="middle" data-p="1" data-b="4" data-base="1">click</text><text class="lb" x="585" y="645" text-anchor="middle" data-p="1" data-b="4" data-base="1">passes</text><text class="lb" x="265" y="656" text-anchor="middle" data-p="1" data-b="4" data-base="1">c2</text><circle class="bd solid" cx="245" cy="392" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="245" y="396.5" data-p="1" data-r="1" data-route="1">1</text><line class="lk" x1="245" y1="392" x2="245" y2="503" data-p="1" data-r="1" data-route="1"/><text class="lb mono" x="277" y="516" text-anchor="middle" data-p="1" data-r="1" data-route="1">find_bills</text><circle class="bd solid" cx="245" cy="187" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="245" y="191.5" data-p="1" data-r="2" data-route="1">2</text><line class="lk" x1="245" y1="187" x2="245" y2="106" data-p="1" data-r="2" data-route="1"/><text class="lb mono" x="197" y="101" text-anchor="middle" data-p="1" data-r="2" data-route="1">mark_paid · id c2</text><circle class="bd solid" cx="576" cy="187" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="576" y="191.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="576" y1="187" x2="576" y2="268" data-p="1" data-r="3" data-route="1"/><text class="lb" x="576" y="281" text-anchor="middle" data-p="1" data-r="3" data-route="1">pre-check</text><circle class="bd solid" cx="867" cy="187" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="867" y="191.5" data-p="1" data-r="4" data-route="1">4</text><line class="lk" x1="867" y1="187" x2="869" y2="106" data-p="1" data-r="4" data-route="1"/><text class="lb" x="883" y="101" text-anchor="middle" data-p="1" data-r="4" data-route="1">card</text><text class="lb" x="741" y="279" data-p="1" data-r="4" data-route="1">saves</text><circle class="bd solid" cx="881" cy="645" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="881" y="649.5" data-p="1" data-r="5" data-route="1">5</text><line class="lk" x1="881" y1="645" x2="881" y2="726" data-p="1" data-r="5" data-route="1"/><text class="lb" x="913" y="739" text-anchor="middle" data-p="1" data-r="5" data-route="1">approve · row id</text><text class="lb" x="741" y="515" data-p="1" data-r="5" data-route="1">loads</text><circle class="bd solid" cx="590" cy="656" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="590" y="660.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="590" y1="656" x2="590" y2="535" data-p="1" data-r="6" data-route="1"/><text class="lb mono" x="590" y="530" text-anchor="middle" data-p="1" data-r="6" data-route="1">WHERE version = 3</text><circle class="bd solid" cx="275" cy="667" r="11" data-p="1" data-r="7" data-route="1"/><text class="n" x="275" y="671.5" data-p="1" data-r="7" data-route="1">7</text><line class="lk" x1="275" y1="667" x2="264" y2="768" data-p="1" data-r="7" data-route="1"/><text class="lb" x="227" y="781" text-anchor="middle" data-p="1" data-r="7" data-route="1">result for c2</text><line class="ar blue" x1="24" y1="804.0" x2="58" y2="804.0" marker-end="url(#hitl-map-b)"/><text class="sb" x="68" y="808">the model's call and its result</text><line class="ar red" x1="277.07370000000003" y1="804.0" x2="311.07370000000003" y2="804.0" marker-end="url(#hitl-map-r)"/><text class="sb" x="321" y="808">a held call on its way to a person</text><line class="ar green" x1="552.1148000000001" y1="804.0" x2="586.1148000000001" y2="804.0" marker-end="url(#hitl-map-g)"/><text class="sb" x="596" y="808">code runs it now</text><line class="ar" x1="728.4807000000001" y1="804.0" x2="762.4807000000001" y2="804.0" marker-end="url(#hitl-map-a)"/><text class="sb" x="772" y="808">the person's click</text></svg>