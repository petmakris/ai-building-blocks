<svg class="vz" viewBox="0 0 1030 1343" role="img" aria-label="User B reuses user A&#x27;s 6,000-token prefix at 0.1×, until a timestamp on top breaks every hit" data-vz="sequence"><defs><marker id="caching-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="caching-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="caching-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="caching-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="caching-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="caching-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">User B reuses user A's 6,000-token prefix at 0.1×, until a timestamp on top breaks every hit</text><text class="sub" x="24" y="62">Example: a made-up app scores videos against each user's goal, with the real rules of Anthropic's prompt caching.</text><rect class="band" x="12" y="233" width="1006" height="256" rx="10" data-p="1" data-r="2"/><text class="zl" x="24" y="255" data-p="1" data-r="2">USER A · THE FIRST CALL</text><rect class="band" x="12" y="495" width="1006" height="514" rx="10" data-p="1" data-r="3"/><text class="zl" x="24" y="517" data-p="1" data-r="3">USER B · WITHIN 5 MINUTES</text><rect class="band" x="12" y="1015" width="1006" height="226" rx="10" data-p="1" data-r="5"/><text class="zl" x="24" y="1037" data-p="1" data-r="5">LATER · A TIMESTAMP ON TOP</text><line class="life" x1="83" y1="132" x2="83" y2="1245"/><line class="life" x1="224" y1="132" x2="224" y2="1245"/><line class="life" x1="383" y1="132" x2="383" y2="810"/><line class="life" x1="383" y1="872" x2="383" y2="1245"/><rect class="bx" x="24" y="78" width="118" height="54" rx="8"/><text class="nm" x="83" y="101" text-anchor="middle">Service</text><text class="sb" x="83" y="120" text-anchor="middle">your app</text><rect class="bx blue" x="164" y="78" width="120" height="54" rx="8"/><text class="nm" x="224" y="101" text-anchor="middle">Provider</text><text class="sb blue" x="224" y="120" text-anchor="middle">runs the model</text><rect class="bx red" x="314" y="78" width="138" height="54" rx="8"/><text class="nm" x="383" y="101" text-anchor="middle">Prefix cache</text><text class="sb red" x="383" y="120" text-anchor="middle">5 min after last hit</text><rect class="bx green" x="306" y="818" width="154" height="54" rx="8"/><text class="nm" x="383" y="841" text-anchor="middle">Usage log</text><text class="sb green" x="383" y="860" text-anchor="middle">three counts per call</text><rect class="bx" x="43" y="535" width="81" height="28" rx="6"/><text class="nm" x="83" y="555" text-anchor="middle">Service</text><rect class="bx blue" x="180" y="535" width="88" height="28" rx="6"/><text class="nm" x="224" y="555" text-anchor="middle">Provider</text><rect class="bx red" x="324" y="535" width="118" height="28" rx="6"/><text class="nm" x="383" y="555" text-anchor="middle">Prefix cache</text><rect class="bx" x="43" y="1055" width="81" height="28" rx="6"/><text class="nm" x="83" y="1075" text-anchor="middle">Service</text><rect class="bx blue" x="180" y="1055" width="88" height="28" rx="6"/><text class="nm" x="224" y="1075" text-anchor="middle">Provider</text><g data-step="s1" data-p="1" data-r="1"><path class="ar green" d="M83,158 H95 V215 H87" marker-end="url(#caching-seq-g)"/><rect class="chip green" x="115" y="150" width="301" height="73" rx="6"/><text class="sb" x="125" y="172">fixed rules, 6,000 tokens ▸ marker</text><text class="sb" x="125" y="191">then goal + videos, 900 tokens</text><text class="sb mono" x="125" y="210">cache_control: {"type": "ephemeral"}</text><circle class="bd solid" cx="83" cy="186" r="10"/><text class="n" x="83" y="191.0">1</text></g><g data-step="s2" data-p="1" data-r="2"><rect class="chip blue" x="78" y="273" width="160" height="54" rx="6"/><text class="lb" x="158" y="295" text-anchor="middle">user A</text><text class="lb mono" x="158" y="314" text-anchor="middle">6,000 + 900 tokens</text><line class="ar blue" x1="97" y1="333" x2="220" y2="333" marker-end="url(#caching-seq-b)"/><circle class="bd solid" cx="83" cy="333" r="10"/><text class="n" x="83" y="337.5">2</text></g><g data-step="s3" data-p="1" data-r="2"><rect class="chip amber" x="211" y="353" width="183" height="35" rx="6"/><text class="lb" x="302" y="375" text-anchor="middle">miss · store 6,000 at 1.25×</text><line class="ar amber" x1="226" y1="394" x2="379" y2="394" marker-end="url(#caching-seq-m)"/><rect class="chip red" x="322" y="404" width="122" height="24" rx="12"/><text class="sb red" x="383" y="420" text-anchor="middle">✗ prefix cached</text></g><g data-step="s4" data-p="1" data-r="2"><text class="lb mono amber" x="154" y="474" text-anchor="middle">write 6,000 · read 0 · input 900</text><line class="ar amber dash" x1="222" y1="454" x2="87" y2="454" marker-end="url(#caching-seq-m)"/></g><g data-step="s5" data-p="1" data-r="3"><rect class="chip blue" x="70" y="577" width="176" height="54" rx="6"/><text class="lb" x="158" y="599" text-anchor="middle">user B</text><text class="lb mono" x="158" y="618" text-anchor="middle">same 6,000 + new 900</text><line class="ar blue" x1="97" y1="637" x2="220" y2="637" marker-end="url(#caching-seq-b)"/><circle class="bd solid" cx="83" cy="637" r="10"/><text class="n" x="83" y="641.5">3</text></g><g data-step="s6" data-p="1" data-r="3"><text class="lb green" x="304" y="685" text-anchor="middle">hit · lifetime renewed</text><line class="ar green dash" x1="381" y1="665" x2="228" y2="665" marker-end="url(#caching-seq-g)"/><rect class="chip green" x="146" y="702" width="156" height="24" rx="12"/><text class="sb green" x="224" y="718" text-anchor="middle">✓ same 6,000 tokens</text></g><g data-step="s7" data-p="1" data-r="3"><text class="lb green" x="154" y="772" text-anchor="middle">6,000 read at 0.1×</text><text class="lb mono green" x="154" y="791" text-anchor="middle">write 0 · read 6,000 · input 900</text><line class="ar green dash" x1="222" y1="752" x2="87" y2="752" marker-end="url(#caching-seq-g)"/></g><g data-step="s8" data-p="1" data-r="4"><text class="lb mono" x="238" y="924" text-anchor="middle">read 6,000 · write 0 · input 900</text><line class="ar dash" x1="97" y1="896" x2="379" y2="896" marker-end="url(#caching-seq-a)"/><circle class="bd solid" cx="83" cy="896" r="10"/><text class="n" x="83" y="900.5">4</text></g><g data-step="s9" data-p="1" data-r="4"><path class="ar green" d="M383,959 H395 V997 H387" marker-end="url(#caching-seq-g)"/><rect class="chip green" x="399" y="951" width="185" height="54" rx="6"/><text class="sb" x="409" y="973">share 6,000 / 6,900 ≈ 87%</text><text class="sb mono" x="409" y="992">the ceiling: healthy</text></g><g data-step="s10" data-p="1" data-r="5"><rect class="chip red" x="43" y="1097" width="232" height="35" rx="6"/><text class="lb" x="158" y="1119" text-anchor="middle">"Now 14:02" + same 6,000 tokens</text><line class="ar red" x1="97" y1="1138" x2="220" y2="1138" marker-end="url(#caching-seq-r)"/><circle class="bd solid" cx="83" cy="1138" r="10"/><text class="n" x="83" y="1142.5">5</text><rect class="chip red" x="128" y="1148" width="192" height="24" rx="12"/><text class="sb red" x="224" y="1164" text-anchor="middle">✗ exact from the first token</text></g><g data-step="s11" data-p="1" data-r="5"><text class="lb mono red" x="154" y="1218" text-anchor="middle">write 6,000 · read 0, every call</text><line class="ar red dash" x1="222" y1="1198" x2="87" y2="1198" marker-end="url(#caching-seq-r)"/></g><rect class="bx red" x="24" y="1251" width="982" height="68" rx="8" data-p="1" data-r="5"/><text class="nm red" x="42" y="1279" data-p="1" data-r="5">Every call pays the 1.25× write, and nothing is read</text><text class="sb" x="42" y="1303" data-p="1" data-r="5">Put changing values last. In the example day of 10,000 calls, that is about $225 against about $18 cached.</text></svg>