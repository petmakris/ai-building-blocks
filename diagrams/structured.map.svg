<svg class="vz" viewBox="0 0 1150 1164" role="img" aria-label="Billpod&#x27;s reader sends an invoice and a Zod schema through the gateway&#x27;s callJson; Gemini writes under that schema, which fixes only the shape of a reply that finishes normally. Three checks follow: layer 1 reads how the call ended, layer 2 parses and checks the whole answer, layer 3 checks each value and drops what fails, then the Swiss QR code&#x27;s exact values win and a person confirms the draft. Each way a reply can go wrong is caught at one of these stages, and a call with no usable answer is not retried: the draft is built from the QR code and the matched recurring payment." data-vz="map"><defs><marker id="structured-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="structured-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="structured-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="structured-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="structured-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="structured-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The provider guarantees only the shape; three checks and a person decide what is kept</text><text class="zl" x="38" y="70">HOW A REPLY GOES WRONG</text><text class="zl" x="357" y="70">ONE INVOICE READING, TOP TO BOTTOM</text><text class="zl" x="748" y="70">WHEN A CHECK FAILS</text><rect class="zone amber" x="24" y="200" width="256" height="848" rx="10" data-p="1" data-b="2" data-r="3"/><text class="zn amber" x="40" y="220" data-p="1" data-b="2" data-r="3">JSON asked for in the prompt alone</text><text class="zn amber" x="40" y="240" data-p="1" data-b="2" data-r="3">fails in these ways</text><rect class="zone" x="343" y="408" width="339" height="312" rx="10" data-p="1" data-b="3" data-r="3"/><text class="zn" x="359" y="428" data-p="1" data-b="3" data-r="3">the Gateway</text><rect class="bx" x="38" y="252" width="228" height="90" rx="8" data-p="1" data-b="2"/><text class="nm" x="56" y="282" data-p="1" data-b="2">Wrapped or broken</text><text class="sb" x="56" y="304" data-p="1" data-b="2">text or a code fence around it</text><text class="sb" x="56" y="326" data-p="1" data-b="2">a trailing comma, a raw newline</text><rect class="bx" x="38" y="440" width="228" height="90" rx="8" data-p="1" data-b="2" data-r="3"/><text class="nm" x="56" y="470" data-p="1" data-b="2" data-r="3">Cut off or refused</text><text class="sb" x="56" y="492" data-p="1" data-b="2" data-r="3">hit the token limit mid-object</text><text class="sb" x="56" y="514" data-p="1" data-b="2" data-r="3">a safety filter, yet HTTP 200</text><rect class="bx" x="38" y="768" width="228" height="90" rx="8" data-p="1" data-b="2" data-r="5"/><text class="nm" x="56" y="798" data-p="1" data-b="2" data-r="5">Impossible value</text><text class="sb" x="56" y="820" data-p="1" data-b="2" data-r="5">a date that does not exist</text><text class="sb" x="56" y="842" data-p="1" data-b="2" data-r="5">an IBAN with one misread digit</text><rect class="bx" x="38" y="946" width="228" height="90" rx="8" data-p="1" data-b="2" data-r="6"/><text class="nm" x="56" y="976" data-p="1" data-b="2" data-r="6">Real but false value</text><text class="sb" x="56" y="998" data-p="1" data-b="2" data-r="6">hidden text plants a real IBAN</text><text class="sb" x="56" y="1020" data-p="1" data-b="2" data-r="6">it passes the mod-97 check</text><rect class="bx" x="357" y="88" width="311" height="68" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="375" y="118" data-p="1" data-b="1" data-r="1">Billpod's reader</text><text class="sb" x="375" y="140" data-p="1" data-b="1" data-r="1"><tspan class="mono">callJson</tspan>: PDF + Zod schema, 4096 tokens</text><rect class="bx blue" x="357" y="252" width="311" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="375" y="282" data-p="1" data-b="1" data-r="1">Gemini writes under the schema</text><text class="sb" x="375" y="304" data-p="1" data-b="1" data-r="1"><tspan class="mono">responseSchema</tspan>, in the request settings</text><text class="sb blue" x="375" y="326" data-p="1" data-b="1" data-r="2">removes every token that breaks the schema</text><text class="sb" x="375" y="348" data-p="1" data-b="1" data-r="2">shape only, and only on a normal finish</text><rect class="bx red" x="357" y="440" width="311" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="375" y="470" data-p="1" data-b="3" data-r="3">Layer 1 · How did the call end?</text><text class="sb" x="375" y="492" data-p="1" data-b="3" data-r="3">reads <tspan class="mono">finishReason</tspan> before parsing</text><text class="sb green" x="375" y="514" data-p="1" data-b="3" data-r="3">STOP or MAX_TOKENS: go on and parse</text><text class="sb red" x="375" y="536" data-p="1" data-b="3" data-r="3">SAFETY, SPII, RECITATION…: blocked</text><rect class="bx red" x="357" y="596" width="311" height="112" rx="8" data-p="1" data-b="3" data-r="4"/><text class="nm" x="375" y="626" data-p="1" data-b="3" data-r="4">Layer 2 · Is the answer usable?</text><text class="sb" x="375" y="648" data-p="1" data-b="3" data-r="4">parse, then the same Zod schema</text><text class="sb" x="375" y="670" data-p="1" data-b="3" data-r="4">loose on purpose: optional, plain strings</text><text class="sb amber" x="375" y="692" data-p="1" data-b="3" data-r="4">so "2026-02-30" still passes here</text><rect class="bx red" x="357" y="768" width="311" height="112" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="375" y="798" data-p="1" data-b="4" data-r="5">Layer 3 · Is each value real?</text><text class="sb" x="375" y="820" data-p="1" data-b="4" data-r="5">date exists · 3-letter currency · IBAN mod 97</text><text class="sb" x="375" y="842" data-p="1" data-b="4" data-r="5">amount parses to cents · text cleaned, cut</text><text class="sb green" x="375" y="864" data-p="1" data-b="4" data-r="5">a field that fails is dropped, not guessed</text><rect class="bx green" x="357" y="946" width="311" height="112" rx="8" data-p="1" data-b="5" data-r="6"/><text class="nm" x="375" y="976" data-p="1" data-b="5" data-r="6">The Swiss QR code wins</text><text class="sb mono" x="375" y="998" data-p="1" data-b="5" data-r="6">iban = qr?.iban ?? ai?.iban</text><text class="sb" x="375" y="1020" data-p="1" data-b="5" data-r="6">same for payee, amount, reference</text><text class="sb green" x="375" y="1042" data-p="1" data-b="5" data-r="6">hidden text cannot change its IBAN</text><rect class="bx amber" x="748" y="440" width="364" height="268" rx="8" data-p="1" data-b="3"/><text class="nm" x="766" y="470" data-p="1" data-b="3">No retry: a draft without AI</text><text class="sb" x="766" y="492" data-p="1" data-b="3" data-r="4"><tspan class="mono">LlmOutputError</tspan>: AI status failed</text><text class="sb" x="766" y="514" data-p="1" data-b="3">Billpod never retries a bad answer</text><text class="sb" x="766" y="536" data-p="1" data-b="3">the draft is filled from the QR code</text><text class="sb" x="766" y="558" data-p="1" data-b="3">and the matched recurring payment</text><text class="sb amber" x="766" y="580" data-p="1" data-b="3">the failed call is still billed</text><rect class="bx" x="748" y="768" width="364" height="134" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="766" y="798" data-p="1" data-b="4" data-r="5">Example: 5 of 8 fields kept</text><text class="sb" x="766" y="820" data-p="1" data-b="4" data-r="5"><tspan class="mono">dueDate</tspan> "2026-02-30": dropped</text><text class="sb" x="766" y="842" data-p="1" data-b="4" data-r="5"><tspan class="mono">issueDate</tspan> "30.10.26": dropped</text><text class="sb" x="766" y="864" data-p="1" data-b="4" data-r="5"><tspan class="mono">direction</tspan> "outgoing": dropped</text><text class="sb green" x="766" y="886" data-p="1" data-b="4" data-r="5"><tspan class="mono">iban</tspan> passes mod 97: kept</text><rect class="bx green" x="748" y="946" width="364" height="134" rx="8" data-p="1" data-b="5" data-r="7"/><text class="nm" x="766" y="976" data-p="1" data-b="5" data-r="7">A person confirms the draft</text><text class="sb" x="766" y="998" data-p="1" data-b="5" data-r="7">each field shows its source:</text><text class="sb mono" x="766" y="1020" data-p="1" data-b="5" data-r="7">qr · ai · recurring · none</text><text class="sb" x="766" y="1042" data-p="1" data-b="5" data-r="7">nothing is filed on its own</text><text class="sb amber" x="766" y="1064" data-p="1" data-b="5" data-r="7">no QR code: only the person catches a changed IBAN</text><path class="ar dash" d="M266,297 L353,297" marker-end="url(#structured-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar dash" d="M266,485 L353,485" marker-end="url(#structured-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar dash" d="M266,813 L353,813" marker-end="url(#structured-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar dash" d="M266,991 L353,991" marker-end="url(#structured-map-a)" data-p="1" data-b="5" data-base="1"/><path class="ar blue" d="M512,156 L512,248" marker-end="url(#structured-map-b)" data-p="1" data-b="1" data-base="1"/><path class="ar blue" d="M512,364 L512,436" marker-end="url(#structured-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M512,552 L512,592" marker-end="url(#structured-map-g)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M512,708 L512,764" marker-end="url(#structured-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M512,880 L512,942" marker-end="url(#structured-map-g)" data-p="1" data-b="5" data-base="1"/><path class="ar red" d="M668,496 L744,496" marker-end="url(#structured-map-r)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M668,652 L744,652" marker-end="url(#structured-map-r)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M668,824 L744,824" marker-end="url(#structured-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M668,1002 L744,1002" marker-end="url(#structured-map-g)" data-p="1" data-b="5" data-base="1"/><path class="ar amber" d="M1112,600 L1134,600 L1134,1030 L1116,1030" marker-end="url(#structured-map-m)" data-p="1" data-b="5" data-base="1"/><path class="ar blue" d="M512,156 L512,248" marker-end="url(#structured-map-b)" data-p="1" data-r="1" data-route="1"/><path class="ar green" d="M512,364 L512,436" marker-end="url(#structured-map-g)" data-p="1" data-r="3" data-route="1"/><path class="ar green" d="M512,552 L512,592" marker-end="url(#structured-map-g)" data-p="1" data-r="4" data-route="1"/><path class="ar green" d="M512,708 L512,764" marker-end="url(#structured-map-g)" data-p="1" data-r="5" data-route="1"/><path class="ar red" d="M668,824 L744,824" marker-end="url(#structured-map-r)" data-p="1" data-r="5" data-route="1"/><path class="ar green" d="M512,880 L512,942" marker-end="url(#structured-map-g)" data-p="1" data-r="6" data-route="1"/><path class="ar green" d="M668,1002 L744,1002" marker-end="url(#structured-map-g)" data-p="1" data-r="7" data-route="1"/><text class="lb" x="315" y="286" text-anchor="middle" data-p="1" data-b="2" data-base="1">prevented</text><text class="lb" x="305" y="474" text-anchor="middle" data-p="1" data-b="3" data-base="1">caught</text><text class="lb" x="305" y="802" text-anchor="middle" data-p="1" data-b="4" data-base="1">caught</text><text class="lb" x="305" y="980" text-anchor="middle" data-p="1" data-b="5" data-base="1">caught</text><text class="lb" x="524" y="205" data-p="1" data-b="1" data-base="1">PDF + schema</text><text class="lb" x="524" y="401" data-p="1" data-b="3" data-base="1">reply</text><text class="lb" x="524" y="577" data-p="1" data-b="3" data-base="1">text to parse</text><text class="lb" x="524" y="733" data-p="1" data-b="4" data-base="1">typed data</text><text class="lb" x="524" y="905" data-p="1" data-b="5" data-base="1">fields that pass</text><text class="lb" x="710" y="485" text-anchor="middle" data-p="1" data-b="3" data-base="1">blocked</text><text class="lb" x="711" y="641" text-anchor="middle" data-p="1" data-b="3" data-base="1">rejected</text><text class="lb" x="700" y="813" text-anchor="middle" data-p="1" data-b="4" data-base="1">dropped</text><text class="lb" x="701" y="991" text-anchor="middle" data-p="1" data-b="5" data-base="1">draft</text><circle class="bd solid" cx="512" cy="177" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="512" y="181.5" data-p="1" data-r="1" data-route="1">1</text><text class="lb" x="524" y="205" data-p="1" data-r="1" data-route="1">via the Gateway: PDF + <tspan class="mono">responseSchema</tspan></text><circle class="bd solid" cx="512" cy="385" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="512" y="389.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="512" y1="385" x2="484" y2="385" data-p="1" data-r="3" data-route="1"/><text class="lb" x="400" y="389" text-anchor="middle" data-p="1" data-r="3" data-route="1">200 · <tspan class="mono">finishReason</tspan> STOP</text><circle class="bd solid" cx="512" cy="572" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="512" y="576.5" data-p="1" data-r="4" data-route="1">4</text><line class="lk" x1="512" y1="572" x2="487" y2="572" data-p="1" data-r="4" data-route="1"/><text class="lb" x="448" y="576" text-anchor="middle" data-p="1" data-r="4" data-route="1">text to parse</text><circle class="bd solid" cx="512" cy="729" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="512" y="733.5" data-p="1" data-r="5" data-route="1">5</text><line class="lk" x1="512" y1="729" x2="491" y2="730" data-p="1" data-r="5" data-route="1"/><text class="lb mono" x="432" y="743" text-anchor="middle" data-p="1" data-r="5" data-route="1">{ data }, typed</text><circle class="bd solid" cx="689" cy="824" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="689" y="828.5" data-p="1" data-r="5" data-route="1">5</text><line class="lk" x1="689" y1="824" x2="689" y2="753" data-p="1" data-r="5" data-route="1"/><text class="lb" x="689" y="748" text-anchor="middle" data-p="1" data-r="5" data-route="1"><tspan class="mono">dueDate</tspan> dropped</text><circle class="bd solid" cx="512" cy="901" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="512" y="905.5" data-p="1" data-r="6" data-route="1">6</text><text class="lb" x="524" y="929" data-p="1" data-r="6" data-route="1">fields that pass</text><circle class="bd solid" cx="689" cy="1002" r="11" data-p="1" data-r="7" data-route="1"/><text class="n" x="689" y="1006.5" data-p="1" data-r="7" data-route="1">7</text><line class="lk" x1="689" y1="1002" x2="689" y2="931" data-p="1" data-r="7" data-route="1"/><text class="lb" x="689" y="926" text-anchor="middle" data-p="1" data-r="7" data-route="1">draft + sources</text><line class="ar dash" x1="24" y1="1128.0" x2="58" y2="1128.0" marker-end="url(#structured-map-a)"/><text class="sb" x="68" y="1132">stopped at this stage</text><line class="ar blue" x1="226.80010000000001" y1="1128.0" x2="260.80010000000004" y2="1128.0" marker-end="url(#structured-map-b)"/><text class="sb" x="271" y="1132">model call and reply</text><line class="ar green" x1="424.4886" y1="1128.0" x2="458.4886" y2="1128.0" marker-end="url(#structured-map-g)"/><text class="sb" x="468" y="1132">passes on</text><line class="ar red" x1="561.042" y1="1128.0" x2="595.042" y2="1128.0" marker-end="url(#structured-map-r)"/><text class="sb" x="605" y="1132">rejected or dropped</text><line class="ar amber" x1="757.5696" y1="1128.0" x2="791.5696" y2="1128.0" marker-end="url(#structured-map-m)"/><text class="sb" x="802" y="1132">no usable answer, still a draft</text></svg>