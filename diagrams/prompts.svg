<svg class="ov-svg" viewBox="0 0 1120 850" role="img" aria-label="Tunatutor keeps its main prompt in two copies: a constant in code and a database row that a seed script and an admin screen can write. At every startup a heal compares the row with the code copy and resets it unless a person edited it, then each process caches the text, renders it on every turn and sends it to the model. Golden tests read only the code copy, so they stayed green in July 2026 while the model read an old row without rules 14 and 15.">
<defs>
<marker id="prompts-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="prompts-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="prompts-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
<marker id="prompts-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker>
</defs>
<text class="ttl" x="24" y="38">Two copies of one prompt: a startup heal decides which one the model reads</text>

<text class="zl" x="24" y="94">WHERE THE TEXT LIVES</text>
<text class="zl" x="290" y="94">THE DATABASE</text>
<text class="zl" x="580" y="94">AT EVERY STARTUP</text>
<text class="zl" x="860" y="94">ON EVERY TURN</text>

<!-- sources -->
<rect class="bx" x="24" y="128" width="220" height="96" rx="8"/>
<text class="nm mono" x="42" y="160">04-app-settings.sql</text>
<text class="sb red" x="42" y="184">July: wrote an old copy</text>
<text class="sb green" x="42" y="206">now: a drift test forbids it</text>

<rect class="bx" x="24" y="264" width="220" height="96" rx="8"/>
<text class="nm" x="42" y="296">Admin screen</text>
<text class="sb" x="42" y="320">a linguist edits, no deploy</text>
<text class="sb" x="42" y="342">a save archives the old text</text>

<rect class="bx green" x="24" y="400" width="220" height="118" rx="8"/>
<text class="nm" x="42" y="432">Code copy in git</text>
<text class="sb mono" x="42" y="456">DEFAULT_LAYER1_TEMPLATE</text>
<text class="sb" x="42" y="478">15 numbered rules</text>
<text class="sb" x="42" y="500">8 slots filled by code</text>

<!-- database -->
<rect class="bx red" x="290" y="128" width="240" height="96" rx="8"/>
<text class="nm mono" x="308" y="160">prompt_templates</text>
<text class="sb mono" x="308" y="184">ai-tutor-layer1</text>
<text class="sb red" x="308" y="206">July: rules 14 and 15 missing</text>

<rect class="bx" x="290" y="264" width="240" height="118" rx="8"/>
<text class="nm" x="308" y="296">Archive</text>
<text class="sb mono" x="308" y="320">prompt_template_versions</text>
<text class="sb" x="308" y="342">0 rows: no person edited it</text>
<text class="sb green" x="308" y="364">Activate: an old text is back</text>

<!-- heal -->
<rect class="bx red" x="580" y="128" width="240" height="254" rx="8"/>
<text class="nm" x="598" y="160">Startup heal</text>
<text class="sb" x="598" y="186">row = code copy: nothing to do</text>
<text class="sb green" x="598" y="214">0 archive rows: code copy wins,</text>
<text class="sb green" x="598" y="236">reset the row and the cache</text>
<text class="sb amber" x="598" y="264">1+ archive rows: keep the edit,</text>
<text class="sb amber" x="598" y="286">which then misses code fixes</text>
<text class="sb" x="598" y="314">the reset writes no archive row,</text>
<text class="sb" x="598" y="336">or later heals would stop</text>

<rect class="bx" x="580" y="480" width="240" height="96" rx="8"/>
<text class="nm" x="598" y="512">Cache, per process</text>
<text class="sb" x="598" y="536">a session reads it once</text>
<text class="sb" x="598" y="558">the table is not read per turn</text>

<!-- every turn -->
<rect class="bx" x="860" y="128" width="236" height="118" rx="8"/>
<text class="nm" x="878" y="160">Stamp the result</text>
<text class="sb" x="878" y="184">lesson note: prompt "v1"</text>
<text class="sb" x="878" y="206">model id in its own column</text>
<text class="sb amber" x="878" y="228">tutor replies: no stamp yet</text>

<rect class="bx blue" x="860" y="290" width="236" height="110" rx="8"/>
<text class="nm" x="878" y="322">Model</text>
<text class="sb mono" x="878" y="346">gemini-2.5-flash</text>
<text class="sb red" x="878" y="368">July: fluent, 2 rules missing</text>

<rect class="bx" x="860" y="480" width="236" height="118" rx="8"/>
<text class="nm" x="878" y="512">Render the prompt</text>
<text class="sb" x="878" y="536">code fills the 8 slots</text>
<text class="sb" x="878" y="558">then adds layers built in code</text>
<text class="sb" x="878" y="580">sent again on every call</text>

<!-- tests -->
<rect class="bx" x="24" y="650" width="506" height="118" rx="8"/>
<text class="nm" x="42" y="682">Golden tests</text>
<text class="sb" x="42" y="706">render with the code copy, compare byte for byte with a saved file</text>
<text class="sb red" x="42" y="728">they never read the row, so they stayed green all July</text>
<text class="sb" x="42" y="750">they pin the text, not how good the replies are</text>

<rect class="bx" x="580" y="650" width="516" height="118" rx="8"/>
<text class="nm" x="598" y="682">Eval</text>
<text class="sb" x="598" y="706">fixed inputs, every reply scored, old version against new</text>
<text class="sb amber" x="598" y="728">LOM-86 changed only the code behind <tspan class="mono">{{registerRule}}</tspan></text>
<text class="sb amber" x="598" y="750">replies changed at every level; nobody scored them</text>

<!-- legend -->
<line class="ar" x1="24" y1="812" x2="60" y2="812" marker-end="url(#prompts-a)"/>
<text class="sb" x="70" y="816">the text moves</text>
<line class="ar red dash" x1="220" y1="812" x2="256" y2="812" marker-end="url(#prompts-r)"/>
<text class="sb" x="266" y="816">how the old copy got in (July)</text>
<line class="ar green" x1="520" y1="812" x2="556" y2="812" marker-end="url(#prompts-g)"/>
<text class="sb" x="566" y="816">the text the heal chose</text>
<line class="ar blue" x1="780" y1="812" x2="816" y2="812" marker-end="url(#prompts-b)"/>
<text class="sb" x="826" y="816">sent to the model</text>

<!-- arrows -->
<line class="ar red dash" x1="244" y1="160" x2="286" y2="160" marker-end="url(#prompts-r)"/>
<path class="ar" d="M244,290 H266 V200 H286" marker-end="url(#prompts-a)"/>
<line class="ar" x1="244" y1="330" x2="286" y2="330" marker-end="url(#prompts-a)"/>
<line class="ar" x1="530" y1="176" x2="576" y2="176" marker-end="url(#prompts-a)"/>
<line class="ar" x1="530" y1="330" x2="576" y2="330" marker-end="url(#prompts-a)"/>
<path class="ar" d="M244,440 H640 V386" marker-end="url(#prompts-a)"/>
<text class="lb" x="410" y="430" text-anchor="middle">registered at startup</text>
<line class="ar green" x1="760" y1="382" x2="760" y2="476" marker-end="url(#prompts-g)"/>
<line class="ar green" x1="820" y1="528" x2="856" y2="528" marker-end="url(#prompts-g)"/>
<line class="ar blue" x1="978" y1="480" x2="978" y2="404" marker-end="url(#prompts-b)"/>
<line class="ar" x1="978" y1="290" x2="978" y2="250" marker-end="url(#prompts-a)"/>
<line class="ar" x1="134" y1="518" x2="134" y2="646" marker-end="url(#prompts-a)"/>
<text class="lb" x="146" y="590">uses only this copy</text>
</svg>
