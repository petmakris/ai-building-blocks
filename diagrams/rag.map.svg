<svg class="vz" viewBox="0 0 1582 1198" role="img" aria-label="Offline, an indexing job cuts each document into chunks, adds a context line, embeds each chunk with voyage-3 and stores text, vector, keywords and copied access groups in one Postgres chunk table. For each question, your code embeds the question with the same model, runs a vector search and a keyword search that both filter by the caller&#x27;s groups inside the SQL, merges the two ranked lists with reciprocal rank fusion, keeps the best 5, numbers them in the prompt and calls the model, then turns each citation into a link. Anthropic&#x27;s failure rate drops from 5.7% to 1.9% as context lines, keyword search and a reranker are added." data-vz="map"><defs><marker id="rag-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="rag-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="rag-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="rag-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="rag-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="rag-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Your code searches first; the model answers only from the passages it is given</text><text class="zl" x="38" y="70">SOURCE · CALLER · MODEL</text><text class="zl" x="306" y="70">CHUNK · PROMPT</text><text class="zl" x="546" y="70">CONTEXT LINE · TOP 5</text><text class="zl" x="826" y="70">EMBED · MERGE</text><text class="zl" x="1070" y="70">SEARCH</text><text class="zl" x="1363" y="70">POSTGRES</text><rect class="zone" x="24" y="88" width="1004" height="178" rx="10" data-p="1" data-b="1" data-r="2"/><text class="zn" x="40" y="108" data-p="1" data-b="1" data-r="2">Indexing · offline, once per document and again on every change</text><rect class="zone" x="24" y="314" width="1297" height="630" rx="10" data-p="1" data-b="2" data-r="1"/><text class="zn" x="40" y="334" data-p="1" data-b="2" data-r="1">Each question · before the model call</text><rect class="bx" x="38" y="120" width="212" height="134" rx="8" data-p="1" data-b="1"/><text class="nm" x="56" y="150" data-p="1" data-b="1">Confluence, Jira</text><text class="sb" x="56" y="172" data-p="1" data-b="1">pages and tickets</text><text class="sb" x="56" y="194" data-p="1" data-b="1">240,000 (example)</text><text class="sb amber" x="56" y="216" data-p="1" data-b="1">access groups copied</text><text class="sb amber" x="56" y="238" data-p="1" data-b="1">re-index on change</text><rect class="bx" x="306" y="120" width="184" height="134" rx="8" data-p="1" data-b="1"/><text class="nm" x="324" y="150" data-p="1" data-b="1">Chunker</text><text class="sb" x="324" y="172" data-p="1" data-b="1">page: cut at headings</text><text class="sb" x="324" y="194" data-p="1" data-b="1">ticket: one per comment</text><text class="sb" x="324" y="216" data-p="1" data-b="1">≤ about 500 tokens</text><text class="sb" x="324" y="238" data-p="1" data-b="1">starts with its source</text><rect class="bx amber" x="546" y="120" width="224" height="134" rx="8" data-p="1" data-b="1"/><text class="nm" x="564" y="150" data-p="1" data-b="1">Context line (an LLM)</text><text class="sb" x="564" y="172" data-p="1" data-b="1">"Ticket OPS-8812, PAY-4012</text><text class="sb" x="564" y="194" data-p="1" data-b="1">on Swiss payments" (example)</text><text class="sb amber" x="564" y="216" data-p="1" data-b="1">$1.02 per 1M document tokens</text><text class="sb green" x="564" y="238" data-p="1" data-b="1">misses 5.7% → 3.7%</text><rect class="bx" x="826" y="120" width="188" height="134" rx="8" data-p="1" data-b="1" data-r="2"/><text class="nm" x="844" y="150" data-p="1" data-b="1" data-r="2">Embedder</text><text class="sb mono" x="844" y="172" data-p="1" data-b="1" data-r="2">voyage-3</text><text class="sb" x="844" y="194" data-p="1" data-b="1" data-r="2">1,024 numbers</text><text class="sb" x="844" y="216" data-p="1" data-b="1" data-r="2">per chunk, as</text><text class="sb mono" x="844" y="238" data-p="1" data-b="1" data-r="2">"document"</text><rect class="bx" x="1363" y="120" width="181" height="548" rx="8" data-p="1" data-b="1" data-r="3"/><text class="nm" x="1381" y="150" data-p="1" data-b="1" data-r="3">chunk table</text><text class="sb" x="1381" y="172" data-p="1" data-b="1" data-r="3">Postgres + pgvector</text><text class="sb mono" x="1381" y="204" data-p="1" data-b="1" data-r="3">body</text><text class="sb" x="1381" y="226" data-p="1" data-b="1" data-r="3">text + context line</text><text class="sb mono" x="1381" y="258" data-p="1" data-b="1" data-r="3">embedding</text><text class="sb" x="1381" y="280" data-p="1" data-b="1" data-r="3">vector(1024), hnsw</text><text class="sb mono" x="1381" y="312" data-p="1" data-b="1" data-r="3">tsv</text><text class="sb" x="1381" y="334" data-p="1" data-b="1" data-r="3">keywords, gin index</text><text class="sb mono" x="1381" y="366" data-p="1" data-b="1" data-r="3">access_groups</text><text class="sb" x="1381" y="388" data-p="1" data-b="1" data-r="3">copied from the source</text><text class="sb mono" x="1381" y="420" data-p="1" data-b="1" data-r="3">doc_url</text><text class="sb" x="1381" y="442" data-p="1" data-b="1" data-r="3">link to the source</text><text class="sb amber" x="1381" y="474" data-p="1" data-b="1" data-r="3">new model or new cuts:</text><text class="sb amber" x="1381" y="496" data-p="1" data-b="1" data-r="3">re-embed every row</text><rect class="bx" x="38" y="346" width="212" height="122" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="56" y="376" data-p="1" data-b="2" data-r="1">Operator (example)</text><text class="sb" x="56" y="398" data-p="1" data-b="2" data-r="1">"What does PAY-4012</text><text class="sb" x="56" y="420" data-p="1" data-b="2" data-r="1">mean? What do we do?"</text><text class="sb" x="56" y="452" data-p="1" data-b="2" data-r="1">groups come from your login</text><rect class="bx" x="826" y="346" width="188" height="112" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="844" y="376" data-p="1" data-b="2" data-r="1">Embed the question</text><text class="sb" x="844" y="398" data-p="1" data-b="2" data-r="1">same model: voyage-3</text><text class="sb mono" x="844" y="420" data-p="1" data-b="2" data-r="2">input_type "query"</text><text class="sb red" x="844" y="442" data-p="1" data-b="2" data-r="1">other model: random hits</text><rect class="bx" x="1070" y="346" width="237" height="112" rx="8" data-p="1" data-b="2" data-r="3"/><text class="nm" x="1088" y="376" data-p="1" data-b="2" data-r="3">Vector search</text><text class="sb" x="1088" y="398" data-p="1" data-b="2" data-r="3">meaning · LIMIT 50</text><text class="sb green" x="1088" y="420" data-p="1" data-b="2" data-r="3">access filter in SQL</text><text class="sb amber" x="1088" y="442" data-p="1" data-b="2" data-r="3">may miss PAY-4012</text><rect class="bx" x="1070" y="512" width="237" height="134" rx="8" data-p="1" data-b="2" data-r="3"/><text class="nm" x="1088" y="542" data-p="1" data-b="2" data-r="3">Keyword search</text><text class="sb" x="1088" y="564" data-p="1" data-b="2" data-r="3">full-text · LIMIT 50</text><text class="sb green" x="1088" y="586" data-p="1" data-b="2" data-r="3">access filter in SQL</text><text class="sb green" x="1088" y="608" data-p="1" data-b="2" data-r="3">misses 3.7% → 2.9%</text><text class="sb" x="1088" y="630" data-p="1" data-b="2" data-r="3"><tspan class="mono">tsv @@</tspan> query, <tspan class="mono">ts_rank</tspan>, 'simple'</text><rect class="bx red" x="306" y="512" width="464" height="156" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="324" y="542" data-p="1" data-b="3" data-r="3">Trap: filtering after the search</text><text class="sb" x="324" y="564" data-p="1" data-b="3" data-r="3">drop forbidden rows after LIMIT 50: maybe none left</text><text class="sb" x="324" y="586" data-p="1" data-b="3" data-r="3">hnsw scans 40, then filters: if 10% pass, ~4 rows</text><text class="sb green" x="324" y="608" data-p="1" data-b="3" data-r="3">fix: filter inside the SQL and run</text><text class="sb mono green" x="324" y="630" data-p="1" data-b="3" data-r="3">SET hnsw.iterative_scan = strict_order</text><text class="sb green" x="324" y="652" data-p="1" data-b="3" data-r="3"><tspan class="mono">access_groups &amp;&amp; :callerGroups</tspan> in each WHERE</text><rect class="bx" x="826" y="712" width="481" height="144" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="844" y="742" data-p="1" data-b="4" data-r="4">Merge both lists by rank (RRF)</text><text class="sb" x="844" y="764" data-p="1" data-b="4" data-r="4">rank r scores 1/(60 + r) in each list; scores add up</text><text class="sb" x="844" y="786" data-p="1" data-b="4" data-r="4">scales differ, so only positions count</text><text class="sb" x="844" y="818" data-p="1" data-b="4" data-r="4">example: runbook keyword #1 + vector #3 = 0.0323</text><text class="sb" x="844" y="840" data-p="1" data-b="4" data-r="4">beats vector #1 alone: 0.0164</text><rect class="bx" x="546" y="712" width="224" height="134" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="564" y="742" data-p="1" data-b="4" data-r="4">Keep the best 5</text><text class="sb" x="564" y="764" data-p="1" data-b="4" data-r="4">more chunks bring</text><text class="sb" x="564" y="786" data-p="1" data-b="4" data-r="4">more near-misses</text><text class="sb amber" x="564" y="808" data-p="1" data-b="4" data-r="4">reranker: keep 20</text><text class="sb green" x="564" y="830" data-p="1" data-b="4" data-r="4">misses 2.9% → 1.9%</text><rect class="bx" x="306" y="712" width="184" height="112" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="324" y="742" data-p="1" data-b="4" data-r="5">Numbered prompt</text><text class="sb" x="324" y="764" data-p="1" data-b="4" data-r="5">rules, [1]…[5], question</text><text class="sb" x="324" y="786" data-p="1" data-b="4" data-r="5">"cite as [1], [2]"</text><text class="sb" x="324" y="808" data-p="1" data-b="4" data-r="5">"else say I don't know"</text><rect class="bx blue" x="38" y="712" width="212" height="220" rx="8" data-p="1" data-b="4" data-r="6"/><text class="nm" x="56" y="742" data-p="1" data-b="4" data-r="6">The model</text><text class="sb" x="56" y="764" data-p="1" data-b="4" data-r="6">one user message</text><text class="sb" x="56" y="786" data-p="1" data-b="4" data-r="6">max_tokens 1024</text><text class="sb amber" x="56" y="808" data-p="1" data-b="4" data-r="6">may obey a chunk's</text><text class="sb amber" x="56" y="830" data-p="1" data-b="4" data-r="6">hidden instructions</text><text class="sb green" x="56" y="862" data-p="1" data-b="4" data-r="6"><tspan class="mono">end_turn</tspan> · cites [1] and [2]</text><text class="sb amber" x="56" y="894" data-p="1" data-b="4" data-r="6">no [n]: a warning</text><text class="sb amber" x="56" y="916" data-p="1" data-b="4" data-r="6">cut off: an error</text><rect class="bx green" x="38" y="992" width="732" height="122" rx="8" data-p="1" data-b="5"/><text class="nm" x="56" y="1022" data-p="1" data-b="5">Measure search alone: recall@5</text><text class="sb" x="56" y="1044" data-p="1" data-b="5">30 labelled real questions; found if the document is in the top 5</text><text class="sb" x="56" y="1066" data-p="1" data-b="5">no model call · rerun on every change to chunking, model or ranking</text><text class="sb" x="56" y="1098" data-p="1" data-b="5">misses: share of Anthropic's test questions whose document is not in the top 20</text><path class="ar" d="M250,187 L302,187" marker-end="url(#rag-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M490,187 L542,187" marker-end="url(#rag-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M770,187 L822,187" marker-end="url(#rag-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M1014,187 L1359,187" marker-end="url(#rag-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M250,402 L822,402" marker-end="url(#rag-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M1014,402 L1066,402" marker-end="url(#rag-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M920,458 L920,579 L1066,579" marker-end="url(#rag-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M1307,402 L1359,402" marker-end="url(#rag-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M1307,579 L1359,579" marker-end="url(#rag-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M1393,668 L1393,724 L1311,724" marker-end="url(#rag-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M826,779 L774,779" marker-end="url(#rag-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M546,768 L494,768" marker-end="url(#rag-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M306,768 L254,768" marker-end="url(#rag-map-b)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M144,712 L144,472" marker-end="url(#rag-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M250,402 L822,402" marker-end="url(#rag-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M900,346 L900,258" marker-end="url(#rag-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M940,254 L940,342" marker-end="url(#rag-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M1014,402 L1066,402" marker-end="url(#rag-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M890,458 L890,549 L1066,549" marker-end="url(#rag-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M1307,402 L1359,402" marker-end="url(#rag-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M1307,579 L1359,579" marker-end="url(#rag-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar green" d="M1393,668 L1393,724 L1311,724" marker-end="url(#rag-map-g)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M826,779 L774,779" marker-end="url(#rag-map-a)" data-p="1" data-r="4" data-route="1"/><path class="ar" d="M546,768 L494,768" marker-end="url(#rag-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar blue" d="M306,768 L254,768" marker-end="url(#rag-map-b)" data-p="1" data-r="6" data-route="1"/><path class="ar" d="M144,712 L144,472" marker-end="url(#rag-map-a)" data-p="1" data-r="6" data-route="1"/><text class="lb" x="534" y="391" text-anchor="middle" data-p="1" data-b="2" data-base="1">question + callerGroups</text><text class="lb" x="1405" y="693" data-p="1" data-b="4" data-base="1">two ranked lists of ids</text><text class="lb" x="156" y="593" data-p="1" data-b="4" data-base="1">each [n] becomes a link</text><circle class="bd solid" cx="271" cy="402" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="271" y="406.5" data-p="1" data-r="1" data-route="1">1</text><text class="lb" x="531" y="391" text-anchor="middle" data-p="1" data-r="1" data-route="1">PAY-4012 question + callerGroups</text><circle class="bd solid" cx="900" cy="325" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="900" y="329.5" data-p="1" data-r="2" data-route="1">2</text><text class="lb" x="888" y="295" text-anchor="end" data-p="1" data-r="2" data-route="1">question · input_type "query"</text><circle class="bd solid" cx="940" cy="275" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="940" y