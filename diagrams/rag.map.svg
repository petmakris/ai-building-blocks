" data-p="1" data-r="5" data-route="1">[1] runbook · [2] ticket OPS-8812</text><circle class="bd solid" cx="285" cy="768" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="285" y="772.5" data-p="1" data-r="6" data-route="1">6</text><line class="lk" x1="285" y1="768" x2="285" y2="697" data-p="1" data-r="6" data-route="1"/><text class="lb" x="285" y="692" text-anchor="middle" data-p="1" data-r="6" data-route="1">one user message</text><circle class="bd solid" cx="144" cy="691" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="144" y="695.5" data-p="1" data-r="6" data-route="1">6</text><text class="lb" x="156" y="593" data-p="1" data-r="6" data-route="1">answer, each [n] a link</text><line class="ar" x1="24" y1="1162.0" x2="58" y2="1162.0" marker-end="url(#rag-map-a)"/><text class="sb" x="68" y="1166">text, queries and ids</text><line class="ar blue" x1="222.51139999999998" y1="1162.0" x2="256.5114" y2="1162.0" marker-end="url(#rag-map-b)"/><text class="sb" x="267" y="1166">the one model call</text></svg>