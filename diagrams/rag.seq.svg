<svg class="vz" viewBox="0 0 761 1333" role="img" aria-label="Two filtered searches pick the 5 sources before the one model call" data-vz="sequence"><defs><marker id="rag-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="rag-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="rag-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="rag-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="rag-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="rag-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Two filtered searches pick the 5 sources before the one model call</text><text class="sub" x="24" y="62">Example: a made-up question about PAY-4012, with the real rules of the query path.</text><line class="life" x1="104" y1="132" x2="104" y2="1235"/><line class="life" x1="265" y1="132" x2="265" y2="1235"/><line class="life" x1="425" y1="132" x2="425" y2="357"/><line class="life" x1="425" y1="419" x2="425" y2="916"/><line class="life" x1="425" y1="978" x2="425" y2="1235"/><rect class="bx" x="24" y="78" width="160" height="54" rx="8"/><text class="nm" x="104" y="101" text-anchor="middle">Operator</text><text class="sb" x="104" y="120" text-anchor="middle">asks about PAY-4012</text><rect class="bx" x="206" y="78" width="118" height="54" rx="8"/><text class="nm" x="265" y="101" text-anchor="middle">Retrieval</text><text class="sb" x="265" y="120" text-anchor="middle">your code</text><rect class="bx" x="346" y="78" width="157" height="54" rx="8"/><text class="nm" x="425" y="101" text-anchor="middle">Embedder</text><text class="sb" x="425" y="120" text-anchor="middle">voyage-3 over HTTP</text><rect class="bx" x="366" y="365" width="118" height="54" rx="8"/><text class="nm" x="425" y="388" text-anchor="middle">Postgres</text><text class="sb" x="425" y="407" text-anchor="middle">chunk table</text><rect class="bx blue" x="366" y="924" width="118" height="54" rx="8"/><text class="nm" x="425" y="947" text-anchor="middle">Model</text><text class="sb blue" x="425" y="966" text-anchor="middle">one call</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip" x="73" y="150" width="233" height="54" rx="6"/><text class="lb" x="190" y="172" text-anchor="middle">PAY-4012 question + callerGroups</text><text class="lb mono" x="190" y="191" text-anchor="middle">groups from your login</text><line class="ar" x1="118" y1="210" x2="261" y2="210" marker-end="url(#rag-seq-a)"/><circle class="bd solid" cx="104" cy="210" r="10"/><text class="n" x="104" y="214.5">1</text></g><g data-step="s2" data-p="1" data-r="2"><rect class="chip" x="270" y="230" width="160" height="54" rx="6"/><text class="lb" x="350" y="252" text-anchor="middle">the question</text><text class="lb mono" x="350" y="271" text-anchor="middle">input_type "query"</text><line class="ar" x1="279" y1="290" x2="421" y2="290" marker-end="url(#rag-seq-a)"/><circle class="bd solid" cx="265" cy="290" r="10"/><text class="n" x="265" y="294.5">2</text></g><g data-step="s3" data-p="1" data-r="2"><text class="lb" x="346" y="338" text-anchor="middle">1,024 numbers (voyage-3)</text><line class="ar dash" x1="423" y1="318" x2="269" y2="318" marker-end="url(#rag-seq-a)"/></g><g data-step="s4" data-p="1" data-r="3"><rect class="chip green" x="223" y="435" width="254" height="54" rx="6"/><text class="lb" x="350" y="457" text-anchor="middle">vector query · LIMIT 50</text><text class="lb mono" x="350" y="476" text-anchor="middle">access_groups &amp;&amp; :callerGroups</text><line class="ar green" x1="279" y1="495" x2="421" y2="495" marker-end="url(#rag-seq-g)"/><circle class="bd solid" cx="265" cy="495" r="10"/><text class="n" x="265" y="499.5">3</text><rect class="chip green" x="370" y="505" width="109" height="24" rx="12"/><text class="sb green" x="425" y="522" text-anchor="middle">✓ filter in SQL</text></g><g data-step="s5" data-p="1" data-r="3"><rect class="chip green" x="252" y="547" width="184" height="54" rx="6"/><text class="lb" x="344" y="569" text-anchor="middle">keyword query · LIMIT 50</text><text class="lb mono" x="344" y="588" text-anchor="middle">tsv @@ query, ts_rank</text><line class="ar green" x1="267" y1="607" x2="421" y2="607" marker-end="url(#rag-seq-g)"/><rect class="chip green" x="370" y="617" width="109" height="24" rx="12"/><text class="sb green" x="425" y="634" text-anchor="middle">✓ filter in SQL</text></g><g data-step="s6" data-p="1" data-r="3"><text class="lb green" x="346" y="687" text-anchor="middle">two ranked lists of ids</text><line class="ar green dash" x1="423" y1="667" x2="269" y2="667" marker-end="url(#rag-seq-g)"/></g><g data-step="s7" data-p="1" data-r="4"><path class="ar" d="M265,722 H277 V779 H269" marker-end="url(#rag-seq-a)"/><rect class="chip" x="297" y="714" width="178" height="73" rx="6"/><text class="sb" x="307" y="736">RRF: runbook 1/61 (kw #1)</text><text class="sb" x="307" y="755">+ 1/63 (vec #3) = 0.0323</text><text class="sb mono" x="307" y="774">example ranks</text><circle class="bd solid" cx="265" cy="750" r="10"/><text class="n" x="265" y="755.0">4</text></g><g data-step="s8" data-p="1" data-r="4"><path class="ar" d="M265,811 H277 V830 H269" marker-end="url(#rag-seq-a)"/><rect class="chip" x="281" y="803" width="107" height="35" rx="6"/><text class="sb" x="291" y="825">keep top 5 ids</text></g><g data-step="s9" data-p="1" data-r="5"><path class="ar" d="M265,862 H277 V900 H269" marker-end="url(#rag-seq-a)"/><rect class="chip" x="297" y="854" width="237" height="54" rx="6"/><text class="sb" x="307" y="876">prompt: rules, [1] runbook ·</text><text class="sb" x="307" y="895">[2] ticket OPS-8812 … [5], question</text><circle class="bd solid" cx="265" cy="881" r="10"/><text class="n" x="265" y="885.5">5</text></g><g data-step="s10" data-p="1" data-r="6"><rect class="chip blue" x="282" y="994" width="137" height="54" rx="6"/><text class="lb" x="350" y="1016" text-anchor="middle">one user message</text><text class="lb mono" x="350" y="1035" text-anchor="middle">max_tokens 1024</text><line class="ar blue" x1="279" y1="1054" x2="421" y2="1054" marker-end="url(#rag-seq-b)"/><circle class="bd solid" cx="265" cy="1054" r="10"/><text class="n" x="265" y="1058.5">6</text></g><g data-step="s11" data-p="1" data-r="6"><text class="lb green" x="346" y="1102" text-anchor="middle">cites [1] and [2]</text><text class="lb mono green" x="346" y="1121" text-anchor="middle">end_turn</text><line class="ar green dash" x1="423" y1="1082" x2="269" y2="1082" marker-end="url(#rag-seq-g)"/><rect class="chip green" x="171" y="1138" width="101" height="24" rx="12"/><text class="sb green" x="221" y="1154" text-anchor="middle">✓ not cut off</text><rect class="chip green" x="280" y="1138" width="80" height="24" rx="12"/><text class="sb green" x="320" y="1154" text-anchor="middle">✓ has [n]</text></g><g data-step="s12" data-p="1" data-r="6"><text class="lb green" x="186" y="1208" text-anchor="middle">answer, each [n] a link</text><line class="ar green dash" x1="263" y1="1188" x2="108" y2="1188" marker-end="url(#rag-seq-g)"/></g><rect class="bx green" x="24" y="1241" width="713" height="68" rx="8" data-p="1" data-r="6"/><text class="nm green" x="42" y="1269" data-p="1" data-r="6">The operator gets an answer with two linked sources</text><text class="sb" x="42" y="1293" data-p="1" data-r="6">The model saw only the 5 chunks the caller may read, and each [n] opens its source to check before acting.</text></svg>