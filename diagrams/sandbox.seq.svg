<svg class="vz" viewBox="0 0 1152 1232" role="img" aria-label="The injected command runs in a box with nothing to read and no way out, and a short reason goes back" data-vz="sequence"><defs><marker id="sandbox-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="sandbox-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="sandbox-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="sandbox-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="sandbox-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="sandbox-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The injected command runs in a box with nothing to read and no way out, and a short reason goes back</text><text class="sub" x="24" y="62">Example: the names, paths and limits are made up. The Docker flags are real.</text><rect class="band" x="12" y="144" width="1128" height="585" rx="10" data-p="1" data-r="1"/><text class="zl" x="24" y="166" data-p="1" data-r="1">THE INJECTED CSV CELL</text><rect class="band" x="12" y="735" width="1128" height="395" rx="10" data-p="1" data-r="5"/><text class="zl" x="24" y="757" data-p="1" data-r="5">A LATER SCRIPT · LOOPS FOREVER, NO ATTACK</text><line class="life" x1="91" y1="132" x2="91" y2="1134"/><line class="life" x1="251" y1="132" x2="251" y2="1134"/><line class="life" x1="423" y1="132" x2="423" y2="1134"/><line class="life" x1="608" y1="132" x2="608" y2="1134"/><rect class="bx" x="24" y="78" width="134" height="54" rx="8"/><text class="nm" x="91" y="101" text-anchor="middle">Agent</text><text class="sb" x="91" y="120" text-anchor="middle">holds the secrets</text><rect class="bx blue" x="180" y="78" width="142" height="54" rx="8"/><text class="nm" x="251" y="101" text-anchor="middle">Model</text><text class="sb blue" x="251" y="120" text-anchor="middle">obeys planted text</text><rect class="bx red" x="344" y="78" width="158" height="54" rx="8"/><text class="nm" x="423" y="101" text-anchor="middle">Runner</text><text class="sb red" x="423" y="120" text-anchor="middle">only one with Docker</text><rect class="bx green" x="523" y="78" width="168" height="54" rx="8"/><text class="nm" x="608" y="101" text-anchor="middle">Sandbox</text><text class="sb green" x="608" y="120" text-anchor="middle">a throwaway container</text><rect class="bx" x="56" y="775" width="69" height="28" rx="6"/><text class="nm" x="91" y="795" text-anchor="middle">Agent</text><rect class="bx blue" x="215" y="775" width="71" height="28" rx="6"/><text class="nm" x="251" y="795" text-anchor="middle">Model</text><rect class="bx red" x="384" y="775" width="78" height="28" rx="6"/><text class="nm" x="423" y="795" text-anchor="middle">Runner</text><rect class="bx green" x="563" y="775" width="90" height="28" rx="6"/><text class="nm" x="608" y="795" text-anchor="middle">Sandbox</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip blue" x="62" y="184" width="227" height="35" rx="6"/><text class="lb" x="176" y="206" text-anchor="middle">question + CSV + run_python tool</text><line class="ar blue" x1="105" y1="225" x2="247" y2="225" marker-end="url(#sandbox-seq-b)"/><circle class="bd solid" cx="91" cy="225" r="10"/><text class="n" x="91" y="229.5">1</text></g><g data-step="s2" data-p="1" data-r="1"><text class="lb red" x="172" y="273" text-anchor="middle">tool_use</text><text class="lb mono red" x="172" y="292" text-anchor="middle">upload ~/.aws/credentials</text><line class="ar red dash" x1="249" y1="253" x2="95" y2="253" marker-end="url(#sandbox-seq-r)"/></g><g data-step="s3" data-p="1" data-r="2"><rect class="chip" x="135" y="319" width="254" height="35" rx="6"/><text class="lb mono" x="262" y="341" text-anchor="middle">POST /runs · script + file IDs</text><line class="ar" x1="105" y1="360" x2="419" y2="360" marker-end="url(#sandbox-seq-a)"/><circle class="bd solid" cx="91" cy="360" r="10"/><text class="n" x="91" y="364.5">2</text><rect class="chip green" x="324" y="370" width="198" height="24" rx="12"/><text class="sb green" x="423" y="386" text-anchor="middle">✓ agent runs no model code</text></g><g data-step="s4" data-p="1" data-r="3"><path class="ar" d="M423,420 H435 V458 H427" marker-end="url(#sandbox-seq-a)"/><rect class="chip" x="455" y="412" width="254" height="54" rx="6"/><text class="sb" x="465" y="434">run folder</text><text class="sb mono" x="465" y="453">/runs/8f3a/ with in, code, out</text><circle class="bd solid" cx="423" cy="439" r="10"/><text class="n" x="423" y="443.5">3</text></g><g data-step="s5" data-p="1" data-r="3"><rect class="chip red" x="360" y="482" width="309" height="35" rx="6"/><text class="lb mono" x="514" y="504" text-anchor="middle">docker run --network none --read-only</text><line class="ar red" x1="425" y1="523" x2="604" y2="523" marker-end="url(#sandbox-seq-r)"/><rect class="chip green" x="404" y="533" width="171" height="24" rx="12"/><text class="sb green" x="490" y="550" text-anchor="middle">✓ /data /code read-only</text><rect class="chip green" x="584" y="533" width="108" height="24" rx="12"/><text class="sb green" x="638" y="550" text-anchor="middle">✓ user 65534</text></g><g data-step="s6" data-p="1" data-r="4"><path class="ar green" d="M608,583 H620 V602 H612" marker-end="url(#sandbox-seq-g)"/><rect class="chip green" x="640" y="575" width="185" height="35" rx="6"/><text class="sb" x="650" y="597">no ~/.aws/credentials here</text><circle class="bd solid" cx="608" cy="592" r="10"/><text class="n" x="608" y="597.0">4</text><rect class="chip green" x="640" y="618" width="131" height="24" rx="12"/><text class="sb green" x="705" y="634" text-anchor="middle">✓ nothing to read</text></g><g data-step="s7" data-p="1" data-r="4"><path class="ar green" d="M608,666 H620 V685 H612" marker-end="url(#sandbox-seq-g)"/><rect class="chip green" x="624" y="658" width="238" height="35" rx="6"/><text class="sb mono" x="634" y="680">curl: could not resolve host</text><rect class="chip green" x="624" y="701" width="141" height="24" rx="12"/><text class="sb green" x="694" y="718" text-anchor="middle">✓ nowhere to send</text></g><g data-step="s8" data-p="1" data-r="5"><path class="ar amber" d="M608,825 H620 V863 H612" marker-end="url(#sandbox-seq-m)"/><rect class="chip amber" x="640" y="817" width="355" height="54" rx="6"/><text class="sb" x="650" y="839">limits</text><text class="sb mono" x="650" y="858">timeout 60 · --memory 1g · --pids-limit 128</text><circle class="bd solid" cx="608" cy="844" r="10"/><text class="n" x="608" y="848.5">5</text></g><g data-step="s9" data-p="1" data-r="5"><text class="lb red" x="516" y="915" text-anchor="middle">exit 124 after 60 s</text><line class="ar red dash" x1="606" y1="895" x2="427" y2="895" marker-end="url(#sandbox-seq-r)"/><rect class="chip red" x="357" y="932" width="131" height="24" rx="12"/><text class="sb red" x="423" y="948" text-anchor="middle">✗ finished in 60 s</text></g><g data-step="s10" data-p="1" data-r="6"><rect class="chip" x="131" y="974" width="242" height="54" rx="6"/><text class="lb" x="252" y="996" text-anchor="middle">"exit code 124: timed out after 60 s"</text><text class="lb mono" x="252" y="1015" text-anchor="middle">output cut to a few KB</text><line class="ar" x1="409" y1="1034" x2="95" y2="1034" marker-end="url(#sandbox-seq-a)"/><circle class="bd solid" cx="423" cy="1034" r="10"/><text class="n" x="423" y="1038.5">6</text></g><g data-step="s11" data-p="1" data-r="6"><rect class="chip blue" x="39" y="1054" width="262" height="54" rx="6"/><text class="lb" x="170" y="1076" text-anchor="middle">tool_result</text><text class="lb mono" x="170" y="1095" text-anchor="middle">that tool_use id · short output</text><line class="ar blue" x1="93" y1="1114" x2="247" y2="1114" marker-end="url(#sandbox-seq-b)"/></g><rect class="bx green" x="24" y="1140" width="1104" height="68" rx="8" data-p="1" data-r="6"/><text class="nm green" x="42" y="1168" data-p="1" data-r="6">Nothing left the box, and the model tries again</text><text class="sb" x="42" y="1192" data-p="1" data-r="6">The runner moves files in out to held storage and deletes the run folder. The model fixes its code and sends a new tool_use.</text></svg>