<svg class="vz" viewBox="0 0 1098 898" role="img" aria-label="Billpod&#x27;s assistant as an agent loop. Code checks the limits, the model picks the next tool call, and a reply with no tool call ends the loop. Each tool call is a proposal: unknown names get an error result, reads run at once, and a change is checked against the stored bill, then sealed into a 10-minute token while the person sees a card. The approval is a second HTTP request that runs only the sealed call once and carries the step count on. A bottom row compares a workflow, an agent at about 4 times a chat&#x27;s tokens and a multi-agent system at about 15 times." data-vz="map"><defs><marker id="agents-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="agents-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="agents-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="agents-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="agents-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="agents-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">An agent is a loop where the model picks each step, and your code owns every exit</text><rect class="zone red" x="282" y="444" width="792" height="178" rx="10" data-p="1" data-b="4" data-r="4"/><text class="zn red" x="298" y="464" data-p="1" data-b="4" data-r="4">The pause: one turn spans two HTTP requests</text><rect class="zone" x="24" y="670" width="1050" height="156" rx="10" data-p="1" data-b="6"/><text class="zn" x="40" y="690" data-p="1" data-b="6">Workflow or agent · tokens per task, a plain chat = 1×</text><rect class="bx" x="38" y="88" width="202" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="118" data-p="1" data-b="1" data-r="1">Person, request 1</text><text class="sb" x="56" y="140" data-p="1" data-b="1" data-r="1">“Mark the electricity bill</text><text class="sb" x="56" y="162" data-p="1" data-b="1" data-r="1">paid and say what is due”</text><text class="sb" x="56" y="184" data-p="1" data-b="1" data-r="1">(example)</text><rect class="bx green" x="296" y="88" width="219" height="134" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="314" y="118" data-p="1" data-b="1" data-r="1">Check the limits</text><text class="sb green" x="314" y="140" data-p="1" data-b="1" data-r="1">model call N of 6</text><text class="sb" x="314" y="162" data-p="1" data-b="1" data-r="1">60 s timeout, 2048 tokens out</text><text class="sb" x="314" y="184" data-p="1" data-b="1" data-r="2">each call resends everything</text><text class="sb amber" x="314" y="206" data-p="1" data-b="1" data-r="2">each costs more than the last</text><rect class="bx blue" x="571" y="88" width="219" height="134" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="589" y="118" data-p="1" data-b="1" data-r="1">Gemini, the model</text><text class="sb" x="589" y="140" data-p="1" data-b="1" data-r="1">gets prompt, transcript, tools</text><text class="sb blue" x="589" y="162" data-p="1" data-b="1" data-r="1">picks the next tool call</text><text class="sb" x="589" y="184" data-p="1" data-b="1" data-r="6">or answers in plain text</text><text class="sb" x="589" y="206" data-p="1" data-b="1" data-r="1">can run nothing itself</text><rect class="bx green" x="845" y="88" width="214" height="134" rx="8" data-p="1" data-b="2" data-r="6"/><text class="nm" x="863" y="118" data-p="1" data-b="2" data-r="6">No tool call: done</text><text class="sb green" x="863" y="140" data-p="1" data-b="2" data-r="6">the only built-in exit</text><text class="sb" x="863" y="162" data-p="1" data-b="2" data-r="6">“Done. Still due: water”</text><text class="sb" x="863" y="184" data-p="1" data-b="2" data-r="6">(example)</text><text class="sb" x="863" y="206" data-p="1" data-b="2" data-r="6">4 of the 6 calls used</text><rect class="bx amber" x="38" y="266" width="202" height="134" rx="8" data-p="1" data-b="2"/><text class="nm" x="56" y="296" data-p="1" data-b="2">Exits your code adds</text><text class="sb" x="56" y="318" data-p="1" data-b="2">6 calls → LOOP_LIMIT</text><text class="sb" x="56" y="340" data-p="1" data-b="2">person leaves → stop now</text><text class="sb" x="56" y="362" data-p="1" data-b="2">blocked reply → AI_FAILED</text><text class="sb amber" x="56" y="384" data-p="1" data-b="2">no money cap, no deadline</text><rect class="bx" x="296" y="266" width="219" height="134" rx="8" data-p="1" data-b="3" data-r="2"/><text class="nm" x="314" y="296" data-p="1" data-b="3" data-r="2">A read: run now</text><text class="sb mono" x="314" y="318" data-p="1" data-b="3" data-r="2">find_bills → b42, v3</text><text class="sb" x="314" y="340" data-p="1" data-b="3" data-r="2">(example)</text><text class="sb" x="314" y="362" data-p="1" data-b="3" data-r="2">its result is part of</text><text class="sb" x="314" y="384" data-p="1" data-b="3" data-r="2">the next call</text><rect class="bx green" x="571" y="266" width="219" height="134" rx="8" data-p="1" data-b="3" data-r="1"/><text class="nm" x="589" y="296" data-p="1" data-b="3" data-r="1">On the allow-list?</text><text class="sb" x="589" y="318" data-p="1" data-b="3" data-r="1">46 tools declared</text><text class="sb" x="589" y="340" data-p="1" data-b="3" data-r="1">no → UNKNOWN_TOOL result</text><text class="sb green" x="589" y="362" data-p="1" data-b="3" data-r="2">every call id gets a result</text><text class="sb" x="589" y="384" data-p="1" data-b="3" data-r="2">or the provider refuses</text><rect class="bx green" x="845" y="266" width="214" height="134" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="863" y="296" data-p="1" data-b="3" data-r="3">A change: check it first</text><text class="sb" x="863" y="318" data-p="1" data-b="3" data-r="3">schema, bill in household</text><text class="sb" x="863" y="340" data-p="1" data-b="3" data-r="3">version still 3?</text><text class="sb" x="863" y="362" data-p="1" data-b="3" data-r="3">fail → CONFLICT, no card</text><text class="sb amber" x="863" y="384" data-p="1" data-b="3" data-r="3">2nd write → NOT_RUN</text><rect class="bx amber" x="38" y="476" width="202" height="134" rx="8" data-p="1" data-b="5" data-r="5"/><text class="nm" x="56" y="506" data-p="1" data-b="5" data-r="5">Approval is no reset</text><text class="sb" x="56" y="528" data-p="1" data-b="5" data-r="5">the count rides in the token</text><text class="sb" x="56" y="550" data-p="1" data-b="5" data-r="5">6 of 6 used → 1 last call</text><text class="sb" x="56" y="572" data-p="1" data-b="5" data-r="5">to say what happened</text><text class="sb amber" x="56" y="594" data-p="1" data-b="5" data-r="5">never a fresh 6</text><rect class="bx green" x="296" y="476" width="219" height="134" rx="8" data-p="1" data-b="5" data-r="5"/><text class="nm" x="314" y="506" data-p="1" data-b="5" data-r="5">Request 2: resume once</text><text class="sb" x="314" y="528" data-p="1" data-b="5" data-r="5">claim the id: 2nd click → 409</text><text class="sb" x="314" y="550" data-p="1" data-b="5" data-r="5">after 10 minutes → 410</text><text class="sb green" x="314" y="572" data-p="1" data-b="5" data-r="5">runs only the sealed call</text><text class="sb" x="314" y="594" data-p="1" data-b="5" data-r="5">count carries on: 2 of 6</text><rect class="bx" x="571" y="476" width="219" height="134" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="589" y="506" data-p="1" data-b="4" data-r="4">Confirmation card</text><text class="sb" x="589" y="528" data-p="1" data-b="4" data-r="4">built from the stored bill</text><text class="sb" x="589" y="550" data-p="1" data-b="4" data-r="4">the browser holds the token</text><text class="sb" x="589" y="572" data-p="1" data-b="4" data-r="4">but cannot read or change it</text><text class="sb" x="589" y="594" data-p="1" data-b="4" data-r="4">the person presses Approve</text><rect class="bx red" x="845" y="476" width="214" height="134" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="863" y="506" data-p="1" data-b="4" data-r="4">Seal the turn in a token</text><text class="sb" x="863" y="528" data-p="1" data-b="4" data-r="4">transcript, results, count,</text><text class="sb" x="863" y="550" data-p="1" data-b="4" data-r="4">the checked arguments</text><text class="sb" x="863" y="572" data-p="1" data-b="4" data-r="4">AES-256-GCM, 10 minutes</text><text class="sb red" x="863" y="594" data-p="1" data-b="4" data-r="4">request ends, nothing written</text><rect class="bx green" x="38" y="702" width="477" height="112" rx="8" data-p="1" data-b="6"/><text class="nm" x="56" y="732" data-p="1" data-b="6">Workflow: your code fixes the order of calls</text><text class="sb" x="56" y="754" data-p="1" data-b="6">chain, route, parallel, orchestrator-workers, evaluator-optimizer</text><text class="sb green" x="56" y="776" data-p="1" data-b="6">use one whenever you can draw the flowchart</text><text class="sb" x="56" y="798" data-p="1" data-b="6">a judgement that must be reliable stays outside the loop</text><rect class="bx blue" x="571" y="702" width="219" height="112" rx="8" data-p="1" data-b="6"/><text class="nm" x="589" y="732" data-p="1" data-b="6">Agent loop</text><text class="sb blue" x="589" y="754" data-p="1" data-b="6">about 4× a chat's tokens</text><text class="sb" x="589" y="776" data-p="1" data-b="6">for steps no one can list</text><text class="sb" x="589" y="798" data-p="1" data-b="6">ahead of time</text><rect class="bx amber" x="845" y="702" width="214" height="112" rx="8" data-p="1" data-b="6"/><text class="nm" x="863" y="732" data-p="1" data-b="6">Multi-agent system</text><text class="sb amber" x="863" y="754" data-p="1" data-b="6">about 15× a chat's tokens</text><text class="sb" x="863" y="776" data-p="1" data-b="6">agents hand subtasks to</text><text class="sb" x="863" y="798" data-p="1" data-b="6">agents with own transcripts</text><path class="ar" d="M240,144 L292,144" marker-end="url(#agents-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar blue" d="M515,155 L567,155" marker-end="url(#agents-map-b)" data-p="1" data-b="1" data-base="1"/><path class="ar blue" d="M789,155 L841,155" marker-end="url(#agents-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M680,222 L680,262" marker-end="url(#agents-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M571,333 L519,333" marker-end="url(#agents-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M789,333 L841,333" marker-end="url(#agents-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M405,266 L405,226" marker-end="url(#agents-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M953,400 L953,472" marker-end="url(#agents-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar red" d="M845,543 L793,543" marker-end="url(#agents-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar red" d="M571,543 L519,543" marker-end="url(#agents-map-r)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M296,543 L268,543 L268,244 L340,244 L340,226" marker-end="url(#agents-map-a)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M240,144 L292,144" marker-end="url(#agents-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar blue" d="M515,145 L567,145" marker-end="url(#agents-map-b)" data-p="1" data-r="1" data-route="1"/><path class="