<svg class="vz" viewBox="0 0 1229 990" role="img" aria-label="Every model call goes through one wrapper. In the example, Google moves the alias gemini-flash-latest to a preview model, and the grading feature marks a correct answer wrong while the call returns 200 in 1.4 seconds, so latency and error monitoring see nothing. The wrapper writes a call record with the prompt version and the model that answered, stores the redacted prompt and reply of every call for 14 days, and sends a 2% sample to a queue. A pinned checker model scores the sample, a nightly job compares the daily agreement rate with its alert line, and the owner finds that the response model changed. Pinning the model and replaying the stored prompts fixes it." data-vz="map"><defs><marker id="observability-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="observability-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="observability-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="observability-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="observability-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="observability-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">A wrong answer returns 200, so record every call and score a sample to catch it</text><text class="zl" x="38" y="70">THE REQUEST PATH</text><text class="zl" x="955" y="70">WHAT MONITORING SEES</text><rect class="zone" x="24" y="276" width="1181" height="244" rx="10" data-p="1" data-b="2" data-r="2"/><text class="zn" x="40" y="296" data-p="1" data-b="2" data-r="2">written for every call</text><rect class="zone" x="658" y="568" width="547" height="178" rx="10" data-p="1" data-b="3" data-r="3"/><text class="zn" x="674" y="588" data-p="1" data-b="3" data-r="3">off the request path</text><rect class="bx" x="38" y="88" width="284" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="118" data-p="1" data-b="1" data-r="1">Grading feature</text><text class="sb" x="56" y="140" data-p="1" data-b="1" data-r="1">"Eu sou um barista."</text><text class="sb green" x="56" y="162" data-p="1" data-b="1" data-r="1">correct Portuguese</text><text class="sb" x="56" y="184" data-p="1" data-b="1" data-r="1">asks the model to grade</text><rect class="bx red" x="378" y="88" width="239" height="144" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="396" y="118" data-p="1" data-b="1" data-r="1">One wrapper</text><text class="sb" x="396" y="140" data-p="1" data-b="1" data-r="1">every model call goes through it</text><text class="sb" x="396" y="162" data-p="1" data-b="1" data-r="1">after each call, failures too,</text><text class="sb" x="396" y="184" data-p="1" data-b="1" data-r="1">writes the 3 things below</text><text class="sb green" x="396" y="216" data-p="1" data-b="5" data-r="6">fix: requests <tspan class="mono">gemini-2.5-flash</tspan></text><rect class="bx blue" x="672" y="88" width="226" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="690" y="118" data-p="1" data-b="1" data-r="1">Gemini</text><text class="sb" x="690" y="140" data-p="1" data-b="1" data-r="1">asked: <tspan class="mono">gemini-flash-latest</tspan></text><text class="sb" x="690" y="162" data-p="1" data-b="1" data-r="1">an alias Google can move</text><text class="sb red" x="690" y="184" data-p="1" data-b="1" data-r="1">replies 200, grade: wrong</text><rect class="bx amber" x="955" y="88" width="237" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="973" y="118" data-p="1" data-b="1" data-r="1">Latency and errors</text><text class="sb" x="973" y="140" data-p="1" data-b="1" data-r="1">1.4 s, HTTP 200</text><text class="sb" x="973" y="162" data-p="1" data-b="1" data-r="1">error tracker empty</text><text class="sb amber" x="973" y="184" data-p="1" data-b="1" data-r="1">no alert fires</text><rect class="bx" x="38" y="308" width="284" height="200" rx="8" data-p="1" data-b="2" data-r="2"/><text class="nm" x="56" y="338" data-p="1" data-b="2" data-r="2">Call record (example)</text><text class="sb" x="56" y="360" data-p="1" data-b="2" data-r="2">one log line, kept as long as logs</text><text class="sb" x="56" y="382" data-p="1" data-b="2" data-r="2"><tspan class="mono">prompt_version 14</tspan></text><text class="sb" x="56" y="404" data-p="1" data-b="2" data-r="2">model asked, and model that answered:</text><text class="sb red" x="56" y="426" data-p="1" data-b="2" data-r="2"><tspan class="mono">gemini-2.5-flash-preview-09-2025</tspan></text><text class="sb" x="56" y="448" data-p="1" data-b="2" data-r="2">tokens 912 in, 640 cached, 38 out</text><text class="sb" x="56" y="470" data-p="1" data-b="2" data-r="2">cost $0.000196, latency 1412 ms</text><text class="sb" x="56" y="492" data-p="1" data-b="2" data-r="2">finish reason, grade, trace ID</text><rect class="bx" x="378" y="308" width="521" height="144" rx="8" data-p="1" data-b="2" data-r="2"/><text class="nm" x="396" y="338" data-p="1" data-b="2" data-r="2">Redacted prompt and reply</text><text class="sb" x="396" y="360" data-p="1" data-b="2" data-r="2">every call, not only the sample</text><text class="sb" x="396" y="382" data-p="1" data-b="2" data-r="2">names → &lt;PERSON&gt;, emails → &lt;EMAIL&gt;</text><text class="sb amber" x="396" y="404" data-p="1" data-b="2" data-r="2">kept 14 days, on-call only</text><text class="sb" x="396" y="436" data-p="1" data-b="2" data-r="5">the owner reads the 5 reported calls</text><rect class="bx" x="955" y="308" width="237" height="144" rx="8" data-p="1" data-b="2" data-r="3"/><text class="nm" x="973" y="338" data-p="1" data-b="2" data-r="3">2% sample, to a queue</text><text class="sb" x="973" y="360" data-p="1" data-b="2" data-r="3"><tspan class="mono">hash(trace ID) mod 100 &lt; 2</tspan></text><text class="sb" x="973" y="382" data-p="1" data-b="2" data-r="3">only calls that ended normally</text><text class="sb" x="973" y="404" data-p="1" data-b="2" data-r="3">≈200 scored a day: ±1.5 points</text><text class="sb amber" x="973" y="436" data-p="1" data-b="2" data-r="3">never scored inside the request</text><rect class="bx" x="38" y="600" width="284" height="156" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="56" y="630" data-p="1" data-b="4" data-r="4">Owner</text><text class="sb" x="56" y="652" data-p="1" data-b="4" data-r="5">groups by <tspan class="mono">prompt_version</tspan></text><text class="sb" x="56" y="674" data-p="1" data-b="4" data-r="5">and response model:</text><text class="sb" x="56" y="696" data-p="1" data-b="4" data-r="5">v14 both days, so no edit</text><text class="sb red" x="56" y="718" data-p="1" data-b="4" data-r="5">graded wrong: 4% → 19%</text><text class="sb red" x="56" y="740" data-p="1" data-b="4" data-r="5">on the preview model</text><rect class="bx red" x="378" y="600" width="239" height="134" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="396" y="630" data-p="1" data-b="4" data-r="4">Nightly job, 06:00</text><text class="sb" x="396" y="652" data-p="1" data-b="4" data-r="4">daily agreement rate</text><text class="sb" x="396" y="674" data-p="1" data-b="4" data-r="4">alert line 0.92 =</text><text class="sb" x="396" y="696" data-p="1" data-b="4" data-r="4">30-day mean − 3 SD</text><text class="sb red" x="396" y="718" data-p="1" data-b="4" data-r="4">Monday 0.81: alert</text><rect class="bx" x="672" y="600" width="226" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="690" y="630" data-p="1" data-b="3" data-r="3"><tspan class="mono">llm_eval</tspan></text><text class="sb" x="690" y="652" data-p="1" data-b="3" data-r="3">one score per trace</text><text class="sb" x="690" y="674" data-p="1" data-b="3" data-r="3">no text, so it is</text><text class="sb" x="690" y="696" data-p="1" data-b="3" data-r="3">kept for months</text><rect class="bx blue" x="955" y="600" width="237" height="134" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="973" y="630" data-p="1" data-b="3" data-r="3">Checker model</text><text class="sb" x="973" y="652" data-p="1" data-b="3" data-r="3">second model, pinned version</text><text class="sb" x="973" y="674" data-p="1" data-b="3" data-r="3">reads redacted text + rubric</text><text class="sb" x="973" y="696" data-p="1" data-b="3" data-r="3">AGREE = 1, DISAGREE = 0</text><text class="sb amber" x="973" y="718" data-p="1" data-b="3" data-r="3">billed under its own feature</text><rect class="bx green" x="38" y="816" width="861" height="90" rx="8" data-p="1" data-b="5" data-r="6"/><text class="nm" x="56" y="846" data-p="1" data-b="5" data-r="6">Fix (example)</text><text class="sb" x="56" y="868" data-p="1" data-b="5" data-r="6">Request the pinned <tspan class="mono">gemini-2.5-flash</tspan>, never an alias. Replay the 5 stored prompts 10 times each.</text><text class="sb green" x="56" y="890" data-p="1" data-b="5" data-r="6">50 of 50 runs pass. The barista case joins the test set.</text><path class="ar" d="M322,144 L374,144" marker-end="url(#observability-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar blue" d="M616,130 L668,130" marker-end="url(#observability-map-b)" data-p="1" data-b="1" data-base="1"/><path class="ar red" d="M672,158 L620,158" marker-end="url(#observability-map-r)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M899,144 L951,144" marker-end="url(#observability-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M468,232 L468,252 L272,252 L272,304" marker-end="url(#observability-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M497,232 L497,304" marker-end="url(#observability-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M528,232 L528,252 L1074,252 L1074,304" marker-end="url(#observability-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M839,452 L839,482 L1005,482 L1005,596" marker-end="url(#observability-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M1073,452 L1073,596" marker-end="url(#observability-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M955,656 L903,656" marker-end="url(#observability-map-a)" data-p="1" data-b="3" data-base="1"/><path class="ar" d="M672,656 L620,656" marker-end="url(#observability-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M322,484 L428,484 L428,596" marker-end="url(#observability-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar red" d="M378,667 L326,667" marker-end="url(#observability-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M180,600 L180,512" marker-end="url(#observability-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M180,756 L180,812" marker-end="url(#observability-map-g)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M322,144 L374,144" marker-end="url(#observability-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar blue" d="M616,130 L668,130" marker-end="url(#observability-map-b)" data-p="1" data-r="1" data-route="1"/><path class="ar red" d="M672,158 L620,158" marker-end="url(#observability-map-r)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M899,144 L951,144" marker-end="url(#observability-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M468,232 L468,252 L272,252 L272,304" marker-end="url(#observability-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M497,232 L497,304" marker-end="url(#observability-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar" d="M528,232 L528,252 L1074,252 L1074,304" marker-end="url(#observability-map-a)" data-p="1" data-r="3" data-route="1"/><path class="ar blue" d="M839,452 L839,482 L1005,482 L1005,596" marker-end="url(#observability-map-b)" data-p="1" data-r="3" data-route="1"/><path class="ar red" d="M955,656 L903,656" marker-end="url(#observability-map-r)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M672,656 L620,656" marker-end="url(#observability-map-a)" data-p="1" data-r="4" data-route="1"/><path class="ar red" d="M378,667 L326,667" marker-end="url(#observability-map-r)" data-p="1" data-r="4" data-route="1"/><path class="ar" d="M180,600 L180,512" marker-end="url(#observability-map-a)" data-p="1" data-r="5" data-route="1"/><path class="ar green" d="M180,756 L180,812" marker-end="url(#observability-map-g)" data-p="1" data-r="6" data-route="1"/><text class="lb" x="440" y="545" data-p="1" data-b="4" data-base="1">joined by trace ID</text><text class="lb" x="192" y="561" data-p="1" data-b="4" data-base="1">group by version</text><circle class="bd solid" cx="637" cy="130" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="637" y="134.5" data-p="1" data-r="1" data-route="1">1</text><circle class="bd solid" cx="651" cy="158" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="651" y="162.5" data-p="1" data-r="1" data-route="1">1</text><circle class="bd solid" cx="447" cy="252" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="447" y="256.5" data-p="1" data-r="2" data-route="1">2</text><circle class="bd solid" cx="497" cy="253" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="497" y="257.5" data-p="1" data-r="2" data-route="1">2</text><circle class="bd solid" cx="549" cy="252" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="549" y="256.5" data-p="1" data-r="3" data-route="1">3</text><circle class="bd solid" cx="860" cy="482" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="860" y="486.5" data-p="1" data-r="3" data-route="1">3</text><circle class="bd solid" cx="934" cy="656" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="934" y="660.5" data-p="1" data-r="3" data-route="1">3</text><circle class="bd solid" cx="651" cy="656" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="651" y="660.5" data-p="1" data-r="4" data-route="1">4</text><circle class="bd solid" cx="357" cy="667" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="357" y="671.5" data-p="1" data-r="4" data-route="1">4</text><circle class="bd solid" cx="180" cy="579" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="180" y="583.5" data-p="1" data-r="5" data-route="1">5</text><circle class="bd solid" cx="180" cy="777" r="11" data-p="1" data-r="6" data-route="1"/><text class="n" x="180" y="781.5" data-p="1" data-r="6" data-route="1">6</text><line class="ar blue" x1="24" y1="954.0" x2="58" y2="954.0" marker-end="url(#observability-map-b)"/><text class="sb" x="68" y="958">a model call</text><line class="ar red" x1="171.5046" y1="954.0" x2="205.5046" y2="954.0" marker-end="url(#observability-map-r)"/><text class="sb" x="216" y="958">the wrong grade, its alert</text><line class="ar" x1="399.51430000000005" y1="954.0" x2="433.51430000000005" y2="954.0" marker-end="url(#observability-map-a)"/><text class="sb" x="444" y="958">records and data</text><line class="ar green" x1="577.9875000000001" y1="954.0" x2="611.9875000000001" y2="954.0" marker-end="url(#observability-map-g)"/><text class="sb" x="622" y="958">the fix</text></svg>