<svg class="ov-svg" viewBox="0 0 1120 910" role="img" aria-label="Every model call goes through one wrapper. In the example, Google moves the alias gemini-flash-latest to a preview model, and the grading feature marks a correct answer wrong while the call returns 200 in 1.4 seconds, so latency and error monitoring see nothing. The wrapper writes a call record with the prompt version and the model that answered, stores the redacted prompt and reply of every call for 14 days, and sends a 2% sample to a queue. A pinned checker model scores the sample, a nightly job compares the daily agreement rate with its alert line, and the owner finds that the response model changed. Pinning the model and replaying the stored prompts fixes it.">
<defs>
<marker id="observability-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="observability-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="observability-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
<marker id="observability-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker>
</defs>
<text class="ttl" x="24" y="38">A wrong answer returns 200, so record every call and score a sample to catch it</text>

<text class="zl" x="24" y="94">THE REQUEST PATH</text>
<text class="zl" x="872" y="94">WHAT MONITORING SEES</text>

<!-- request path -->
<rect class="bx" x="24" y="120" width="200" height="120" rx="8"/>
<text class="nm" x="42" y="152">Grading feature</text>
<text class="sb" x="42" y="176">"Eu sou um barista."</text>
<text class="sb green" x="42" y="198">correct Portuguese</text>
<text class="sb" x="42" y="220">asks the model to grade</text>

<rect class="bx red" x="270" y="120" width="250" height="120" rx="8"/>
<text class="nm" x="288" y="152">One wrapper</text>
<text class="sb" x="288" y="176">every model call goes through it</text>
<text class="sb" x="288" y="198">after each call, failures too,</text>
<text class="sb" x="288" y="220">writes the 3 things below</text>

<rect class="bx blue" x="566" y="120" width="260" height="120" rx="8"/>
<text class="nm" x="584" y="152">Gemini</text>
<text class="sb" x="584" y="176">asked: <tspan class="mono">gemini-flash-latest</tspan></text>
<text class="sb" x="584" y="198">an alias Google can move</text>
<text class="sb red" x="584" y="220">replies 200, grade: wrong</text>

<rect class="bx amber" x="872" y="120" width="224" height="120" rx="8"/>
<text class="nm" x="890" y="152">Latency and errors</text>
<text class="sb" x="890" y="176">1.4 s, HTTP 200</text>
<text class="sb" x="890" y="198">error tracker empty</text>
<text class="sb amber" x="890" y="220">no alert fires</text>

<line class="ar" x1="224" y1="180" x2="266" y2="180" marker-end="url(#observability-a)"/>
<line class="ar blue" x1="520" y1="162" x2="562" y2="162" marker-end="url(#observability-b)"/>
<line class="ar red" x1="566" y1="212" x2="524" y2="212" marker-end="url(#observability-r)"/>
<line class="ar" x1="826" y1="180" x2="868" y2="180" marker-end="url(#observability-a)"/>

<!-- written for every call -->
<text class="zl" x="24" y="276">WRITTEN FOR EVERY CALL</text>
<path class="ar" d="M395,240 V290 H194 V312" marker-end="url(#observability-a)"/>
<path class="ar" d="M395,240 V290 H565 V312" marker-end="url(#observability-a)"/>
<path class="ar" d="M395,240 V290 H931 V312" marker-end="url(#observability-a)"/>

<rect class="bx" x="24" y="316" width="340" height="220" rx="8"/>
<text class="nm" x="42" y="348">Call record (example)</text>
<text class="sb" x="42" y="372">one log line, kept as long as logs</text>
<text class="sb mono" x="42" y="396">prompt_version 14</text>
<text class="sb" x="42" y="420">model asked, and model that answered:</text>
<text class="sb mono red" x="42" y="444">gemini-2.5-flash-preview-09-2025</text>
<text class="sb" x="42" y="468">tokens 912 in, 640 cached, 38 out</text>
<text class="sb" x="42" y="490">cost $0.000196, latency 1412 ms</text>
<text class="sb" x="42" y="512">finish reason, grade, trace ID</text>

<rect class="bx" x="400" y="316" width="330" height="160" rx="8"/>
<text class="nm" x="418" y="348">Redacted prompt and reply</text>
<text class="sb" x="418" y="372">every call, not only the sample</text>
<text class="sb" x="418" y="394">names → &lt;PERSON&gt;, emails → &lt;EMAIL&gt;</text>
<text class="sb amber" x="418" y="416">kept 14 days, on-call only</text>
<text class="sb" x="418" y="446">the owner reads the 5 reported calls</text>

<rect class="bx" x="766" y="316" width="330" height="160" rx="8"/>
<text class="nm" x="784" y="348">2% sample, to a queue</text>
<text class="sb mono" x="784" y="372">hash(trace ID) mod 100 &lt; 2</text>
<text class="sb" x="784" y="394">only calls that ended normally</text>
<text class="sb" x="784" y="416">≈200 scored a day: ±1.5 points</text>
<text class="sb amber" x="784" y="446">never scored inside the request</text>

<!-- off the request path -->
<text class="zl" x="590" y="584">OFF THE REQUEST PATH</text>
<path class="ar blue" d="M690,476 V560 H870 V596" marker-end="url(#observability-b)"/>
<line class="ar" x1="1000" y1="476" x2="1000" y2="596" marker-end="url(#observability-a)"/>
<line class="ar" x1="340" y1="536" x2="340" y2="596" marker-end="url(#observability-a)"/>
<text class="lb" x="350" y="572">joined by trace ID</text>
<line class="ar" x1="137" y1="600" x2="137" y2="540" marker-end="url(#observability-a)"/>
<text class="lb" x="147" y="572">group by version</text>

<rect class="bx blue" x="820" y="600" width="276" height="140" rx="8"/>
<text class="nm" x="838" y="632">Checker model</text>
<text class="sb" x="838" y="656">second model, pinned version</text>
<text class="sb" x="838" y="678">reads redacted text + rubric</text>
<text class="sb" x="838" y="700">AGREE = 1, DISAGREE = 0</text>
<text class="sb amber" x="838" y="724">billed under its own feature</text>

<rect class="bx" x="590" y="600" width="194" height="120" rx="8"/>
<text class="nm mono" x="608" y="632">llm_eval</text>
<text class="sb" x="608" y="656">one score per trace</text>
<text class="sb" x="608" y="678">no text, so it is</text>
<text class="sb" x="608" y="700">kept for months</text>

<rect class="bx red" x="310" y="600" width="244" height="150" rx="8"/>
<text class="nm" x="328" y="632">Nightly job, 06:00</text>
<text class="sb" x="328" y="656">daily agreement rate</text>
<text class="sb" x="328" y="678">alert line 0.92 =</text>
<text class="sb" x="328" y="700">30-day mean − 3 SD</text>
<text class="sb red" x="328" y="726">Monday 0.81: alert</text>

<rect class="bx" x="24" y="600" width="250" height="170" rx="8"/>
<text class="nm" x="42" y="632">Owner</text>
<text class="sb" x="42" y="656">groups by prompt_version</text>
<text class="sb" x="42" y="678">and response model:</text>
<text class="sb" x="42" y="700">v14 both days, so no edit</text>
<text class="sb red" x="42" y="726">graded wrong: 4% → 19%</text>
<text class="sb red" x="42" y="748">on the preview model</text>

<line class="ar" x1="820" y1="660" x2="788" y2="660" marker-end="url(#observability-a)"/>
<line class="ar" x1="590" y1="660" x2="558" y2="660" marker-end="url(#observability-a)"/>
<line class="ar red" x1="310" y1="660" x2="278" y2="660" marker-end="url(#observability-r)"/>

<!-- fix -->
<rect class="bx green" x="24" y="800" width="772" height="96" rx="8"/>
<text class="nm" x="42" y="830">Fix (example)</text>
<text class="sb" x="42" y="854">Request the pinned <tspan class="mono">gemini-2.5-flash</tspan>, never an alias. Replay the 5 stored prompts 10 times each.</text>
<text class="sb green" x="42" y="876">50 of 50 runs pass. The barista case joins the test set.</text>
<line class="ar green" x1="137" y1="770" x2="137" y2="796" marker-end="url(#observability-g)"/>

<!-- legend -->
<line class="ar blue" x1="830" y1="810" x2="866" y2="810" marker-end="url(#observability-b)"/>
<text class="sb" x="876" y="814">a model call</text>
<line class="ar red" x1="830" y1="836" x2="866" y2="836" marker-end="url(#observability-r)"/>
<text class="sb" x="876" y="840">the wrong grade, its alert</text>
<line class="ar" x1="830" y1="862" x2="866" y2="862" marker-end="url(#observability-a)"/>
<text class="sb" x="876" y="866">records and data</text>
<line class="ar green" x1="830" y1="888" x2="866" y2="888" marker-end="url(#observability-g)"/>
<text class="sb" x="876" y="892">the fix</text>
</svg>
