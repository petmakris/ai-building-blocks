<svg class="vz" viewBox="0 0 837 1246" role="img" aria-label="The golden check misses its bar by one row, so the underlines stay off" data-vz="sequence"><defs><marker id="evals-seq-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="evals-seq-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="evals-seq-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="evals-seq-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="evals-seq-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="evals-seq-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">The golden check misses its bar by one row, so the underlines stay off</text><text class="sub" x="24" y="62">Lomem's gate for the new grading prompt. The two misses in step 4 are an example.</text><line class="life" x1="102" y1="132" x2="102" y2="254"/><line class="life" x1="278" y1="132" x2="278" y2="1148"/><line class="life" x1="102" y1="316" x2="102" y2="459"/><line class="life" x1="102" y1="521" x2="102" y2="1148"/><line class="life" x1="442" y1="132" x2="442" y2="1148"/><rect class="bx" x="24" y="78" width="157" height="54" rx="8"/><text class="nm" x="102" y="101" text-anchor="middle">Dataset</text><text class="sb" x="102" y="120" text-anchor="middle">200 real + 36 golden</text><rect class="bx red" x="203" y="78" width="151" height="54" rx="8"/><text class="nm" x="278" y="101" text-anchor="middle">Gate</text><text class="sb red" x="278" y="120" text-anchor="middle">a script run by hand</text><rect class="bx blue" x="27" y="262" width="151" height="54" rx="8"/><text class="nm" x="102" y="285" text-anchor="middle">Model</text><text class="sb blue" x="102" y="304" text-anchor="middle">old and new prompt</text><rect class="bx green" x="29" y="467" width="146" height="54" rx="8"/><text class="nm" x="102" y="490" text-anchor="middle">Checks</text><text class="sb green" x="102" y="509" text-anchor="middle">a bar each, set first</text><rect class="bx" x="375" y="78" width="133" height="54" rx="8"/><text class="nm" x="442" y="101" text-anchor="middle">Person</text><text class="sb" x="442" y="120" text-anchor="middle">reads every miss</text><g data-step="s1" data-p="1" data-r="1"><rect class="chip" x="86" y="150" width="218" height="35" rx="6"/><text class="lb" x="195" y="172" text-anchor="middle">up to 200 real + 36 golden rows</text><line class="ar" x1="116" y1="191" x2="274" y2="191" marker-end="url(#evals-seq-a)"/><circle class="bd solid" cx="102" cy="191" r="10"/><text class="n" x="102" y="195.5">1</text></g><g data-step="s2" data-p="1" data-r="1"><path class="ar" d="M278,219 H290 V238 H282" marker-end="url(#evals-seq-a)"/><rect class="chip" x="294" y="211" width="203" height="35" rx="6"/><text class="sb" x="304" y="233">skip exact matches to the key</text></g><g data-step="s3" data-p="1" data-r="2"><rect class="chip blue" x="86" y="332" width="199" height="54" rx="6"/><text class="lb" x="185" y="354" text-anchor="middle">old prompt, then new prompt</text><text class="lb mono" x="185" y="373" text-anchor="middle">≈470 paid calls</text><line class="ar blue" x1="264" y1="392" x2="106" y2="392" marker-end="url(#evals-seq-b)"/><circle class="bd solid" cx="278" cy="392" r="10"/><text class="n" x="278" y="396.5">2</text></g><g data-step="s4" data-p="1" data-r="2"><text class="lb blue" x="189" y="440" text-anchor="middle">old verdict; new verdict + underlines, timed</text><line class="ar blue dash" x1="104" y1="420" x2="274" y2="420" marker-end="url(#evals-seq-b)"/></g><g data-step="s5" data-p="1" data-r="3"><rect class="chip" x="87" y="537" width="197" height="35" rx="6"/><text class="lb" x="185" y="559" text-anchor="middle">real rows: old vs new verdict</text><line class="ar" x1="264" y1="578" x2="106" y2="578" marker-end="url(#evals-seq-a)"/><circle class="bd solid" cx="278" cy="578" r="10"/><text class="n" x="278" y="582.5">3</text></g><g data-step="s6" data-p="1" data-r="3"><path class="ar red" d="M102,606 H114 V644 H106" marker-end="url(#evals-seq-r)"/><rect class="chip red" x="118" y="598" width="205" height="54" rx="6"/><text class="sb" x="128" y="620">change check, bar 95% agree</text><text class="sb mono" x="128" y="639">a break, or a fix?</text></g><g data-step="s7" data-p="1" data-r="4"><rect class="chip green" x="77" y="668" width="217" height="35" rx="6"/><text class="lb" x="185" y="690" text-anchor="middle">golden rows vs person's verdict</text><line class="ar green" x1="264" y1="709" x2="106" y2="709" marker-end="url(#evals-seq-g)"/><circle class="bd solid" cx="278" cy="709" r="10"/><text class="n" x="278" y="713.5">4</text><rect class="chip red" x="24" y="719" width="98" height="24" rx="12"/><text class="sb red" x="73" y="736" text-anchor="middle">✗ 95% right</text><rect class="chip green" x="130" y="719" width="165" height="24" rx="12"/><text class="sb green" x="212" y="736" text-anchor="middle">✓ 0 paraphrase misses</text></g><g data-step="s8" data-p="1" data-r="4"><text class="lb red" x="189" y="789" text-anchor="middle">34 of 36 right, just under 95%</text><text class="lb mono red" x="189" y="808" text-anchor="middle">negation lost · article error</text><line class="ar red dash" x1="104" y1="769" x2="274" y2="769" marker-end="url(#evals-seq-r)"/></g><g data-step="s9" data-p="1" data-r="5"><path class="ar" d="M102,843 H114 V862 H106" marker-end="url(#evals-seq-a)"/><rect class="chip" x="134" y="835" width="211" height="35" rx="6"/><text class="sb" x="144" y="857">underlines land: 95% of replies</text><circle class="bd solid" cx="102" cy="852" r="10"/><text class="n" x="102" y="857.0">5</text></g><g data-step="s10" data-p="1" data-r="5"><path class="ar" d="M102,894 H114 V913 H106" marker-end="url(#evals-seq-a)"/><rect class="chip" x="118" y="886" width="168" height="35" rx="6"/><text class="sb" x="128" y="908">speed: 95% within 2.5 s</text></g><g data-step="s11" data-p="1" data-r="6"><rect class="chip" x="172" y="937" width="210" height="35" rx="6"/><text class="lb" x="277" y="959" text-anchor="middle">PASS/FAIL per check + misses</text><line class="ar" x1="116" y1="978" x2="438" y2="978" marker-end="url(#evals-seq-a)"/><circle class="bd solid" cx="102" cy="978" r="10"/><text class="n" x="102" y="982.5">6</text></g><g data-step="s12" data-p="1" data-r="6"><path class="ar green" d="M442,1006 H454 V1044 H446" marker-end="url(#evals-seq-g)"/><rect class="chip green" x="458" y="998" width="181" height="54" rx="6"/><text class="sb" x="468" y="1020">golden FAIL: flag stays off</text><text class="sb mono" x="468" y="1039">TD_JUDGE_MARKS=false</text></g><g data-step="s13" data-p="1" data-r="6"><rect class="chip amber" x="275" y="1068" width="171" height="54" rx="6"/><text class="lb" x="361" y="1090" text-anchor="middle">fix the prompt, run again</text><text class="lb mono" x="361" y="1109" text-anchor="middle">the bar stays</text><line class="ar amber" x1="440" y1="1128" x2="282" y2="1128" marker-end="url(#evals-seq-m)"/></g><rect class="bx red" x="24" y="1154" width="789" height="68" rx="8" data-p="1" data-r="6"/><text class="nm red" x="42" y="1182" data-p="1" data-r="6">FAIL: the underlines stay off</text><text class="sb" x="42" y="1206" data-p="1" data-r="6">The golden check needs 95% right and got 34 of 36. The bar was set before the run, so the prompt is fixed, never the bar.</text></svg>