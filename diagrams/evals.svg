<svg class="ov-svg" viewBox="0 0 1120 820" role="img" aria-label="An eval gate for a new grading prompt. Up to 200 real learner answers and 36 golden rows that a person labelled run through the old and the new prompt. Real rows are scored against the old verdict, which shows only change. Golden rows are scored against the person's verdict, which shows correctness. Each of four checks has its own bar set before the run. A person reads the results, keeps the feature flag off on a miss, fixes the prompt and never the bar, and moves real-row fixes into the golden rows. A 2-point gap between prompts on 200 rows is within noise.">
<defs>
<marker id="evals-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="evals-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="evals-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker>
<marker id="evals-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker>
</defs>
<text class="ttl" x="24" y="38">Real rows show change, golden rows show correctness, each check has its own bar</text>

<text class="zl" x="24" y="94">THE ROWS</text>
<text class="zl" x="298" y="94">THE MODEL</text>
<text class="zl" x="588" y="94">THE CHECKS · BARS SET BEFORE THE RUN</text>
<text class="zl" x="908" y="94">THE DECISION</text>

<!-- rows -->
<rect class="bx" x="24" y="124" width="230" height="108" rx="8"/>
<text class="nm" x="42" y="156">Real rows</text>
<text class="sb" x="42" y="180">up to 200 learner answers</text>
<text class="sb" x="42" y="202">no person's label</text>
<text class="sb" x="42" y="224">old verdict is the reference</text>

<rect class="bx green" x="24" y="248" width="230" height="150" rx="8"/>
<text class="nm" x="42" y="280">Golden rows</text>
<text class="sb" x="42" y="304">36 rows a person labelled</text>
<text class="sb green" x="42" y="326">15 paraphrases must be right</text>
<text class="sb" x="42" y="348">21 errors must be wrong</text>
<text class="sb" x="42" y="378">note: <tspan class="mono">negation lost</tspan></text>

<!-- model -->
<rect class="bx blue" x="298" y="170" width="240" height="180" rx="8"/>
<text class="nm" x="316" y="202">Model, two prompts</text>
<text class="sb" x="316" y="226">old: frozen card prompt</text>
<text class="sb blue" x="316" y="248">new: arc prompt + underlines</text>
<text class="sb" x="316" y="270">same rows for both</text>
<text class="sb amber" x="316" y="304">≈470 paid calls a run</text>
<text class="sb amber" x="316" y="326">temperature 0.3: replies vary</text>

<!-- checks -->
<rect class="bx red" x="588" y="124" width="270" height="108" rx="8"/>
<text class="nm" x="606" y="156">1a · Real rows: old vs new</text>
<text class="sb" x="606" y="180">bar 95% agree</text>
<text class="sb red" x="606" y="202">shows change only</text>
<text class="sb" x="606" y="224">each disagreement: break or fix?</text>

<rect class="bx green" x="588" y="248" width="270" height="108" rx="8"/>
<text class="nm" x="606" y="280">1b · Golden rows: vs person</text>
<text class="sb" x="606" y="304">bar 95% right, 0 paraphrase misses</text>
<text class="sb green" x="606" y="326">shows correctness</text>
<text class="sb red" x="606" y="348">example: 34 of 36 right, FAIL</text>

<rect class="bx" x="588" y="372" width="270" height="64" rx="8"/>
<text class="nm" x="606" y="401">2 · Underlines land</text>
<text class="sb" x="606" y="424">95% land on the learner&#39;s words</text>

<rect class="bx" x="588" y="452" width="270" height="64" rx="8"/>
<text class="nm" x="606" y="481">3 · Underline is an error</text>
<text class="sb" x="606" y="504">90% of words, a person reads</text>

<rect class="bx" x="588" y="532" width="270" height="64" rx="8"/>
<text class="nm" x="606" y="561">4 · Speed</text>
<text class="sb" x="606" y="584">95% of new replies within 2.5 s</text>

<!-- decision -->
<rect class="bx green" x="908" y="150" width="188" height="100" rx="8"/>
<text class="nm" x="926" y="182">Feature flag</text>
<text class="sb mono" x="926" y="206">TD_JUDGE_MARKS</text>
<text class="sb green" x="926" y="230">false: underlines off</text>

<rect class="bx" x="908" y="300" width="188" height="120" rx="8"/>
<text class="nm" x="926" y="332">A person</text>
<text class="sb" x="926" y="356">reads every check</text>
<text class="sb" x="926" y="378">and every miss</text>
<text class="sb" x="926" y="400">decides; no exit code</text>

<!-- noise -->
<rect class="bx amber" x="24" y="700" width="780" height="96" rx="8"/>
<text class="nm" x="42" y="732">Small gaps are noise</text>
<text class="sb" x="42" y="756">200 rows: the rate lands within ±3 points of the true rate 95% of the time. 40 rows: ±7 points.</text>
<text class="sb amber" x="42" y="778">Example: 96% vs 94% on 200 rows proves nothing. Run both prompts on the same rows, read each flipped row.</text>

<!-- legend -->
<line class="ar blue" x1="840" y1="712" x2="876" y2="712" marker-end="url(#evals-b)"/>
<text class="sb" x="886" y="716">a model call</text>
<line class="ar" x1="840" y1="738" x2="876" y2="738" marker-end="url(#evals-a)"/>
<text class="sb" x="886" y="742">verdicts and results</text>
<line class="ar amber dash" x1="840" y1="764" x2="876" y2="764" marker-end="url(#evals-m)"/>
<text class="sb" x="886" y="768">fix and run again</text>
<line class="ar green dash" x1="840" y1="790" x2="876" y2="790" marker-end="url(#evals-g)"/>
<text class="sb" x="886" y="794">a row moves to golden</text>

<!-- rows into the model -->
<line class="ar blue" x1="254" y1="200" x2="294" y2="200" marker-end="url(#evals-b)"/>
<line class="ar blue" x1="254" y1="320" x2="294" y2="320" marker-end="url(#evals-b)"/>

<!-- model to checks -->
<path class="ar" d="M538,260 H563 V178 H584" marker-end="url(#evals-a)"/>
<path class="ar" d="M538,260 H563 V302 H584" marker-end="url(#evals-a)"/>
<path class="ar" d="M538,260 H563 V404 H584" marker-end="url(#evals-a)"/>
<path class="ar" d="M538,260 H563 V484 H584" marker-end="url(#evals-a)"/>
<path class="ar" d="M538,260 H563 V564 H584" marker-end="url(#evals-a)"/>

<!-- checks to the person -->
<path class="ar" d="M858,178 H883 V365 H904" marker-end="url(#evals-a)"/>
<path class="ar" d="M858,302 H883 V365 H904" marker-end="url(#evals-a)"/>
<path class="ar" d="M858,404 H883 V365 H904" marker-end="url(#evals-a)"/>
<path class="ar" d="M858,484 H883 V365 H904" marker-end="url(#evals-a)"/>
<path class="ar" d="M858,564 H883 V365 H904" marker-end="url(#evals-a)"/>

<!-- person to flag -->
<line class="ar green" x1="1002" y1="300" x2="1002" y2="254" marker-end="url(#evals-g)"/>
<text class="lb" x="1012" y="281">if all pass</text>

<!-- loops back -->
<path class="ar amber dash" d="M980,420 V632 H418 V354" marker-end="url(#evals-m)"/>
<text class="lb amber" x="700" y="624" text-anchor="middle">a miss: fix the prompt, never the bar, and run again</text>
<path class="ar green dash" d="M1040,420 V664 H139 V402" marker-end="url(#evals-g)"/>
<text class="lb green" x="560" y="656" text-anchor="middle">a real-row fix joins the golden rows with a person's verdict</text>
</svg>
