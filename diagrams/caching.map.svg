<svg class="vz" viewBox="0 0 1109 1100" role="img" aria-label="Two caches skip repeated model work. Above, Tunatutor&#x27;s answer cache: a normalised key with no user id finds a row in panel_content_cache; a hit makes no model call, a miss calls the model, validates the answer and stores it at version 6, and two wrong-language reports delete a row. Below, the provider&#x27;s prompt cache: a request with its fixed text first reuses the stored prefix at 0.1 times the input price, while a timestamp on top makes every call a miss that pays 1.25 times to write." data-vz="map"><defs><marker id="caching-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="caching-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="caching-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="caching-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="caching-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="caching-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">A stored answer skips the model; a reused prompt opening is billed at 0.1×</text><rect class="zone" x="24" y="88" width="1061" height="290" rx="10" data-p="1" data-b="1"/><text class="zn" x="40" y="108" data-p="1" data-b="1">Your service · answer cache · Tunatutor</text><rect class="zone blue" x="24" y="426" width="1061" height="602" rx="10" data-p="1" data-b="5" data-r="1"/><text class="zn blue" x="40" y="446" data-p="1" data-b="5" data-r="1">The provider's prompt cache · Anthropic prices, example sizes</text><rect class="bx" x="38" y="120" width="176" height="90" rx="8" data-p="1" data-b="1"/><text class="nm" x="56" y="150" data-p="1" data-b="1">A learner asks</text><text class="sb" x="56" y="172" data-p="1" data-b="1">« un tire-bouchon »</text><text class="sb" x="56" y="194" data-p="1" data-b="1">a word or a sentence</text><rect class="bx" x="270" y="120" width="208" height="112" rx="8" data-p="1" data-b="1"/><text class="nm" x="288" y="150" data-p="1" data-b="1">Cache key</text><text class="sb" x="288" y="172" data-p="1" data-b="1">text trimmed, lower-cased</text><text class="sb" x="288" y="194" data-p="1" data-b="1">SHA-256 for a sentence</text><text class="sb green" x="288" y="216" data-p="1" data-b="1">no user id in the key</text><rect class="bx" x="534" y="120" width="221" height="112" rx="8" data-p="1" data-b="2"/><text class="nm mono" x="552" y="150" data-p="1" data-b="2">panel_content_cache</text><text class="sb" x="552" y="172" data-p="1" data-b="2">Postgres, rows never expire</text><text class="sb" x="552" y="194" data-p="1" data-b="2">hit only if version ≥ 6</text><text class="sb amber" x="552" y="216" data-p="1" data-b="4">a version bump: old rows miss</text><rect class="bx green" x="854" y="120" width="217" height="90" rx="8" data-p="1" data-b="2"/><text class="nm" x="872" y="150" data-p="1" data-b="2">Hit: 0 model calls</text><text class="sb" x="872" y="172" data-p="1" data-b="2">learner's own words added</text><text class="sb" x="872" y="194" data-p="1" data-b="2">after the lookup, never stored</text><rect class="bx red" x="38" y="276" width="176" height="90" rx="8" data-p="1" data-b="4"/><text class="nm" x="56" y="306" data-p="1" data-b="4">Semantic cache</text><text class="sb" x="56" y="328" data-p="1" data-b="4">matches by meaning</text><text class="sb red" x="56" y="350" data-p="1" data-b="4">can be wrong, no error</text><rect class="bx green" x="270" y="276" width="208" height="90" rx="8" data-p="1" data-b="3"/><text class="nm" x="288" y="306" data-p="1" data-b="3">Validate, then store</text><text class="sb" x="288" y="328" data-p="1" data-b="3">missing field: nothing stored</text><text class="sb" x="288" y="350" data-p="1" data-b="3">upsert stamps version 6</text><rect class="bx blue" x="534" y="276" width="221" height="90" rx="8" data-p="1" data-b="3"/><text class="nm" x="552" y="306" data-p="1" data-b="3">Model call</text><text class="sb" x="552" y="328" data-p="1" data-b="3">fixed system prompt first</text><text class="sb" x="552" y="350" data-p="1" data-b="3">learner's text last</text><rect class="bx amber" x="854" y="276" width="217" height="90" rx="8" data-p="1" data-b="4"/><text class="nm" x="872" y="306" data-p="1" data-b="4">Wrong-language report</text><text class="sb" x="872" y="328" data-p="1" data-b="4">2 saved learners: row deleted</text><text class="sb" x="872" y="350" data-p="1" data-b="4">next read writes it again</text><rect class="bx green" x="38" y="458" width="440" height="112" rx="8" data-p="1" data-b="5" data-r="1"/><text class="nm" x="56" y="488" data-p="1" data-b="5" data-r="1">Fixed text first: the prefix is reused</text><text class="sb green" x="56" y="510" data-p="1" data-b="5" data-r="1">tools, then system prompt: 6,000 tokens, marker at end</text><text class="sb" x="56" y="532" data-p="1" data-b="5" data-r="1"><tspan class="mono">cache_control</tspan>: <tspan class="mono">ephemeral</tspan> is 5 min, <tspan class="mono">"ttl": "1h"</tspan> 1 hour</text><text class="sb" x="56" y="554" data-p="1" data-b="5" data-r="1">then goal + videos: 900 tokens, changes</text><rect class="bx red" x="38" y="614" width="440" height="112" rx="8" data-p="1" data-b="6" data-r="5"/><text class="nm" x="56" y="644" data-p="1" data-b="6" data-r="5">A timestamp on top: no call ever matches</text><text class="sb red" x="56" y="666" data-p="1" data-b="6" data-r="5">"Now 14:02" first</text><text class="sb" x="56" y="688" data-p="1" data-b="6" data-r="5">then tools, system prompt: same 6,000 tokens</text><text class="sb" x="56" y="710" data-p="1" data-b="6" data-r="5">then goal + videos: 900 tokens</text><rect class="bx" x="38" y="770" width="440" height="246" rx="8" data-p="1" data-b="6" data-r="4"/><text class="nm" x="56" y="800" data-p="1" data-b="6" data-r="4">Usage counts, user B</text><text class="sb mono green" x="56" y="822" data-p="1" data-b="6" data-r="4">cache_read_input_tokens: 6000</text><text class="sb mono" x="56" y="844" data-p="1" data-b="6" data-r="4">cache_creation_input_tokens: 0</text><text class="sb mono" x="56" y="866" data-p="1" data-b="6" data-r="4">input_tokens: 900</text><text class="sb" x="56" y="888" data-p="1" data-b="6" data-r="4">read share 6,000 / 6,900 ≈ 87%: the ceiling, healthy</text><text class="sb amber" x="56" y="910" data-p="1" data-b="6" data-r="4">both cache counts 0: nothing was cached</text><rect class="bx red" x="534" y="458" width="221" height="402" rx="8" data-p="1" data-b="5" data-r="2"/><text class="nm" x="552" y="488" data-p="1" data-b="5" data-r="2">Provider prefix cache</text><text class="sb" x="552" y="510" data-p="1" data-b="5" data-r="2">keeps the model's work</text><text class="sb" x="552" y="532" data-p="1" data-b="5" data-r="2">over the marked prefix</text><text class="sb" x="552" y="564" data-p="1" data-b="5" data-r="5">match from the first token</text><text class="sb" x="552" y="586" data-p="1" data-b="5" data-r="2">kept per organization</text><text class="sb" x="552" y="618" data-p="1" data-b="5" data-r="3">lives 5 min after last hit</text><text class="sb" x="552" y="640" data-p="1" data-b="5" data-r="2">or 1 hour on request</text><text class="sb blue" x="552" y="672" data-p="1" data-b="5" data-r="2">output still paid in full</text><rect class="bx green" x="854" y="458" width="217" height="112" rx="8" data-p="1" data-b="5" data-r="3"/><text class="nm" x="872" y="488" data-p="1" data-b="5" data-r="3">Hit: read at 0.1×</text><text class="sb" x="872" y="510" data-p="1" data-b="5" data-r="3">on most models, reply sooner</text><text class="sb green" x="872" y="532" data-p="1" data-b="5" data-r="3">user B: read 6,000 · write 0</text><text class="sb" x="872" y="554" data-p="1" data-b="5" data-r="3">each hit restarts the 5 min</text><rect class="bx amber" x="854" y="614" width="217" height="112" rx="8" data-p="1" data-b="5" data-r="2"/><text class="nm" x="872" y="644" data-p="1" data-b="5" data-r="2">Miss: write at 1.25×</text><text class="sb" x="872" y="666" data-p="1" data-b="5" data-r="2">1-hour lifetime: write at 2×</text><text class="sb amber" x="872" y="688" data-p="1" data-b="5" data-r="2">user A: write 6,000 · read 0</text><text class="sb red" x="872" y="710" data-p="1" data-b="5" data-r="5">timestamp on top: every call</text><rect class="bx amber" x="854" y="770" width="217" height="90" rx="8" data-p="1" data-b="6"/><text class="nm" x="872" y="800" data-p="1" data-b="6">Prefix too short</text><text class="sb" x="872" y="822" data-p="1" data-b="6">under 512 to 4,096 tokens</text><text class="sb amber" x="872" y="844" data-p="1" data-b="6">nothing cached, no error</text><rect class="bx" x="534" y="904" width="537" height="112" rx="8" data-p="1" data-b="6"/><text class="nm" x="552" y="934" data-p="1" data-b="6">Example day: 10,000 calls, $3 per 1M input</text><text class="sb" x="552" y="956" data-p="1" data-b="6">no cache $180</text><text class="sb green" x="552" y="978" data-p="1" data-b="6">cached about $18</text><text class="sb red" x="552" y="1000" data-p="1" data-b="6" data-r="5">timestamp on top about $225</text><path class="ar" d="M214,165 L266,165" marker-end="url(#caching-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar" d="M478,176 L530,176" marker-end="url(#caching-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar green" d="M755,165 L850,165" marker-end="url(#caching-map-g)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M644,232 L644,272" marker-end="url(#caching-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar blue" d="M534,321 L482,321" marker-end="url(#caching-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M478,347 L506,347 L506,202 L530,202" marker-end="url(#caching-map-g)" data-p="1" data-b="3" data-base="1"/><path class="ar red dash" d="M126,210 L126,272" marker-end="url(#caching-map-r)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M963,210 L963,272" marker-end="url(#caching-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar amber dash" d="M854,321 L805,321 L805,176 L759,176" marker-end="url(#caching-map-m)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M644,366 L644,454" marker-end="url(#caching-map-b)" data-p="1" data-b="5" data-base="1"/><path class="ar green" d="M478,514 L530,514" marker-end="url(#caching-map-g)" data-p="1" data-b="5" data-base="1"/><path class="ar red dash" d="M478,670 L530,670" marker-end="url(#caching-map-r)" data-p="1" data-b="6" data-base="1"/><path class="ar green" d="M755,514 L850,514" marker-end="url(#caching-map-g)" data-p="1" data-b="5" data-base="1"/><path class="ar amber" d="M755,670 L850,670" marker-end="url(#caching-map-m)" data-p="1" data-b="5" data-base="1"/><path class="ar amber dash" d="M755,815 L850,815" marker-end="url(#caching-map-m)" data-p="1" data-b="6" data-base="1"/><path class="ar" d="M534,815 L482,815" marker-end="url(#caching-map-a)" data-p="1" data-b="6" data-base="1"/><path class="ar blue" d="M478,502 L530,502" marker-end="url(#caching-map-b)" data-p="1" data-r="2" data-route="1"/><path class="ar amber" d="M755,670 L850,670" marker-end="url(#caching-map-m)" data-p="1" data-r="2" data-route="1"/><path class="ar blue" d="M478,528 L530,528" marker-end="url(#caching-map-b)" data-p="1" data-r="3" data-route="1"/><path class="ar green" d="M755,514 L850,514" marker-end="url(#caching-map-g)" data-p="1" data-r="3" data-route="1"/><path class="ar" d="M534,815 L482,815" marker-end="url(#caching-map-a)" data-p="1" data-r="4" data-route="1"/><path class="ar red dash" d="M478,670 L530,670" marker-end="url(#caching-map-r)" data-p="1" data-r="5" data-route="1"/><path class="ar red dash" d="M755,684 L850,684" marker-end="url(#caching-map-r)" data-p="1" data-r="5" data-route="1"/><text class="lb" x="804" y="154" text-anchor="middle" data-p="1" data-b="2" data-base="1">hit</text><text class="lb" x="656" y="257" data-p="1" data-b="3" data-base="1">miss or old version</text><text class="lb" x="518" y="263" data-p="1" data-b="3" data-base="1">stores</text><text class="lb" x="138" y="235" data-p="1" data-b="4" data-base="1">not used in Lomem</text><text class="lb" x="951" y="235" text-anchor="end" data-p="1" data-b="4" data-base="1">Something wrong?</text><text class="lb" x="817" y="261" data-p="1" data-b="4" data-base="1">deletes the row</text><text class="lb" x="656" y="415" data-p="1" data-b="5" data-base="1">every call resends the whole prompt</text><circle class="bd solid" cx="499" cy="502" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="499" y="506.5" data-p="1" data-r="2" data-route="1">2</text><line class="lk" x1="499" y1="502" x2="499" y2="451" data-p="1" data-r="2" data-route="1"/><text class="lb" x="515" y="446" text-anchor="middle" data-p="1" data-r="2" data-route="1">user A · 6,000 + 900</text><text class="lb" x="797" y="659" text-anchor="middle" data-p="1" data-r="2" data-route="1">store 6,000</text><circle class="bd solid" cx="499" cy="528" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="499" y="532.5" data-p="1" data-r="3" data-route="1">3</text><line class="lk" x1="499" y1="528" x2="499" y2="579" data-p="1" data-r="3" data-route="1"/><text class="lb" x="451" y="592" text-anchor="middle" data-p="1" data-r="3" data-route="1">user B · same 6,000</text><text class="lb" x="804" y="503" text-anchor="middle" data-p="1" data-r="3" data-route="1">hit</text><circle class="bd solid" cx="513" cy="815" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="513" y="819.5" data-p="1" data-r="4" data-route="1">4</text><line class="lk" x1="513" y1="815" x2="513" y2="764" data-p="1" data-r="4" data-route="1"/><text class="lb" x="465" y="759" text-anchor="middle" data-p="1" data-r="4" data-route="1">read 6,000 · write 0</text><circle class="bd dash" cx="499" cy="670" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="499" y="674.5" data-p="1" data-r="5" data-route="1">5</text><line class="lk" x1="499" y1="670" x2="383" y2="599" data-p="1" data-r="5" data-route="1"/><text class="lb" x="323" y="594" text-anchor="middle" data-p="1" data-r="5" data-route="1">"Now 14:02" on top</text><line class="ar" x1="24" y1="1064.0" x2="58" y2="1064.0" marker-end="url(#caching-map-a)"/><text class="sb" x="68" y="1068">calls</text><line class="ar blue" x1="125.885" y1="1064.0" x2="159.885" y2="1064.0" marker-end="url(#caching-map-b)"/><text class="sb" x="170" y="1068">model call</text><line class="ar green" x1="262.4345" y1="1064.0" x2="296.4345" y2="1064.0" marker-end="url(#caching-map-g)"/><text class="sb" x="306" y="1068">hit or check passed</text><line class="ar amber dash" x1="456.9536" y1="1064.0" x2="490.9536" y2="1064.0" marker-end="url(#caching-map-m)"/><text class="sb" x="501" y="1068">extra cost or removal</text><line class="ar red dash" x1="661.4775" y1="1064.0" x2="695.4775" y2="1064.0" marker-end="url(#caching-map-r)"/><text class="sb" x="705" y="1068">risky</text></svg>