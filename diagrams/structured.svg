<svg class="ov-svg" viewBox="0 0 1120 870" role="img" aria-label="Billpod's reader sends an invoice and a Zod schema through the gateway's callJson; Gemini writes under that schema, which fixes only the shape of a reply that finishes normally. Three checks follow: layer 1 reads how the call ended, layer 2 parses and checks the whole answer, layer 3 checks each value and drops what fails, then the Swiss QR code's exact values win and a person confirms the draft. Each way a reply can go wrong is caught at one of these stages, and a call with no usable answer is not retried: the draft is built from the QR code and the matched recurring payment.">
<defs>
<marker id="structured-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="structured-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="structured-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker>
<marker id="structured-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
<marker id="structured-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker>
</defs>
<text class="ttl" x="24" y="38">The provider guarantees only the shape; three checks and a person decide what is kept</text>

<text class="zl" x="24" y="94">HOW A REPLY GOES WRONG</text>
<text class="zl" x="360" y="94">ONE INVOICE READING, TOP TO BOTTOM</text>
<text class="zl" x="790" y="94">WHEN A CHECK FAILS</text>

<!-- what goes wrong -->
<text class="zn amber" x="24" y="134">JSON asked for in the prompt alone</text>
<text class="zn amber" x="24" y="154">fails in these ways</text>

<rect class="bx" x="24" y="216" width="250" height="82" rx="8"/>
<text class="nm" x="42" y="244">Wrapped or broken</text>
<text class="sb" x="42" y="266">text or a code fence around it</text>
<text class="sb" x="42" y="288">a trailing comma, a raw newline</text>

<rect class="bx" x="24" y="348" width="250" height="82" rx="8"/>
<text class="nm" x="42" y="376">Cut off or refused</text>
<text class="sb" x="42" y="398">hit the token limit mid-object</text>
<text class="sb" x="42" y="420">a safety filter, yet HTTP 200</text>

<rect class="bx" x="24" y="592" width="250" height="82" rx="8"/>
<text class="nm" x="42" y="620">Impossible value</text>
<text class="sb" x="42" y="642">a date that does not exist</text>
<text class="sb" x="42" y="664">an IBAN with one misread digit</text>

<rect class="bx" x="24" y="714" width="250" height="82" rx="8"/>
<text class="nm" x="42" y="742">Real but false value</text>
<text class="sb" x="42" y="764">hidden text plants a real IBAN</text>
<text class="sb" x="42" y="786">it passes the mod-97 check</text>

<!-- the pipeline -->
<rect class="bx" x="360" y="112" width="340" height="64" rx="8"/>
<text class="nm" x="378" y="138">Billpod's reader</text>
<text class="sb" x="378" y="160"><tspan class="mono">callJson</tspan>: PDF + Zod schema, 4096 tokens</text>

<rect class="bx blue" x="360" y="206" width="340" height="102" rx="8"/>
<text class="nm" x="378" y="234">Gemini writes under the schema</text>
<text class="sb" x="378" y="256"><tspan class="mono">responseSchema</tspan>, in the request settings</text>
<text class="sb blue" x="378" y="278">removes every token that breaks the schema</text>
<text class="sb" x="378" y="300">shape only, and only on a normal finish</text>

<rect class="bx red" x="360" y="338" width="340" height="102" rx="8"/>
<text class="nm" x="378" y="366">Layer 1 · How did the call end?</text>
<text class="sb" x="378" y="388">reads <tspan class="mono">finishReason</tspan> before parsing</text>
<text class="sb green" x="378" y="410">STOP or MAX_TOKENS: go on and parse</text>
<text class="sb red" x="378" y="432">SAFETY, SPII, RECITATION…: blocked</text>

<rect class="bx red" x="360" y="470" width="340" height="82" rx="8"/>
<text class="nm" x="378" y="498">Layer 2 · Is the answer usable?</text>
<text class="sb" x="378" y="520">parse, then the same Zod schema</text>
<text class="sb" x="378" y="542">loose on purpose: optional, plain strings</text>

<rect class="bx red" x="360" y="582" width="340" height="102" rx="8"/>
<text class="nm" x="378" y="610">Layer 3 · Is each value real?</text>
<text class="sb" x="378" y="632">date exists · 3-letter currency · IBAN mod 97</text>
<text class="sb" x="378" y="654">amount parses to cents · text cleaned, cut</text>
<text class="sb green" x="378" y="676">a field that fails is dropped, not guessed</text>

<rect class="bx green" x="360" y="714" width="340" height="82" rx="8"/>
<text class="nm" x="378" y="742">The Swiss QR code wins</text>
<text class="sb mono" x="378" y="764">iban = qr?.iban ?? ai?.iban</text>
<text class="sb" x="378" y="786">same for payee, amount, reference</text>

<!-- when a check fails -->
<rect class="bx amber" x="790" y="338" width="274" height="214" rx="8"/>
<text class="nm" x="808" y="392">No retry: a draft without AI</text>
<text class="sb" x="808" y="416"><tspan class="mono">LlmOutputError</tspan>: AI status failed</text>
<text class="sb" x="808" y="438">Billpod never retries a bad answer</text>
<text class="sb" x="808" y="460">the draft is filled from the QR code</text>
<text class="sb" x="808" y="482">and the matched recurring payment</text>
<text class="sb amber" x="808" y="504">the failed call is still billed</text>

<rect class="bx" x="790" y="566" width="274" height="132" rx="8"/>
<text class="nm" x="808" y="592">Example: 5 of 8 fields kept</text>
<text class="sb" x="808" y="614"><tspan class="mono">dueDate</tspan> "2026-02-30": dropped</text>
<text class="sb" x="808" y="636"><tspan class="mono">issueDate</tspan> "30.10.26": dropped</text>
<text class="sb" x="808" y="658"><tspan class="mono">direction</tspan> "outgoing": dropped</text>
<text class="sb green" x="808" y="680"><tspan class="mono">iban</tspan> passes mod 97: kept</text>

<rect class="bx green" x="790" y="712" width="274" height="102" rx="8"/>
<text class="nm" x="808" y="740">A person confirms the draft</text>
<text class="sb" x="808" y="762">each field shows its source:</text>
<text class="sb mono" x="808" y="784">qr · ai · recurring · none</text>
<text class="sb" x="808" y="806">nothing is filed on its own</text>

<!-- legend -->
<line class="ar dash" x1="24" y1="846" x2="60" y2="846" marker-end="url(#structured-a)"/>
<text class="sb" x="70" y="850">stopped at this stage</text>
<line class="ar blue" x1="232" y1="846" x2="268" y2="846" marker-end="url(#structured-b)"/>
<text class="sb" x="278" y="850">model call and reply</text>
<line class="ar green" x1="440" y1="846" x2="476" y2="846" marker-end="url(#structured-g)"/>
<text class="sb" x="486" y="850">passes on</text>
<line class="ar red" x1="590" y1="846" x2="626" y2="846" marker-end="url(#structured-r)"/>
<text class="sb" x="636" y="850">rejected or dropped</text>
<line class="ar amber" x1="790" y1="846" x2="826" y2="846" marker-end="url(#structured-m)"/>
<text class="sb" x="836" y="850">no usable answer, still a draft</text>

<!-- failure modes into stages -->
<line class="ar dash" x1="274" y1="257" x2="356" y2="257" marker-end="url(#structured-a)"/>
<text class="lb" x="315" y="247" text-anchor="middle">prevented</text>
<line class="ar dash" x1="274" y1="389" x2="356" y2="389" marker-end="url(#structured-a)"/>
<text class="lb" x="315" y="379" text-anchor="middle">caught</text>
<line class="ar dash" x1="274" y1="633" x2="356" y2="633" marker-end="url(#structured-a)"/>
<text class="lb" x="315" y="623" text-anchor="middle">caught</text>
<line class="ar dash" x1="274" y1="755" x2="356" y2="755" marker-end="url(#structured-a)"/>
<text class="lb" x="315" y="745" text-anchor="middle">caught</text>

<!-- main flow -->
<line class="ar blue" x1="530" y1="176" x2="530" y2="202" marker-end="url(#structured-b)"/>
<text class="lb" x="542" y="195">PDF + schema</text>
<line class="ar blue" x1="530" y1="308" x2="530" y2="334" marker-end="url(#structured-b)"/>
<text class="lb" x="542" y="327">reply</text>
<line class="ar green" x1="530" y1="440" x2="530" y2="466" marker-end="url(#structured-g)"/>
<text class="lb" x="542" y="459">text to parse</text>
<line class="ar green" x1="530" y1="552" x2="530" y2="578" marker-end="url(#structured-g)"/>
<text class="lb" x="542" y="571">typed data</text>
<line class="ar green" x1="530" y1="684" x2="530" y2="710" marker-end="url(#structured-g)"/>
<text class="lb" x="542" y="703">fields that pass</text>

<!-- failures -->
<line class="ar red" x1="700" y1="389" x2="786" y2="389" marker-end="url(#structured-r)"/>
<text class="lb red" x="743" y="379" text-anchor="middle">blocked</text>
<line class="ar red" x1="700" y1="511" x2="786" y2="511" marker-end="url(#structured-r)"/>
<text class="lb red" x="743" y="501" text-anchor="middle">rejected</text>
<line class="ar red" x1="700" y1="633" x2="786" y2="633" marker-end="url(#structured-r)"/>
<text class="lb red" x="743" y="623" text-anchor="middle">dropped</text>
<line class="ar green" x1="700" y1="755" x2="786" y2="755" marker-end="url(#structured-g)"/>
<text class="lb green" x="743" y="745" text-anchor="middle">draft</text>
<path class="ar amber" d="M1064,445 H1090 V763 H1068" marker-end="url(#structured-m)"/>
</svg>
