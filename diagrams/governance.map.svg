<svg class="vz" viewBox="0 0 1448 1100" role="img" aria-label="An adviser&#x27;s notes service sends a prompt with three headers to an AI gateway, the only service with the OpenAI keys. The gateway refuses any call with no approved inventory row, calls the pinned snapshot in OpenAI&#x27;s Europe region, stores the prompt and the draft in a content store and inserts a call row. The adviser&#x27;s edit is inserted later as a separate event row. The row&#x27;s risk class adds controls, and fourteen months later audit answers five questions from these records." data-vz="map"><defs><marker id="governance-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="governance-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="governance-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="governance-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="governance-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="governance-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">One gateway checks the inventory, pins the model and keeps each draft for audit</text><text class="sub" x="24" y="62">Example: a made-up Swiss bank drafts a meeting note after a client call. The OpenAI names and terms are real.</text><text class="zl" x="38" y="94">WHO ASKS</text><text class="zl" x="270" y="94">WHO CALLS</text><text class="zl" x="621" y="94">THE GATEWAY</text><text class="zl" x="951" y="94">THE PROVIDER</text><text class="zl" x="1210" y="94">INSERT-ONLY RECORDS</text><rect class="zone" x="24" y="690" width="1400" height="156" rx="10" data-p="1" data-b="5" data-r="2"/><text class="zn" x="40" y="710" data-p="1" data-b="5" data-r="2">the row's risk class adds controls · example rule</text><rect class="zone" x="24" y="894" width="1400" height="134" rx="10" data-p="1" data-b="6" data-r="6"/><text class="zn" x="40" y="914" data-p="1" data-b="6" data-r="6">14 months later, audit asks five questions · each has a record</text><rect class="bx" x="38" y="112" width="176" height="112" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="142" data-p="1" data-b="1" data-r="1">Adviser</text><text class="sb mono" x="56" y="164" data-p="1" data-b="1" data-r="1">rm.jmuster</text><text class="sb" x="56" y="186" data-p="1" data-b="1" data-r="1">presses "draft note"</text><text class="sb" x="56" y="208" data-p="1" data-b="4" data-r="5">saves an edited note</text><rect class="bx" x="270" y="112" width="206" height="178" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm mono" x="288" y="142" data-p="1" data-b="1" data-r="1">advisory-notes</text><text class="sb" x="288" y="164" data-p="1" data-b="1" data-r="1">stops an empty transcript</text><text class="sb" x="288" y="186" data-p="1" data-b="1" data-r="1">sends prompt + 3 headers:</text><text class="sb mono" x="288" y="208" data-p="1" data-b="1" data-r="1">meeting-note-draft</text><text class="sb mono" x="288" y="230" data-p="1" data-b="1" data-r="1">meeting-note/v7</text><text class="sb mono" x="288" y="252" data-p="1" data-b="1" data-r="1">rm.jmuster</text><text class="sb" x="288" y="274" data-p="1" data-b="4" data-r="5">keeps the final <tspan class="mono">note/44120</tspan></text><rect class="bx red" x="621" y="112" width="274" height="356" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="639" y="142" data-p="1" data-b="2" data-r="1">AI gateway</text><text class="sb" x="639" y="164" data-p="1" data-b="2" data-r="1">alone holds the OpenAI keys</text><text class="sb red" x="639" y="196" data-p="1" data-b="2" data-r="2">1  no row: refuse, send nothing</text><text class="sb" x="639" y="218" data-p="1" data-b="2" data-r="2">2  use the row's model, region</text><text class="sb" x="639" y="240" data-p="1" data-b="3" data-r="3">3  other model reported: alert</text><text class="sb" x="639" y="262" data-p="1" data-b="3" data-r="3">    and on a High row: refuse</text><text class="sb green" x="639" y="284" data-p="1" data-b="4" data-r="4">4  store prompt and draft</text><text class="sb green" x="639" y="306" data-p="1" data-b="4" data-r="4">5  insert the call row</text><text class="sb" x="639" y="328" data-p="1" data-b="4" data-r="4">6  return draft + <tspan class="mono">call_id</tspan> c-81f2</text><rect class="bx" x="621" y="512" width="274" height="134" rx="8" data-p="1" data-b="2" data-r="2"/><text class="nm" x="639" y="542" data-p="1" data-b="2" data-r="2">Inventory row</text><text class="sb mono" x="639" y="564" data-p="1" data-b="2" data-r="2">meeting-note-draft</text><text class="sb" x="639" y="586" data-p="1" data-b="2" data-r="2">class Medium, approved by risk</text><text class="sb" x="639" y="608" data-p="1" data-b="2" data-r="2">pins the model and the region</text><text class="sb" x="639" y="630" data-p="1" data-b="2" data-r="2">caller allowed: advisory-notes</text><rect class="bx blue" x="951" y="112" width="203" height="178" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="969" y="142" data-p="1" data-b="3" data-r="3">OpenAI</text><text class="sb mono" x="969" y="164" data-p="1" data-b="3" data-r="3">gpt-4o-2024-08-06</text><text class="sb" x="969" y="186" data-p="1" data-b="3" data-r="3">a fixed, dated build</text><text class="sb mono" x="969" y="208" data-p="1" data-b="3" data-r="3">eu.api.openai.com</text><text class="sb" x="969" y="230" data-p="1" data-b="3" data-r="3">Europe (EEA + Switzerland)</text><text class="sb amber" x="969" y="252" data-p="1" data-b="3" data-r="3">default terms: 30-day copy</text><text class="sb green" x="969" y="274" data-p="1" data-b="3" data-r="3">this row: no copy kept</text><rect class="bx amber" x="951" y="512" width="203" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="969" y="542" data-p="1" data-b="3" data-r="3">Alias <tspan class="mono">gpt-4o</tspan></text><text class="sb" x="969" y="564" data-p="1" data-b="3" data-r="3">moves to newer builds</text><text class="sb" x="969" y="586" data-p="1" data-b="3" data-r="3">an eval on it goes stale</text><text class="sb amber" x="969" y="608" data-p="1" data-b="3" data-r="3">the row never names one</text><rect class="bx green" x="1210" y="112" width="200" height="112" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="1228" y="142" data-p="1" data-b="4" data-r="4">Content store</text><text class="sb" x="1228" y="164" data-p="1" data-b="4" data-r="4">encrypted bucket</text><text class="sb" x="1228" y="186" data-p="1" data-b="4" data-r="4"><tspan class="mono">in/c-81f2</tspan> prompt as sent</text><text class="sb" x="1228" y="208" data-p="1" data-b="4" data-r="4"><tspan class="mono">out/c-81f2</tspan> the draft</text><rect class="bx green" x="1210" y="334" width="200" height="134" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="1228" y="364" data-p="1" data-b="4" data-r="4">Call row</text><text class="sb mono" x="1228" y="386" data-p="1" data-b="4" data-r="4">c-81f2 15:41:07</text><text class="sb" x="1228" y="408" data-p="1" data-b="4" data-r="4">model asked and reported</text><text class="sb" x="1228" y="430" data-p="1" data-b="4" data-r="4">prompt v7, region EU</text><text class="sb green" x="1228" y="452" data-p="1" data-b="4" data-r="4">INSERT, never UPDATE</text><rect class="bx green" x="1210" y="512" width="200" height="112" rx="8" data-p="1" data-b="4" data-r="5"/><text class="nm" x="1228" y="542" data-p="1" data-b="4" data-r="5">Event row</text><text class="sb mono" x="1228" y="564" data-p="1" data-b="4" data-r="5">c-81f2 edited</text><text class="sb" x="1228" y="586" data-p="1" data-b="4" data-r="5">by rm.jmuster at 15:52</text><text class="sb green" x="1228" y="608" data-p="1" data-b="4" data-r="5">the draft stays as written</text><rect class="bx" x="38" y="722" width="438" height="112" rx="8" data-p="1" data-b="5"/><text class="nm" x="56" y="752" data-p="1" data-b="5">Low</text><text class="sb" x="56" y="774" data-p="1" data-b="5">no client data, helps employees</text><text class="sb green" x="56" y="796" data-p="1" data-b="5">inventory row, call and event rows</text><text class="sb amber" x="56" y="818" data-p="1" data-b="5">default terms allowed: 30-day copy</text><rect class="bx blue" x="621" y="722" width="274" height="112" rx="8" data-p="1" data-b="5" data-r="2"/><text class="nm" x="639" y="752" data-p="1" data-b="5" data-r="2">Medium · the meeting note</text><text class="sb" x="639" y="774" data-p="1" data-b="5" data-r="2">client data, a person fixes each draft</text><text class="sb green" x="639" y="796" data-p="1" data-b="5" data-r="2">+ Europe region, no copy at OpenAI</text><text class="sb green" x="639" y="818" data-p="1" data-b="5" data-r="2">+ eval each release, weekly monitoring</text><rect class="bx" x="951" y="722" width="459" height="112" rx="8" data-p="1" data-b="5"/><text class="nm" x="969" y="752" data-p="1" data-b="5">High</text><text class="sb" x="969" y="774" data-p="1" data-b="5">reaches a client with no rewrite</text><text class="sb green" x="969" y="796" data-p="1" data-b="5">+ zero data retention at OpenAI</text><text class="sb green" x="969" y="818" data-p="1" data-b="5">+ named approver for each output</text><rect class="bx" x="38" y="926" width="176" height="90" rx="8" data-p="1" data-b="6" data-r="6"/><text class="nm" x="56" y="956" data-p="1" data-b="6" data-r="6">Which model?</text><text class="sb mono" x="56" y="978" data-p="1" data-b="6" data-r="6">gpt-4o-2024-08-06</text><text class="sb green" x="56" y="1000" data-p="1" data-b="6" data-r="6">call row</text><rect class="bx" x="270" y="926" width="206" height="90" rx="8" data-p="1" data-b="6" data-r="6"/><text class="nm" x="288" y="956" data-p="1" data-b="6" data-r="6">What did it write?</text><text class="sb" x="288" y="978" data-p="1" data-b="6" data-r="6"><tspan class="mono">out/c-81f2</tspan>, pre-edit</text><text class="sb green" x="288" y="1000" data-p="1" data-b="6" data-r="6">content store</text><rect class="bx" x="621" y="926" width="274" height="90" rx="8" data-p="1" data-b="6" data-r="6"/><text class="nm" x="639" y="956" data-p="1" data-b="6" data-r="6">Where did data go?</text><text class="sb" x="639" y="978" data-p="1" data-b="6" data-r="6">EU region, no copy kept</text><text class="sb green" x="639" y="1000" data-p="1" data-b="6" data-r="6">call row + inventory</text><rect class="bx" x="951" y="926" width="203" height="90" rx="8" data-p="1" data-b="6"/><text class="nm" x="969" y="956" data-p="1" data-b="6">Tested? Signed?</text><text class="sb" x="969" y="978" data-p="1" data-b="6">1 bad of 300, bar 1%</text><text class="sb green" x="969" y="1000" data-p="1" data-b="6">eval report, reviewer</text><rect class="bx" x="1210" y="926" width="200" height="90" rx="8" data-p="1" data-b="6"/><text class="nm" x="1228" y="956" data-p="1" data-b="6">Still working?</text><text class="sb" x="1228" y="978" data-p="1" data-b="6">200 calls scored a week</text><text class="sb green" x="1228" y="1000" data-p="1" data-b="6">monitoring records</text><path class="ar" d="M214,168 L266,168" marker-end="url(#governance-map-a)" data-p="1" data-b="1" data-base="1"/><path class="ar blue" d="M476,189 L617,189" marker-end="url(#governance-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M621,213 L480,213" marker-end="url(#governance-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M758,468 L758,508" marker-end="url(#governance-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M895,189 L947,189" marker-end="url(#governance-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar blue" d="M951,213 L899,213" marker-end="url(#governance-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar green" d="M895,310 L1182,310 L1182,168 L1206,168" marker-end="url(#governance-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M895,401 L1206,401" marker-end="url(#governance-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar green" d="M373,290 L373,672 L1310,672 L1310,628" marker-end="url(#governance-map-g)" data-p="1" data-b="4" data-base="1"/><path class="ar" d="M476,778 L617,778" marker-end="url(#governance-map-a)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M895,778 L947,778" marker-end="url(#governance-map-a)" data-p="1" data-b="5" data-base="1"/><path class="ar" d="M214,168 L266,168" marker-end="url(#governance-map-a)" data-p="1" data-r="1" data-route="1"/><path class="ar blue" d="M476,189 L617,189" marker-end="url(#governance-map-b)" data-p="1" data-r="1" data-route="1"/><path class="ar" d="M744,468 L744,508" marker-end="url(#governance-map-a)" data-p="1" data-r="2" data-route="1"/><path class="ar green" d="M772,512 L772,472" marker-end="url(#governance-map-g)" data-p="1" data-r="2" data-route="1"/><path class="ar blue" d="M895,189 L947,189" marker-end="url(#governance-map-b)" data-p="1" data-r="3" data-route="1"/><path class="ar blue" d="M951,213 L899,213" marker-end="url(#governance-map-b)" data-p="1" data-r="3" data-route="1"/><path class="ar green" d="M895,310 L1182,310 L1182,168 L1206,168" marker-end="url(#governance-map-g)" data-p="1" data-r="4" data-route="1"/><path class="ar green" d="M895,401 L1206,401" marker-end="url(#governance-map-g)" data-p="1" data-r="4" data-route="1"/><path class="ar blue" d="M621,213 L480,213" marker-end="url(#governance-map-b)" data-p="1" data-r="4" data-route="1"/><path class="ar green" d="M373,290 L373,672 L1310,672 L1310,628" marker-end="url(#governance-map-g)" data-p="1" data-r="5" data-route="1"/><text class="lb" x="770" y="493" data-p="1" data-b="2" data-base="1">row for use case + caller</text><text class="lb" x="839" y="661" text-anchor="middle" data-p="1" data-b="4" data-base="1">the edit, saved as a new row</text><circle class="bd solid" cx="497" cy="189" r="11" data-p="1" data-r="1" data-route="1"/><text class="n" x="497" y="193.5" data-p="1" data-r="1" data-route="1">1</text><circle class="bd solid" cx="744" cy="488" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="744" y="492.5" data-p="1" data-r="2" data-route="1">2</text><line class="lk" x1="744" y1="488" x2="715" y2="488" data-p="1" data-r="2" data-route="1"/><text class="lb" x="616" y="492" text-anchor="middle" data-p="1" data-r="2" data-route="1">row for this use case and caller?</text><circle class="bd solid" cx="772" cy="492" r="11" data-p="1" data-r="2" data-route="1"/><text class="n" x="772" y="496.5" data-p="1" data-r="2" data-route="1">2</text><line class="lk" x1="772" y1="492" x2="800" y2="492" data-p="1" data-r="2" data-route="1"/><text class="lb" x="900" y="496" text-anchor="middle" data-p="1" data-r="2" data-route="1">Medium · pinned model · Europe</text><circle class="bd solid" cx="916" cy="189" r="11" data-p="1" data-r="3" data-route="1"/><text class="n" x="916" y="193.5" data-p="1" data-r="3" data-route="1">3</text><circle class="bd solid" cx="916" cy="310" r="11" data-p="1" data-r="4" data-route="1"/><text class="n" x="916" y="314.5" data-p="1" data-r="4" data-route="1">4</text><text class="lb mono" x="544" y="233" text-anchor="middle" data-p="1" data-r="4" data-route="1">draft + call_id</text><circle class="bd solid" cx="373" cy="311" r="11" data-p="1" data-r="5" data-route="1"/><text class="n" x="373" y="315.5" data-p="1" data-r="5" data-route="1">5</text><text class="lb mono" x="836" y="661" text-anchor="middle" data-p="1" data-r="5" data-route="1">c-81f2 · edited · note/44120</text><line class="ar" x1="24" y1="1064.0" x2="58" y2="1064.0" marker-end="url(#governance-map-a)"/><text class="sb" x="68" y="1068">a call</text><line class="ar blue" x1="129.9787" y1="1064.0" x2="163.9787" y2="1064.0" marker-end="url(#governance-map-b)"/><text class="sb" x="174" y="1068">model call</text><line class="ar green" x1="266.5282" y1="1064.0" x2="300.5282" y2="1064.0" marker-end="url(#governance-map-g)"/><text class="sb" x="311" y="1068">insert-only write</text></svg>