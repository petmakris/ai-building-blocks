<svg class="ov-svg" viewBox="0 0 1120 850" role="img" aria-label="Two loops call Billpod's tools. In the app, Billpod's loop sends Gemini the rules, the chat and 46 tool definitions; Gemini only replies with a request to call a tool, and the loop runs reads at once, stops a listed write at a confirmation card, and ends at 6 model calls or a reply with no call. Over MCP, Claude or ChatGPT runs its own loop and sends tools/call with an OAuth token, where a missing scope is refused with 403. Every call from both loops goes through one runner, runTool, which checks scopes, input, the handler and the output, and calls the same services the REST routes use.">
<defs>
<marker id="tools-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="tools-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="tools-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker>
</defs>
<text class="ttl" x="24" y="38">The model only asks for a tool call; your code decides whether it runs</text>

<!-- in-app zone -->
<rect class="zone blue" x="12" y="58" width="1096" height="294" rx="10"/>
<text class="zn blue" x="28" y="82">In the app</text>

<rect class="bx" x="32" y="100" width="200" height="86" rx="8"/>
<text class="nm" x="50" y="130">The person</text>
<text class="sb" x="50" y="154">"I paid the electricity</text>
<text class="sb" x="50" y="174">bill by Twint today."</text>

<rect class="bx green" x="32" y="226" width="200" height="112" rx="8"/>
<text class="nm" x="50" y="256">Confirmation card</text>
<text class="sb" x="50" y="280">31 writes need one first</text>
<text class="sb" x="50" y="302">shows the stored record</text>
<text class="sb green" x="50" y="326">Approve runs it as shown</text>

<rect class="bx" x="360" y="100" width="240" height="238" rx="8"/>
<text class="nm" x="378" y="130">Billpod's loop</text>
<text class="sb mono" x="378" y="154">createAssistant</text>
<text class="sb" x="378" y="184">each call resends rules,</text>
<text class="sb" x="378" y="206">chat and all calls so far</text>
<text class="sb amber" x="378" y="238">stops at 6 model calls</text>
<text class="sb green" x="378" y="262">ends on a reply with no call</text>
<text class="sb" x="378" y="294">behind a card, later writes</text>
<text class="sb" x="378" y="316">are answered "not run"</text>

<rect class="bx blue" x="860" y="100" width="230" height="160" rx="8"/>
<text class="nm" x="878" y="130">Gemini Flash</text>
<text class="sb" x="878" y="154">sees 46 of the 50 tools</text>
<text class="sb" x="878" y="176">keeps nothing between calls</text>
<text class="sb blue" x="878" y="200">replies text or a call</text>
<text class="sb amber" x="878" y="224">can be steered by text</text>
<text class="sb amber" x="878" y="246">inside a tool result</text>

<!-- runner -->
<rect class="bx red" x="300" y="400" width="520" height="176" rx="8"/>
<text class="nm mono" x="318" y="430">runTool</text>
<text class="sb" x="400" y="430">one runner for every tool call</text>
<text class="sb" x="318" y="458">1 · caller holds the scopes</text>
<text class="sb amber" x="540" y="458">else "Tell the person; do not retry."</text>
<text class="sb" x="318" y="482">2 · zod validates the input</text>
<text class="sb amber" x="540" y="482">else one message per wrong field</text>
<text class="sb" x="318" y="506">3 · handler calls the service</text>
<text class="sb amber" x="540" y="506">a crash: one fixed message, logged</text>
<text class="sb" x="318" y="530">4 · output fits its schema</text>
<text class="sb amber" x="540" y="530">else INTERNAL_ERROR, logged</text>
<text class="sb green" x="318" y="560">always returns data or an error the model can act on</text>

<rect class="bx green" x="870" y="420" width="220" height="130" rx="8"/>
<text class="nm" x="888" y="450">Billpod services</text>
<text class="sb" x="888" y="474">REST routes call them too</text>
<text class="sb green" x="888" y="498">refuse a stale version</text>
<text class="sb green" x="888" y="522">bind screens and AI alike</text>

<!-- MCP zone -->
<rect class="zone blue" x="12" y="612" width="1096" height="188" rx="10"/>
<text class="zn blue" x="28" y="636">Over MCP</text>

<rect class="bx green" x="32" y="652" width="200" height="136" rx="8"/>
<text class="nm mono" x="50" y="682">POST /mcp</text>
<text class="sb" x="50" y="706">OAuth 2.1 Bearer token</text>
<text class="sb" x="50" y="728">scopes the person ticked</text>
<text class="sb green" x="50" y="752">a missing scope: 403</text>
<text class="sb green" x="50" y="774">the tool never runs</text>

<rect class="bx blue" x="360" y="648" width="240" height="140" rx="8"/>
<text class="nm" x="378" y="678">Claude or ChatGPT</text>
<text class="sb" x="378" y="702">keeps the chat, runs the loop</text>
<text class="sb" x="378" y="724">one tools/call per call</text>
<text class="sb amber" x="378" y="752">Billpod's cap and card</text>
<text class="sb amber" x="378" y="774">do not apply here</text>

<rect class="bx blue" x="860" y="652" width="230" height="110" rx="8"/>
<text class="nm" x="878" y="682">Their own model</text>
<text class="sb" x="878" y="706">Anthropic's, inside Claude</text>
<text class="sb blue" x="878" y="730">sees all 50 tools</text>

<!-- legend -->
<line class="ar" x1="24" y1="828" x2="60" y2="828" marker-end="url(#tools-a)"/>
<text class="sb" x="70" y="832">sends a message, call or result</text>
<line class="ar blue" x1="300" y1="828" x2="336" y2="828" marker-end="url(#tools-b)"/>
<text class="sb" x="346" y="832">a model asks for a tool call</text>
<line class="ar red" x1="560" y1="828" x2="596" y2="828" marker-end="url(#tools-r)"/>
<text class="sb" x="606" y="832">the runner runs the tool</text>

<!-- arrows: in-app -->
<line class="ar" x1="232" y1="140" x2="356" y2="140" marker-end="url(#tools-a)"/>
<text class="lb" x="294" y="131" text-anchor="middle">message</text>
<line class="ar" x1="80" y1="186" x2="80" y2="222" marker-end="url(#tools-a)"/>
<text class="lb" x="92" y="211">presses Approve</text>
<line class="ar" x1="360" y1="290" x2="236" y2="290" marker-end="url(#tools-a)"/>
<text class="lb" x="296" y="281" text-anchor="middle">on confirm list</text>
<line class="ar" x1="600" y1="140" x2="856" y2="140" marker-end="url(#tools-a)"/>
<text class="lb" x="728" y="131" text-anchor="middle">rules + chat + 46 tools</text>
<line class="ar blue" x1="860" y1="196" x2="604" y2="196" marker-end="url(#tools-b)"/>
<text class="lb blue" x="730" y="187" text-anchor="middle">functionCall: name + args</text>
<text class="lb" x="730" y="220" text-anchor="middle">a request only; nothing ran</text>
<line class="ar" x1="400" y1="338" x2="400" y2="396" marker-end="url(#tools-a)"/>
<text class="lb" x="392" y="382" text-anchor="end">no card needed: runs now</text>
<line class="ar" x1="560" y1="400" x2="560" y2="342" marker-end="url(#tools-a)"/>
<text class="lb" x="568" y="382">result appended for the next call</text>
<path class="ar" d="M100,338 V440 H296" marker-end="url(#tools-a)"/>
<text class="lb" x="200" y="431" text-anchor="middle">the approved call</text>
<line class="ar red" x1="820" y1="486" x2="866" y2="486" marker-end="url(#tools-r)"/>

<!-- arrows: MCP -->
<line class="ar" x1="600" y1="680" x2="856" y2="680" marker-end="url(#tools-a)"/>
<text class="lb" x="728" y="671" text-anchor="middle">chat + all 50 tools</text>
<line class="ar blue" x1="860" y1="730" x2="604" y2="730" marker-end="url(#tools-b)"/>
<text class="lb blue" x="730" y="721" text-anchor="middle">a tool call</text>
<line class="ar" x1="360" y1="718" x2="236" y2="718" marker-end="url(#tools-a)"/>
<text class="lb" x="296" y="709" text-anchor="middle"><tspan class="mono">tools/call</tspan></text>
<path class="ar" d="M180,652 V530 H296" marker-end="url(#tools-a)"/>
<line class="ar" x1="570" y1="576" x2="570" y2="644" marker-end="url(#tools-a)"/>
<text class="lb" x="580" y="600">JSON result; isError on failure</text>
</svg>
