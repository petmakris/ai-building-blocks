<svg class="vz" viewBox="0 0 1158 814" role="img" aria-label="Three kinds of caller reach Billpod&#x27;s services. The screens call REST routes, which call the services directly. The in-app assistant and outside assistants over MCP both hand tool calls to one runner, which runs one of 50 tools, and each tool calls the same services. A rate limit kept on one REST route had to be copied into a tool by hand. A parity test checks that every route has a tool or a written reason." data-vz="map"><defs><marker id="toollayer-map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="toollayer-map-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker><marker id="toollayer-map-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah red"/></marker><marker id="toollayer-map-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah green"/></marker><marker id="toollayer-map-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah amber"/></marker><marker id="toollayer-map-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah on"/></marker></defs><text class="ttl" x="24" y="38">Three kinds of caller, one set of rules: every path ends in the same services</text><text class="zl" x="38" y="70">WHO ASKS</text><text class="zl" x="359" y="70">ENTRY POINT · ITS OWN RULES</text><text class="zl" x="667" y="70">THE TOOL LAYER</text><text class="zl" x="916" y="70">THE SERVICES</text><rect class="zone red" x="653" y="222" width="221" height="392" rx="10" data-p="1" data-b="3" data-r="3"/><text class="zn red" x="669" y="242" data-p="1" data-b="3" data-r="3">defined once, shared by both</text><text class="zn red" x="669" y="262" data-p="1" data-b="3" data-r="3">AI entry points</text><rect class="bx" x="38" y="88" width="265" height="68" rx="8" data-p="1" data-b="1"/><text class="nm" x="56" y="118" data-p="1" data-b="1">A person on the screens</text><text class="sb" x="56" y="140" data-p="1" data-b="1">taps Pay on a bill</text><rect class="bx blue" x="38" y="274" width="265" height="68" rx="8" data-p="1" data-b="1" data-r="1"/><text class="nm" x="56" y="304" data-p="1" data-b="1" data-r="1">A person in the app's chat</text><text class="sb" x="56" y="326" data-p="1" data-b="1" data-r="1">"I paid the electricity bill"</text><rect class="bx blue" x="38" y="490" width="265" height="112" rx="8" data-p="1" data-b="1" data-r="5"/><text class="nm" x="56" y="520" data-p="1" data-b="1" data-r="5">Claude or ChatGPT</text><text class="sb" x="56" y="542" data-p="1" data-b="1" data-r="5">an outside assistant, own model</text><text class="sb amber" x="56" y="564" data-p="1" data-b="1" data-r="6"><tspan class="mono">destructiveHint: true</tspan>: it decides</text><text class="sb red" x="56" y="586" data-p="1" data-b="1" data-r="7">gets <tspan class="mono">isError: true</tspan> back</text><rect class="bx" x="359" y="88" width="252" height="90" rx="8" data-p="1" data-b="2"/><text class="nm mono" x="377" y="118" data-p="1" data-b="2">REST /api/billpod</text><text class="sb" x="377" y="140" data-p="1" data-b="2">signed-in session</text><text class="sb amber" x="377" y="162" data-p="1" data-b="2">upload limit: 30 a minute</text><rect class="bx blue" x="359" y="274" width="252" height="172" rx="8" data-p="1" data-b="2" data-r="1"/><text class="nm" x="377" y="304" data-p="1" data-b="2" data-r="1">Ask Billpod</text><text class="sb" x="377" y="326" data-p="1" data-b="2" data-r="1">ctx: person, household, all scopes</text><text class="sb blue" x="377" y="348" data-p="1" data-b="2" data-r="2">a card first for 31 tools</text><rect class="bx blue" x="375" y="366" width="222" height="68" rx="6" data-p="1" data-b="2" data-r="2"/><text class="nm" x="393" y="396" data-p="1" data-b="2" data-r="2">Gemini</text><text class="sb" x="393" y="418" data-p="1" data-b="2" data-r="2">picks <tspan class="mono">mark_paid</tspan> of 46 tools</text><rect class="bx blue" x="359" y="490" width="252" height="112" rx="8" data-p="1" data-b="2" data-r="5"/><text class="nm mono" x="377" y="520" data-p="1" data-b="2" data-r="5">MCP /mcp</text><text class="sb" x="377" y="542" data-p="1" data-b="2" data-r="5">OAuth token, scopes per tool</text><text class="sb blue" x="377" y="564" data-p="1" data-b="2" data-r="5">tools/list shows all 50</text><text class="sb" x="377" y="586" data-p="1" data-b="2" data-r="5">ctx: the token's person and scopes</text><rect class="bx red" x="667" y="274" width="193" height="90" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm mono" x="685" y="304" data-p="1" data-b="3" data-r="3">runTool</text><text class="sb green" x="685" y="326" data-p="1" data-b="3" data-r="3">scopes ✓  input ✓</text><text class="sb" x="685" y="348" data-p="1" data-b="3" data-r="3">a failure becomes a result</text><rect class="bx red" x="667" y="490" width="193" height="112" rx="8" data-p="1" data-b="3" data-r="3"/><text class="nm" x="685" y="520" data-p="1" data-b="3" data-r="3">50 tools</text><text class="sb" x="685" y="542" data-p="1" data-b="3" data-r="3"><tspan class="mono">mark_paid</tspan> and 49 more</text><text class="sb" x="685" y="564" data-p="1" data-b="3" data-r="3">typed input, one handler</text><text class="sb amber" x="685" y="586" data-p="1" data-b="5" data-r="3">upload limit copied in</text><rect class="bx green" x="916" y="274" width="204" height="328" rx="8" data-p="1" data-b="4" data-r="4"/><text class="nm" x="934" y="304" data-p="1" data-b="4" data-r="4">Billpod services</text><text class="sb" x="934" y="326" data-p="1" data-b="4" data-r="4">the rules live here</text><text class="sb" x="934" y="358" data-p="1" data-b="4" data-r="4"><tspan class="mono">bills.pay</tspan></text><text class="sb green" x="934" y="380" data-p="1" data-b="4" data-r="4">refuses a 2nd payment</text><text class="sb green" x="934" y="402" data-p="1" data-b="4" data-r="4">checks the household</text><text class="sb green" x="934" y="434" data-p="1" data-b="4" data-r="4">✓ paid · the first request</text><text class="sb red" x="934" y="456" data-p="1" data-b="4" data-r="7">"This bill is already paid."</text><rect class="bx green" x="359" y="662" width="501" height="68" rx="8" data-p="1" data-b="5"/><text class="nm" x="377" y="692" data-p="1" data-b="5">Parity test</text><text class="sb" x="377" y="714" data-p="1" data-b="5">all 79 REST routes: 47 have a tool, 32 a written reason why not</text><rect class="bx" x="916" y="662" width="204" height="68" rx="8" data-p="1" data-b="4"/><text class="nm" x="934" y="692" data-p="1" data-b="4">Database</text><text class="sb" x="934" y="714" data-p="1" data-b="4">households, bills, payments</text><path class="ar" d="M303,122 L355,122" marker-end="url(#toollayer-map-a)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M303,308 L355,308" marker-end="url(#toollayer-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar blue" d="M303,546 L355,546" marker-end="url(#toollayer-map-b)" data-p="1" data-b="2" data-base="1"/><path class="ar" d="M611,133 L1018,133 L1018,270" marker-end="url(#toollayer-map-a)" data-p="1" data-b="4" data-base="1"/><path class="ar blue" d="M611,319 L663,319" marker-end="url(#toollayer-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar blue" d="M611,546 L639,546 L639,319 L663,319" marker-end="url(#toollayer-map-b)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M763,364 L763,486" marker-end="url(#toollayer-map-r)" data-p="1" data-b="3" data-base="1"/><path class="ar red" d="M860,546 L912,546" m