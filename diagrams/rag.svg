<svg class="ov-svg" viewBox="0 0 1120 870" role="img" aria-label="Offline, an indexing job cuts each document into chunks, adds a context line, embeds each chunk with voyage-3 and stores text, vector, keywords and copied access groups in one Postgres chunk table. For each question, your code embeds the question with the same model, runs a vector search and a keyword search that both filter by the caller's groups inside the SQL, merges the two ranked lists with reciprocal rank fusion, keeps the best 5, numbers them in the prompt and calls the model, then turns each citation into a link. Anthropic's failure rate drops from 5.7% to 1.9% as context lines, keyword search and a reranker are added.">
<defs>
<marker id="rag-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
<marker id="rag-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
</defs>
<text class="ttl" x="24" y="38">Your code searches first; the model answers only from the passages it is given</text>

<!-- indexing -->
<rect class="zone" x="12" y="58" width="880" height="194" rx="10"/>
<text class="zl" x="28" y="82">INDEXING · OFFLINE, ONCE PER DOCUMENT AND AGAIN ON EVERY CHANGE</text>

<rect class="bx" x="24" y="96" width="170" height="140" rx="8"/>
<text class="nm" x="42" y="126">Confluence, Jira</text>
<text class="sb" x="42" y="150">pages and tickets</text>
<text class="sb" x="42" y="172">240,000 (example)</text>
<text class="sb amber" x="42" y="194">access groups copied</text>
<text class="sb amber" x="42" y="216">re-index on change</text>

<rect class="bx" x="226" y="96" width="190" height="140" rx="8"/>
<text class="nm" x="244" y="126">Chunker</text>
<text class="sb" x="244" y="150">page: cut at headings</text>
<text class="sb" x="244" y="172">ticket: one per comment</text>
<text class="sb" x="244" y="194">≤ about 500 tokens</text>
<text class="sb" x="244" y="216">starts with its source</text>

<rect class="bx amber" x="448" y="96" width="220" height="140" rx="8"/>
<text class="nm" x="466" y="126">Context line (an LLM)</text>
<text class="sb" x="466" y="150">"Ticket OPS-8812, PAY-4012</text>
<text class="sb" x="466" y="172">on Swiss payments" (example)</text>
<text class="sb amber" x="466" y="194">$1.02 per 1M document tokens</text>
<text class="sb green" x="466" y="216">misses 5.7% → 3.7%</text>

<rect class="bx" x="700" y="96" width="172" height="140" rx="8"/>
<text class="nm" x="718" y="126">Embedder</text>
<text class="sb mono" x="718" y="150">voyage-3</text>
<text class="sb" x="718" y="172">1,024 numbers</text>
<text class="sb" x="718" y="194">per chunk, as</text>
<text class="sb mono" x="718" y="216">"document"</text>

<rect class="bx" x="908" y="96" width="188" height="424" rx="8"/>
<text class="nm" x="926" y="126">chunk table</text>
<text class="sb" x="926" y="150">Postgres + pgvector</text>
<text class="sb mono" x="926" y="182">body</text>
<text class="sb" x="926" y="202">text + context line</text>
<text class="sb mono" x="926" y="230">embedding</text>
<text class="sb" x="926" y="250">vector(1024), hnsw</text>
<text class="sb mono" x="926" y="278">tsv</text>
<text class="sb" x="926" y="298">keywords, gin index</text>
<text class="sb mono" x="926" y="326">access_groups</text>
<text class="sb" x="926" y="346">copied from the source</text>
<text class="sb mono" x="926" y="374">doc_url</text>
<text class="sb" x="926" y="394">link to the source</text>
<text class="sb amber" x="926" y="430">new model or new cuts:</text>
<text class="sb amber" x="926" y="452">re-embed every row</text>

<!-- per question -->
<text class="zl" x="24" y="284">EACH QUESTION · BEFORE THE MODEL CALL</text>

<rect class="bx" x="24" y="300" width="180" height="104" rx="8"/>
<text class="nm" x="42" y="330">Operator (example)</text>
<text class="sb" x="42" y="354">"What does PAY-4012</text>
<text class="sb" x="42" y="374">mean? What do we do?"</text>

<rect class="bx" x="456" y="300" width="210" height="112" rx="8"/>
<text class="nm" x="474" y="330">Embed the question</text>
<text class="sb" x="474" y="354">same model: voyage-3</text>
<text class="sb mono" x="474" y="376">input_type "query"</text>
<text class="sb red" x="474" y="398">other model: random hits</text>

<rect class="bx" x="702" y="300" width="170" height="112" rx="8"/>
<text class="nm" x="720" y="330">Vector search</text>
<text class="sb" x="720" y="354">meaning · LIMIT 50</text>
<text class="sb green" x="720" y="376">access filter in SQL</text>
<text class="sb amber" x="720" y="398">may miss PAY-4012</text>

<rect class="bx" x="702" y="428" width="170" height="112" rx="8"/>
<text class="nm" x="720" y="458">Keyword search</text>
<text class="sb" x="720" y="482">full-text · LIMIT 50</text>
<text class="sb green" x="720" y="504">access filter in SQL</text>
<text class="sb green" x="720" y="526">misses 3.7% → 2.9%</text>

<rect class="bx red" x="290" y="432" width="376" height="132" rx="8"/>
<text class="nm" x="308" y="462">Trap: filtering after the search</text>
<text class="sb" x="308" y="486">drop forbidden rows after LIMIT 50: maybe none left</text>
<text class="sb" x="308" y="508">hnsw scans 40, then filters: if 10% pass, ~4 rows</text>
<text class="sb green" x="308" y="532">fix: filter inside the SQL and run</text>
<text class="sb green mono" x="308" y="554">SET hnsw.iterative_scan = strict_order</text>

<rect class="bx" x="702" y="590" width="394" height="132" rx="8"/>
<text class="nm" x="720" y="620">Merge both lists by rank (RRF)</text>
<text class="sb" x="720" y="644">rank r scores 1/(60 + r) in each list; scores add up</text>
<text class="sb" x="720" y="666">scales differ, so only positions count</text>
<text class="sb" x="720" y="690">example: runbook keyword #1 + vector #3 = 0.0323</text>

<rect class="bx" x="472" y="590" width="200" height="132" rx="8"/>
<text class="nm" x="490" y="620">Keep the best 5</text>
<text class="sb" x="490" y="644">more chunks bring</text>
<text class="sb" x="490" y="664">more near-misses</text>
<text class="sb amber" x="490" y="688">reranker: keep 20</text>
<text class="sb green" x="490" y="710">misses 2.9% → 1.9%</text>

<rect class="bx" x="236" y="590" width="204" height="132" rx="8"/>
<text class="nm" x="254" y="620">Numbered prompt</text>
<text class="sb" x="254" y="644">rules, [1]…[5], question</text>
<text class="sb" x="254" y="666">"cite as [1], [2]"</text>
<text class="sb" x="254" y="688">"else say I don't know"</text>

<rect class="bx blue" x="24" y="590" width="180" height="132" rx="8"/>
<text class="nm" x="42" y="620">The model</text>
<text class="sb" x="42" y="644">one user message</text>
<text class="sb" x="42" y="666">max_tokens 1024</text>
<text class="sb amber" x="42" y="688">may obey a chunk's</text>
<text class="sb amber" x="42" y="710">hidden instructions</text>

<!-- measure -->
<rect class="bx green" x="24" y="752" width="560" height="96" rx="8"/>
<text class="nm" x="42" y="782">Measure search alone: recall@5</text>
<text class="sb" x="42" y="806">30 labelled real questions; found if the document is in the top 5</text>
<text class="sb" x="42" y="828">no model call · rerun on every change to chunking, model or ranking</text>

<!-- legend -->
<line class="ar" x1="620" y1="770" x2="656" y2="770" marker-end="url(#rag-a)"/>
<text class="sb" x="666" y="774">text, queries and ids</text>
<line class="ar blue" x1="620" y1="796" x2="656" y2="796" marker-end="url(#rag-b)"/>
<text class="sb" x="666" y="800">the one model call</text>
<text class="sb" x="620" y="830">misses: share of Anthropic's test questions</text>
<text class="sb" x="620" y="850">whose document is not in the top 20</text>

<!-- arrows: indexing -->
<line class="ar" x1="194" y1="166" x2="222" y2="166" marker-end="url(#rag-a)"/>
<line class="ar" x1="416" y1="166" x2="444" y2="166" marker-end="url(#rag-a)"/>
<line class="ar" x1="668" y1="166" x2="696" y2="166" marker-end="url(#rag-a)"/>
<line class="ar" x1="872" y1="166" x2="904" y2="166" marker-end="url(#rag-a)"/>

<!-- arrows: query -->
<line class="ar" x1="204" y1="340" x2="452" y2="340" marker-end="url(#rag-a)"/>
<text class="lb" x="328" y="331" text-anchor="middle">question + callerGroups</text>
<text class="lb" x="328" y="364" text-anchor="middle">groups come from your login</text>
<line class="ar" x1="666" y1="334" x2="698" y2="334" marker-end="url(#rag-a)"/>
<path class="ar" d="M666,392 H684 V470 H698" marker-end="url(#rag-a)"/>
<line class="ar" x1="872" y1="350" x2="904" y2="350" marker-end="url(#rag-a)"/>
<line class="ar" x1="872" y1="480" x2="904" y2="480" marker-end="url(#rag-a)"/>
<line class="ar" x1="1002" y1="520" x2="1002" y2="586" marker-end="url(#rag-a)"/>
<text class="lb" x="994" y="566" text-anchor="end">two ranked lists of ids</text>
<line class="ar" x1="702" y1="650" x2="676" y2="650" marker-end="url(#rag-a)"/>
<line class="ar" x1="472" y1="650" x2="444" y2="650" marker-end="url(#rag-a)"/>
<line class="ar blue" x1="236" y1="650" x2="208" y2="650" marker-end="url(#rag-b)"/>
<line class="ar" x1="110" y1="590" x2="110" y2="408" marker-end="url(#rag-a)"/>
<text class="lb" x="122" y="470">each [n] becomes a link</text>
<text class="lb amber" x="122" y="492">no [n]: a warning</text>
<text class="lb amber" x="122" y="514">cut off: an error</text>
</svg>
