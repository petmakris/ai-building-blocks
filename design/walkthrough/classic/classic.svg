<svg class="ov-svg mk-classic" viewBox="0 0 600 1756" role="img" aria-label="Mark the electricity bill paid, twice. Request 1, in the app's chat: the person writes to Ask Billpod, which builds a context with caller assistant; Gemini, offered 46 tools, picks mark_paid; it is on the confirm list of 31, so the person sees a card and approves; Ask Billpod calls runTool, which checks scopes and input; the handler calls bills.pay, which pays the bill. An hour later, Claude calls tools/call mark_paid on /mcp with an access token; the MCP door builds the same kind of context with caller mcp; destructiveHint leaves asking the person to Claude; the same runner and the same bills.pay refuse: This bill is already paid.">
