<svg class="ov-svg rp" viewBox="0 0 1120 912" role="img" aria-label="Block 01's walkthrough as a route over the tool-layer map, revealed one step at a time. Journey 1 at 09:00: the person writes in the app's chat, Ask Billpod builds the context, Gemini picks mark_paid, a card asks for approval, the call goes to runTool and then bills.pay, which marks the bill paid. Journey 2 at 10:00: Claude calls mark_paid over MCP, decides itself whether to ask first, and the call goes through the same runTool to the same bills.pay, which answers This bill is already paid.">
<defs>
<marker id="rp-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah blue"/></marker>
<marker id="rp-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.4" markerHeight="4.4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah rp-ah-on"/></marker>
</defs>
<text class="ttl" x="24" y="38">Both requests reach the same runner and bills.pay, so the second one is refused</text>
<text class="sb" x="24" y="62">Example: one electricity bill marked paid at 09:00 from the app's chat and again at 10:00 from Claude. Tools and rules are Billpod's own.</text>

<text class="zl" x="24" y="94">WHO ASKS</text>
<text class="zl" x="300" y="94">ENTRY POINT · ITS OWN RULES</text>
<text class="zl" x="610" y="94">THE TOOL LAYER</text>
<text class="zl" x="840" y="94">THE SERVICES</text>

<!-- step 1: journey 1 opens; the person writes; Ask Billpod builds ctx -->
<rect data-s="1" class="zone blue" x="12" y="108" width="564" height="254" rx="10"/>
<text data-s="1" class="zn blue" x="28" y="130">JOURNEY 1 · 09:00 · the app's chat · steps 1-4</text>
<rect data-s="1" class="bx blue" x="24" y="146" width="230" height="70" rx="8"/>
<text data-s="1" class="nm" x="40" y="172">A person in the chat</text>
<text data-s="1" class="sb" x="40" y="196">"I paid the electricity bill"</text>
<rect data-s="1" class="bx blue" x="300" y="146" width="260" height="204" rx="8"/>
<text data-s="1" class="nm" x="318" y="172">Ask Billpod</text>
<text data-s="1" class="sb" x="318" y="196">ctx: person, household,</text>
<text data-s="1" class="sb" x="318" y="216">all scopes, caller <tspan class="mono">"assistant"</tspan></text>
<line data-s="1" class="ar blue" x1="254" y1="192" x2="266" y2="192"/>
<line data-s="1" class="ar blue" x1="288" y1="192" x2="296" y2="192" marker-end="url(#rp-b)"/>
<circle data-s="1" class="rp-bd rp-j1" cx="277" cy="192" r="11"/>
<text data-s="1" class="rp-n" x="277" y="196.5">1</text>

<!-- step 2: Gemini picks; the confirm list; the card and Approve -->
<rect data-s="2" class="bx blue" x="316" y="230" width="228" height="64" rx="6"/>
<text data-s="2" class="nm" x="332" y="254">Gemini</text>
<text data-s="2" class="sb" x="332" y="278">picks <tspan class="mono">mark_paid</tspan> of 46 tools</text>
<text data-s="2" class="sb blue" x="318" y="316">on the confirm list (31 tools):</text>
<text data-s="2" class="sb blue" x="318" y="336">a card before <tspan class="mono">mark_paid</tspan> runs</text>
<rect data-s="2" class="bx" x="24" y="230" width="230" height="110" rx="8"/>
<text data-s="2" class="sb" x="40" y="254">card, from the stored bill</text>
<text data-s="2" class="lb" x="40" y="276">Mark the electricity bill</text>
<text data-s="2" class="lb" x="40" y="296">paid today?</text>
<rect data-s="2" class="bx green" x="40" y="304" width="84" height="28" rx="6"/>
<text data-s="2" class="sb green" x="56" y="323">Approve</text>
<line data-s="2" class="ar blue" x1="300" y1="270" x2="288" y2="270"/>
<line data-s="2" class="ar blue" x1="266" y1="270" x2="258" y2="270" marker-end="url(#rp-b)"/>
<circle data-s="2" class="rp-bd rp-j1" cx="277" cy="270" r="11"/>
<text data-s="2" class="rp-n" x="277" y="274.5">2</text>
<line data-s="2" class="ar blue" x1="254" y1="318" x2="296" y2="318" marker-end="url(#rp-b)"/>

<!-- step 3: into the one runner -->
<rect data-s="3" class="bx red" x="610" y="470" width="190" height="120" rx="8"/>
<text data-s="3" class="nm mono" x="626" y="498">runTool</text>
<text data-s="3" class="sb green" x="626" y="522">scopes ✓  input ✓</text>
<text data-s="3" class="sb" x="626" y="544">then the handler of</text>
<text data-s="3" class="sb" x="626" y="566"><tspan class="mono">mark_paid</tspan>, 1 of 50</text>
<path data-s="3" class="ar blue" d="M560,300 H660 V319"/>
<path data-s="3" class="ar blue" d="M660,341 V466" marker-end="url(#rp-b)"/>
<circle data-s="3" class="rp-bd rp-j1" cx="660" cy="330" r="11"/>
<text data-s="3" class="rp-n" x="660" y="334.5">3</text>
<text data-s="3" class="lb mono" x="680" y="335">runTool(mark_paid, args, ctx)</text>

<!-- step 4: the service the Pay button calls; paid -->
<rect data-s="4" class="bx green" x="840" y="440" width="256" height="206" rx="8"/>
<rect data-s="4" class="bx green" x="856" y="454" width="224" height="34" rx="6"/>
<text data-s="4" class="sb green" x="870" y="476">✓ paid · the 09:00 request</text>
<text data-s="4" class="nm" x="856" y="514">Billpod services</text>
<text data-s="4" class="sb mono" x="856" y="536">bills.pay</text>
<text data-s="4" class="sb green" x="856" y="558">refuses a 2nd payment</text>
<text data-s="4" class="sb green" x="856" y="578">checks the household</text>
<path data-s="4" class="ar blue" d="M770,470 V414 H789"/>
<path data-s="4" class="ar blue" d="M811,414 H1000 V436" marker-end="url(#rp-b)"/>
<circle data-s="4" class="rp-bd rp-j1" cx="800" cy="414" r="11"/>
<text data-s="4" class="rp-n" x="800" y="418.5">4</text>
<text data-s="4" class="lb mono" x="818" y="402">bills.pay(household, bill, body)</text>

<!-- step 5: an hour later, Claude over MCP -->
<rect data-s="5" class="zone blue" x="12" y="612" width="564" height="280" rx="10"/>
<text data-s="5" class="zn blue" x="28" y="634">JOURNEY 2 · 10:00 · Claude over MCP · steps 5-7</text>
<rect data-s="5" class="bx blue" x="24" y="650" width="230" height="228" rx="8"/>
<text data-s="5" class="nm" x="40" y="676">Claude</text>
<text data-s="5" class="sb" x="40" y="698">its own model, no Billpod card</text>
<text data-s="5" class="sb mono" x="40" y="722">tools/call mark_paid</text>
<text data-s="5" class="sb" x="40" y="742">+ access token</text>
<rect data-s="5" class="bx blue" x="300" y="650" width="260" height="228" rx="8"/>
<text data-s="5" class="nm mono" x="318" y="678">MCP /mcp</text>
<text data-s="5" class="sb" x="318" y="702">checks the OAuth token</text>
<text data-s="5" class="sb" x="318" y="730">ctx: token's person,</text>
<text data-s="5" class="sb" x="318" y="750">same household, token's scopes,</text>
<text data-s="5" class="sb" x="318" y="770">caller <tspan class="mono">"mcp"</tspan></text>
<text data-s="5" class="sb blue" x="318" y="798">tools/list shows all 50</text>
<line data-s="5" class="ar blue dash" x1="254" y1="718" x2="266" y2="718"/>
<line data-s="5" class="ar blue dash" x1="288" y1="718" x2="296" y2="718" marker-end="url(#rp-b)"/>
<circle data-s="5" class="rp-bd rp-j2" cx="277" cy="718" r="11"/>
<text data-s="5" class="rp-n" x="277" y="722.5">5</text>
<text data-s="5" class="zl" x="24" y="404">TWO JOURNEYS</text>
<line data-s="5" class="ar blue" x1="24" y1="432" x2="72" y2="432" marker-end="url(#rp-b)"/>
<circle data-s="5" class="rp-bd rp-j1" cx="96" cy="432" r="11"/>
<text data-s="5" class="rp-n" x="96" y="436.5">1</text>
<text data-s="5" class="sb" x="120" y="436">09:00, the app's chat, steps 1-4</text>
<line data-s="5" class="ar blue dash" x1="24" y1="468" x2="72" y2="468" marker-end="url(#rp-b)"/>
<circle data-s="5" class="rp-bd rp-j2" cx="96" cy="468" r="11"/>
<text data-s="5" class="rp-n" x="96" y="472.5">5</text>
<text data-s="5" class="sb" x="120" y="472">10:00, Claude over MCP, steps 5-7</text>

<!-- step 6: the confirmation is Claude's own choice -->
<rect data-s="6" class="bx amber" x="40" y="756" width="198" height="84" rx="6"/>
<text data-s="6" class="sb mono amber" x="58" y="780">destructiveHint: true</text>
<text data-s="6" class="sb" x="58" y="802">Claude alone decides</text>
<text data-s="6" class="sb" x="58" y="822">whether to ask first</text>
<text data-s="6" class="sb amber" x="318" y="836">Billpod's card and step cap</text>
<text data-s="6" class="sb amber" x="318" y="856">do not apply here</text>
<circle data-s="6" class="rp-bd rp-j2" cx="40" cy="776" r="11"/>
<text data-s="6" class="rp-n" x="40" y="780.5">6</text>

<!-- step 7: same runner, same service, same refusal -->
<path data-s="7" class="ar blue dash" d="M560,820 H660 V781"/>
<path data-s="7" class="ar blue dash" d="M660,759 V596" marker-end="url(#rp-b)"/>
<circle data-s="7" class="rp-bd rp-j2" cx="660" cy="770" r="11"/>
<text data-s="7" class="rp-n" x="660" y="774.5">7</text>
<text data-s="7" class="lb mono" x="680" y="775">runTool(mark_paid, args, ctx)</text>
<path data-s="7" class="ar blue dash" d="M770,590 V680 H789"/>
<path data-s="7" class="ar blue dash" d="M811,680 H1000 V652" marker-end="url(#rp-b)"/>
<circle data-s="7" class="rp-bd rp-j2" cx="800" cy="680" r="11"/>
<text data-s="7" class="rp-n" x="800" y="684.5">7</text>
<text data-s="7" class="lb mono" x="818" y="704">bills.pay(household, bill, body)</text>
<rect data-s="7" class="bx red" x="856" y="596" width="224" height="36" rx="6"/>
<text data-s="7" class="sb red" x="870" y="619">"This bill is already paid."</text>
<text data-s="7" class="sb red" x="40" y="864">gets <tspan class="mono">isError: true</tspan> back</text>
</svg>
